<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">Autoresearch timing semantics</title>
  <desc id="desc">Startup is followed by eleven uncounted warmup steps, then 300 seconds of counted training, then fixed validation. Total wall time is longer than five minutes.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <style>.title{font:700 38px Inter,"Noto Sans SC",sans-serif;fill:#f0f6fc}.sub{font:400 18px Inter,"Noto Sans SC",sans-serif;fill:#9da7b3}.h{font:700 20px Inter,"Noto Sans SC",sans-serif;fill:#f0f6fc}.t{font:400 16px Inter,"Noto Sans SC",sans-serif;fill:#c9d1d9}.mono{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f0f6fc}</style>
  </defs>
  <rect width="1440" height="610" fill="url(#bg)"/>
  <text x="70" y="72" class="title">“固定 5 分钟”的精确定义</text>
  <text x="70" y="108" class="sub">TIME_BUDGET 只累计 steady-state step；准备、首次编译、预热和最终验证都在 300 秒之外</text>

  <line x1="92" y1="300" x2="1348" y2="300" stroke="#596575" stroke-width="5"/>
  <rect x="92" y="240" width="190" height="120" rx="16" fill="#18202b" stroke="#596575"/>
  <text x="118" y="278" class="h">Startup</text><text x="118" y="309" class="t">加载 Kernel / 数据</text><text x="118" y="335" class="t">建模、初始化</text>
  <rect x="282" y="220" width="220" height="160" rx="16" fill="#2a2112" stroke="#f2cc60" stroke-width="2"/>
  <text x="308" y="260" class="h" fill="#f2cc60">step 0…10</text><text x="308" y="294" class="t">共 11 个 step</text><text x="308" y="321" class="t">包含首次 compile</text><text x="308" y="348" class="t">不计入 training_seconds</text>
  <rect x="502" y="190" width="650" height="220" rx="18" fill="#10291e" stroke="#7ee787" stroke-width="3"/>
  <text x="540" y="239" class="h" fill="#7ee787">被计时的 steady-state training：≥ 300 s</text>
  <text x="540" y="277" class="t">每个 optimizer step 完成后同步 CUDA 并累加 dt</text>
  <text x="540" y="307" class="t">前 50%：LR 恒定；后 50%：线性 warmdown 到 0</text>
  <text x="540" y="337" class="t">Muon momentum：前 300 steps 从 0.85 → 0.95</text>
  <text x="540" y="367" class="t">Muon weight decay：随 progress 线性衰减到 0</text>
  <rect x="1152" y="240" width="196" height="120" rx="16" fill="#142b42" stroke="#79c0ff" stroke-width="2"/>
  <text x="1178" y="278" class="h">Final eval</text><text x="1178" y="309" class="t">80 个默认 batch</text><text x="1178" y="335" class="t">输出 summary</text>

  <circle cx="92" cy="300" r="8" fill="#f0f6fc"/><circle cx="282" cy="300" r="8" fill="#f2cc60"/><circle cx="502" cy="300" r="8" fill="#7ee787"/><circle cx="1152" cy="300" r="8" fill="#79c0ff"/><circle cx="1348" cy="300" r="8" fill="#f0f6fc"/>
  <text x="92" y="445" class="mono">total_seconds = startup + warmup/compile + counted training + eval</text>
  <text x="92" y="485" class="t">所以“5 分钟”是可比性协议，不是进程墙钟上限；program.md 另设 10 分钟兜底超时。</text>
  <rect x="92" y="522" width="1256" height="42" rx="12" fill="#ff7b72" opacity=".12" stroke="#ff7b72"/>
  <text x="116" y="549" class="t" fill="#ffb3ad">实现细节：schedule 使用本 step 开始前的累计时间，停止条件在该 step 完成后检查，因此会略微越过 300 秒。</text>
</svg>
