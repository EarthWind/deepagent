<polyline points="400,269 451,269" fill="none" stroke="#73879a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="817,269 868,269" fill="none" stroke="#73879a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="407" width="565" height="218" rx="14" fill="#fff" stroke="#d9e3ec"/>
<rect x="48" y="425" width="4" height="28" rx="2" fill="#b75c27"/>
<text x="70" y="450" font-size="22" fill="#b75c27" font-weight="700" text-anchor="start">Node Gate：执行不可用</text>
<text x="70" y="486" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">gate run → requireSupportedIsolation()</text>
<text x="70" y="514" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">缺少经验证的 OS 隔离后端</text>
<text x="70" y="542" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">退出 1：gate.isolation_required</text>
<text x="70" y="570" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">静态 tripwire 与摘要检查仍然存在</text>
<text x="70" y="598" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">不能把它描述成已运行候选性能评估</text>
<rect x="651" y="407" width="581" height="218" rx="14" fill="#fff" stroke="#d9e3ec"/>
<rect x="651" y="425" width="4" height="28" rx="2" fill="#3764ad"/>
<text x="673" y="450" font-size="22" fill="#3764ad" font-weight="700" text-anchor="start">Rust ecc2：本地记录分数门控</text>
<text x="673" y="486" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">候选配置 SHA-256 + 相同 seed 的基线</text>
<text x="673" y="514" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">样本数、均值差与 win rate 条件</text>
<text x="673" y="542" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">SQLite active pointer + 审计记录</text>
<text x="673" y="570" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">分数 / health / evidence 由操作员提供</text>
<text x="673" y="598" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">active pointer 不自动部署到宿主</text>
<rect x="48" y="665" width="1184" height="81" rx="14" fill="#eaf5f3" stroke="#c7e2de"/>
<text x="70" y="700" font-size="20" fill="#087e82" font-weight="700" text-anchor="start">真正的改进验收还需要真实任务对照：完成率、回归、返工、成本、时延与知识质量。</text>
<text x="70" y="728" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">本文通过源码与局部测试确认机制，不将其转换成未经测量的模型性能结论。</text>
