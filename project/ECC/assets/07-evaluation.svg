<text x="487" y="263" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">追加 journal.ndjson</text>
<text x="487" y="291" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">parent_hash 链接前序记录</text>
<text x="487" y="319" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">可重建 projection</text>
<rect x="882" y="184" width="350" height="166" rx="14" fill="#fff" stroke="#d9e3ec"/>
