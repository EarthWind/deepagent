<text x="48" y="99" font-size="32" fill="#152c40" font-weight="700" text-anchor="start">记录一致性、执行安全与业务效果是不同问题</text>
<text x="48" y="133" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">这张图分开展示 Node 证据系统与 Rust Alpha 的 recorded-measurements 门控。</text>
<rect x="48" y="184" width="350" height="166" rx="14" fill="#fff" stroke="#d9e3ec"/>
<rect x="48" y="202" width="4" height="28" rx="2" fill="#087e82"/>
<text x="70" y="227" font-size="22" fill="#087e82" font-weight="700" text-anchor="start">执行轨迹与产物引用</text>
<text x="70" y="263" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">事件 envelope</text>
<text x="70" y="291" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">受限内容与确定性序列化</text>
<text x="70" y="319" font-size="17" fill="#566a7c" font-weight="400" text-anchor="start">来源与任务关联</text>
