<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="908" viewBox="0 0 1280 908" role="img" aria-labelledby="title desc">
<title id="title">一次响应的事件时间线</title><desc id="desc">以下按 Claude Hook 注册整理；模型工作流由宿主与模型推进，事件项不构成固定业务 DAG。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#73879a" stroke-width="1.5"/></marker></defs>
