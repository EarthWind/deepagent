<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title desc">
  <title id="title">Cherry Studio 普通聊天单轮时序</title>
  <desc id="desc">从用户发送消息，经 Renderer、IPC、StreamManager、AiService、Agent 与模型工具，到 Main 持久化和 UI 重连。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080f1d"/><stop offset="1" stop-color="#171224"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#67e8f9"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#fb7185"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e2e8f0}.h1{font-size:36px;font-weight:800}.sub{font-size:17px;fill:#9eacc2}.lane{font-size:18px;font-weight:750}.s{font-size:15px}.n{font-size:13px;fill:#a6b4c8}.life{stroke:#53657c;stroke-width:2;stroke-dasharray:8 8}.req{stroke:#67e8f9;stroke-width:2.5;fill:none;marker-end:url(#a)}.ret{stroke:#fb7185;stroke-width:2.5;fill:none;stroke-dasharray:7 5;marker-end:url(#b)}
    </style>
  </defs>
  <rect width="1600" height="1140" fill="url(#bg)"/>
  <text x="70" y="62" class="h1">普通 Chat：一条消息如何跨进程流动并可靠落盘</text>
  <text x="70" y="96" class="sub">核心语义：Renderer 是可丢失订阅者；Main 才是流、审批和最终消息的拥有者。</text>
  <g>
    <rect x="55" y="135" width="200" height="62" rx="16" fill="#3a1830" stroke="#fb7185"/><text x="155" y="174" text-anchor="middle" class="lane">Renderer</text>
    <rect x="290" y="135" width="200" height="62" rx="16" fill="#20224a" stroke="#a78bfa"/><text x="390" y="174" text-anchor="middle" class="lane">IPC / Dispatch</text>
    <rect x="525" y="135" width="220" height="62" rx="16" fill="#123149" stroke="#38bdf8"/><text x="635" y="174" text-anchor="middle" class="lane">AiStreamManager</text>
    <rect x="780" y="135" width="220" height="62" rx="16" fill="#2b2643" stroke="#c084fc"/><text x="890" y="174" text-anchor="middle" class="lane">AiService / Agent</text>
    <rect x="1035" y="135" width="210" height="62" rx="16" fill="#18362e" stroke="#34d399"/><text x="1140" y="174" text-anchor="middle" class="lane">Provider / Tool</text>
    <rect x="1280" y="135" width="250" height="62" rx="16" fill="#35281e" stroke="#f59e0b"/><text x="1405" y="174" text-anchor="middle" class="lane">Persistence / Cache</text>
    <line x1="155" y1="197" x2="155" y2="1060" class="life"/><line x1="390" y1="197" x2="390" y2="1060" class="life"/><line x1="635" y1="197" x2="635" y2="1060" class="life"/><line x1="890" y1="197" x2="890" y2="1060" class="life"/><line x1="1140" y1="197" x2="1140" y2="1060" class="life"/><line x1="1405" y1="197" x2="1405" y2="1060" class="life"/>
  </g>
  <g class="s">
    <path d="M155 240H380" class="req"/><text x="267" y="230" text-anchor="middle">① useChat.sendMessages → ai.stream.open</text>
    <path d="M390 285H1395" class="req"/><text x="890" y="275" text-anchor="middle">② ContextProvider 校验并原子写 user + pending assistant</text>
    <path d="M390 330H625" class="req"/><text x="507" y="320" text-anchor="middle">③ dispatch(topicId)</text>
    <rect x="545" y="350" width="180" height="82" rx="12" fill="#15344a" stroke="#38bdf8"/><text x="635" y="379" text-anchor="middle">Admission</text><text x="635" y="403" text-anchor="middle" class="n">新建 / 注入 / 拒绝</text><text x="635" y="423" text-anchor="middle" class="n">每模型一个 execution</text>
    <path d="M635 458H880" class="req"/><text x="758" y="448" text-anchor="middle">④ streamText(request, signal)</text>
    <rect x="800" y="478" width="180" height="115" rx="12" fill="#302949" stroke="#c084fc"/><text x="890" y="507" text-anchor="middle">buildAgentParams</text><text x="890" y="531" text-anchor="middle" class="n">provider / endpoint</text><text x="890" y="552" text-anchor="middle" class="n">tools / MCP / prompt</text><text x="890" y="573" text-anchor="middle" class="n">retry / hooks / media</text>
    <path d="M890 618H1130" class="req"/><text x="1010" y="608" text-anchor="middle">⑤ ToolLoopAgent.stream</text>
    <path d="M1140 661H900" class="ret"/><text x="1020" y="649" text-anchor="middle">text / reasoning / tool-call delta</text>
    <path d="M890 704H1130" class="req"/><text x="1010" y="694" text-anchor="middle">⑥ needsApproval → execute → result</text>
    <path d="M1140 747H900" class="ret"/><text x="1020" y="736" text-anchor="middle">ToolResult；必要时继续模型 step</text>
    <path d="M890 790H645" class="ret"/><text x="768" y="779" text-anchor="middle">UIMessageChunk stream</text>
    <rect x="545" y="812" width="180" height="90" rx="12" fill="#15344a" stroke="#38bdf8"/><text x="635" y="842" text-anchor="middle">pipeStreamLoop</text><text x="635" y="866" text-anchor="middle" class="n">读取一次、广播多份</text><text x="635" y="887" text-anchor="middle" class="n">同时累积最终快照</text>
    <path d="M625 927H165" class="ret"/><text x="395" y="916" text-anchor="middle">⑦ ai.stream.chunk（按 topic / execution 分流）</text>
    <path d="M645 972H1395" class="req"/><text x="1020" y="961" text-anchor="middle">⑧ terminal listener 写 assistant、usage、timing，更新 shared cache</text>
    <path d="M1395 1015H165" class="ret"/><text x="780" y="1004" text-anchor="middle">⑨ done / error / aborted；Renderer 重新查询持久消息</text>
  </g>
  <rect x="70" y="1072" width="1460" height="46" rx="14" fill="#211b2d" stroke="#64748b"/>
  <text x="800" y="1101" text-anchor="middle" class="s">窗口卸载只 detach 当前订阅者，生成继续并由 Main 落盘；只有显式 Stop 才 abortAndDrain。这是重连与多窗口一致性的关键。</text>
</svg>
