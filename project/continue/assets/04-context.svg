<title id="title">上下文是一条编译管道</title><desc id="desc">模型看到的消息列表，与 UI 展示和磁盘保存的完整历史，并不是同一个视图。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#739487" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#16362f}.small{font-size:16px;fill:#58706a}.body{font-size:19px}.label{font-size:17px;font-weight:650}.card-title{font-size:23px;font-weight:750}</style>
<rect width="1280" height="820" fill="#f5f8f3"/>
<rect x="0" y="0" width="1280" height="10" fill="#147a60"/>
<text x="44" y="53" font-size="14" font-weight="750" letter-spacing="2" fill="#147a60">CONTINUE / SOURCE NOTES / 04</text>
<text x="44" y="101" font-size="32" font-weight="800">上下文是一条编译管道</text>
<text x="44" y="135" class="small">模型看到的消息列表，与 UI 展示和磁盘保存的完整历史，并不是同一个视图。</text>
<rect x="44" y="180" width="340" height="113" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="196" width="5" height="30" rx="2" fill="#147a60"/>
<text x="64" y="220" class="card-title" style="fill:#147a60">任务和显式上下文</text>
<text x="64" y="257" class="body">用户输入 / 文件 / 选区</text>
<rect x="44" y="322" width="340" height="113" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="338" width="5" height="30" rx="2" fill="#147a60"/>
<text x="64" y="362" class="card-title" style="fill:#147a60">历史与工具状态</text>
<text x="64" y="399" class="body">toolCallStates / 工具结果</text>
<rect x="44" y="464" width="340" height="113" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="480" width="5" height="30" rx="2" fill="#147a60"/>
<text x="64" y="504" class="card-title" style="fill:#147a60">规则与技能</text>
<text x="64" y="541" class="body">Rules 条件匹配 / 按需读 Skill</text>
<rect x="471" y="180" width="340" height="397" rx="14" fill="white" stroke="#ccdcd0"/><rect x="471" y="196" width="5" height="30" rx="2" fill="#3462a3"/>
<text x="491" y="220" class="card-title" style="fill:#3462a3">constructMessages</text>
<text x="491" y="257" class="body">1. 从最近摘要之后取历史</text>
<text x="491" y="286" class="body">2. ContextItems 放入用户消息</text>
<text x="491" y="315" class="body">3. 按工具状态重建 tool 消息</text>
<text x="491" y="344" class="body">4. 选择适用 Rules</text>
<text x="491" y="373" class="body">5. 摘要拼入系统消息</text>
<text x="491" y="402" class="body"></text>
<text x="491" y="431" class="body">保持调用与结果的对应关系</text>
<polyline points="384,237 471,237" fill="none" stroke="#739487" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="384,378 471,378" fill="none" stroke="#739487" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="384,520 471,520" fill="none" stroke="#739487" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="898" y="180" width="338" height="397" rx="14" fill="white" stroke="#ccdcd0"/><rect x="898" y="196" width="5" height="30" rx="2" fill="#a26918"/>
<text x="918" y="220" class="card-title" style="fill:#a26918">compileChatMessages</text>
<text x="918" y="257" class="body">估算 system / tools / 历史</text>
<text x="918" y="286" class="body">保护最后一组用户或工具消息</text>
<text x="918" y="315" class="body">预留输出与计数缓冲</text>
<text x="918" y="344" class="body">必要时从旧历史开始裁剪</text>
<text x="918" y="373" class="body"></text>
<text x="918" y="402" class="body">保留项都放不下 → 报错</text>
<text x="918" y="431" class="body">随后交给模型适配器</text>
<polyline points="811,375 898,375" fill="none" stroke="#739487" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="44" y="620" width="1192" height="95" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="636" width="5" height="30" rx="2" fill="#147a60"/>
<text x="64" y="660" class="card-title" style="fill:#147a60">IDE 预算：history ≤ C − safety − min(1000, maxTokens) − system − tools − protected tail</text>
<text x="64" y="697" class="body">这是编译阶段的最小输出预留；不能把它解释成始终保留完整 maxTokens。</text>
<rect x="44" y="729" width="1192" height="45" rx="8" fill="#e4eee4"/>
<text x="62" y="758" class="small">Skills 的正文通常在调用 read_skill 后进入工具结果；技能目录的名字和描述已占用工具定义预算。</text>
<text x="44" y="802" class="small">原创源码关系图 · 5522c6f44ca0 · S19–S27 · 非产品截图 / 非性能测量</text>
</svg>