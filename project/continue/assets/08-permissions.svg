<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">模式和审批的实际边界</title><desc id="desc">工具描述表达意图；策略决定工具可见性和执行许可；系统隔离必须由宿主另行提供。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#739487" stroke-width="1.5"/></marker></defs>
<style>text{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#16362f}.small{font-size:16px;fill:#58706a}.body{font-size:19px}.label{font-size:17px;font-weight:650}.card-title{font-size:23px;font-weight:750}</style>
<rect width="1280" height="850" fill="#f5f8f3"/>
<rect x="0" y="0" width="1280" height="10" fill="#147a60"/>
<text x="44" y="53" font-size="14" font-weight="750" letter-spacing="2" fill="#147a60">CONTINUE / SOURCE NOTES / 08</text>
<text x="44" y="101" font-size="32" font-weight="800">模式和审批的实际边界</text>
<text x="44" y="135" class="small">工具描述表达意图；策略决定工具可见性和执行许可；系统隔离必须由宿主另行提供。</text>
<rect x="44" y="186" width="570" height="362" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="202" width="5" height="30" rx="2" fill="#147a60"/>
<text x="64" y="226" class="card-title" style="fill:#147a60">IDE</text>
<text x="64" y="263" class="body">Chat：不暴露工具</text>
<text x="64" y="292" class="body">Plan：过滤内建非 readonly 工具</text>
<text x="64" y="321" class="body">第三方 MCP 工具不受同样的过滤</text>
<text x="64" y="350" class="body"></text>
<text x="64" y="379" class="body">动态权限原则上只能收紧</text>
<text x="64" y="408" class="body">编辑工具将审阅交给 Diff 生命周期</text>
<text x="64" y="437" class="body">工作区外文件访问可提升为需审批</text>
<rect x="660" y="186" width="576" height="362" rx="14" fill="white" stroke="#ccdcd0"/><rect x="660" y="202" width="5" height="30" rx="2" fill="#3462a3"/>
<text x="680" y="226" class="card-title" style="fill:#3462a3">CLI</text>
<text x="680" y="263" class="body">Plan：排除 Edit / MultiEdit / Write</text>
<text x="680" y="292" class="body">Bash 与 MCP 通配仍可 allow</text>
<text x="680" y="321" class="body">Headless：仅暴露 allow 的工具</text>
<text x="680" y="350" class="body"></text>
<text x="680" y="379" class="body">策略首个匹配项生效</text>
<text x="680" y="408" class="body">动态 disabled 始终优先</text>
<text x="680" y="437" class="body">动态 ask 不覆盖静态 allow</text>
<rect x="44" y="590" width="1192" height="146" rx="14" fill="white" stroke="#ccdcd0"/><rect x="44" y="606" width="5" height="30" rx="2" fill="#a26918"/>
<text x="64" y="630" class="card-title" style="fill:#a26918">实验性 Subagent：需要单独审查的共享状态</text>
<text x="64" y="667" class="body">默认 beta 关闭；启用后会临时覆盖全局权限、系统提示方法和历史服务 ready 行为。</text>
<text x="64" y="696" class="body">它不是独立进程或隔离容器；并发重入、权限继承和异常恢复需要专门验证。</text>
<rect x="44" y="759" width="1192" height="45" rx="8" fill="#e4eee4"/>
<text x="62" y="788" class="small">结论：Plan / readonly / 工具审批 ≠ 完整只读文件系统；Shell 与 MCP 的副作用要由真实执行边界约束。</text>
<text x="44" y="832" class="small">原创源码关系图 · 5522c6f44ca0 · S09–S10 / S46–S52 · 非产品截图 / 非性能测量</text>
</svg>