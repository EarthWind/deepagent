<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Subagent provider and continuable activation topology</title>
  <desc id="desc">A parent agent delegates through a provider registry to one-shot or continuable children, with durable session identity, adjacency authorization, cold resume and child-first teardown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#151b33"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#74a0ff"/></marker>
    <style>.t{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;fill:#f4f7ff}.m{fill:#9dabc9}.h{font-size:21px;font-weight:760}.s{font-size:15px}.xs{font-size:13px}.w{stroke:#74a0ff;stroke-width:2.7;fill:none;marker-end:url(#a)}.d{stroke:#4eb8a6;stroke-width:2.4;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text class="t" x="65" y="70" font-size="36" font-weight="800">Subagent：提供方可替换，持久生命周期归 Manager</text>
  <text class="t m" x="65" y="106" font-size="18">一次性委派和可继续子 Agent 共用接口，但恢复、消息与所有权语义不同</text>

  <rect x="75" y="195" width="300" height="150" rx="24" fill="#202d4e" stroke="#5a7cc3" stroke-width="2"/>
  <text class="t h" x="115" y="240">Parent Agent</text><text class="t m s" x="115" y="275">Session P</text><text class="t m s" x="115" y="302">模型调用 subagent 工具</text>
  <path class="w" d="M375 270 H510"/>

  <rect x="515" y="175" width="440" height="190" rx="24" fill="#152641" stroke="#4971ad" stroke-width="2"/>
  <text class="t h" x="550" y="218">ctx.subagents Provider Registry</text>
  <g class="t xs">
    <rect x="550" y="248" width="90" height="45" rx="10" fill="#26395b"/><text x="573" y="276">spawn</text>
    <rect x="650" y="248" width="90" height="45" rx="10" fill="#26395b"/><text x="677" y="276">fork</text>
    <rect x="750" y="248" width="75" height="45" rx="10" fill="#25414e"/><text x="773" y="276">ACP</text>
    <rect x="835" y="248" width="85" height="45" rx="10" fill="#25414e"/><text x="850" y="276">SDK / CLI</text>
    <text class="m" x="550" y="330">Provider 只声明能力与创建输入，不拥有统一 manager 语义</text>
  </g>

  <path class="w" d="M955 240 C1040 240 1040 205 1115 205"/><path class="w" d="M955 305 C1040 305 1040 500 1115 500"/>

  <rect x="1120" y="145" width="405" height="215" rx="24" fill="#292d46" stroke="#7f78ba" stroke-width="2"/>
  <text class="t h" x="1155" y="190">One-shot Run</text>
  <text class="t m s" x="1155" y="225">一个结果 · 无 steering · 无恢复</text>
  <rect x="1155" y="255" width="335" height="68" rx="13" fill="#343654"/><text class="t xs" x="1180" y="282">await run.result</text><text class="t xs" x="1180" y="305">finally await run.dispose()</text>

  <rect x="1050" y="430" width="475" height="300" rx="24" fill="#173a45" stroke="#4eb8a6" stroke-width="2"/>
  <text class="t h" x="1085" y="475">Continuable Activation</text>
  <text class="t m s" x="1085" y="507">Session C + AgentHandle + durable inbox</text>
  <rect x="1085" y="535" width="405" height="58" rx="13" fill="#1e4a50"/><text class="t xs" x="1110" y="559">sendMessage：仅相邻 parent ↔ child</text><text class="t xs" x="1110" y="579">running → steer；idle → wake；absent → cold resume</text>
  <rect x="1085" y="610" width="405" height="58" rx="13" fill="#21414e"/><text class="t xs" x="1110" y="634">interrupt：取消当前 turn，但保留 inbox 与 Activation</text><text class="t xs" x="1110" y="654">随后可由 waking message 恢复</text>
  <rect x="1085" y="685" width="405" height="28" rx="8" fill="#273448"/><text class="t xs" x="1110" y="705">settle：idle + inbox 空 + 后代已释放 + final flush</text>

  <rect x="75" y="455" width="800" height="275" rx="24" fill="#121e37" stroke="#3f5a8d" stroke-width="2"/>
  <text class="t h" x="110" y="500">Continuation Manager 的四个硬约束</text>
  <g class="t s">
    <circle cx="130" cy="548" r="8" fill="#62d1b5"/><text x="155" y="554">身份：descriptor 写入 child 自己的只追加 Session 后缀</text>
    <circle cx="130" cy="593" r="8" fill="#62d1b5"/><text x="155" y="599">所有权：每个 Session 同一时刻至多一个存活 Activation</text>
    <circle cx="130" cy="638" r="8" fill="#62d1b5"/><text x="155" y="644">鉴权：消息只跨一条父子边；拒绝 sibling / self / stale ancestor</text>
    <circle cx="130" cy="683" r="8" fill="#62d1b5"/><text x="155" y="689">释放：先取消传播，再 child-first dispose；一个分支失败不跳过其他分支</text>
  </g>
  <path class="d" d="M875 600 H1040"/>

  <rect x="75" y="780" width="1450" height="62" rx="18" fill="#171f38" stroke="#3d4f7b"/>
  <text class="t s" x="105" y="817">工程意义：Provider 解决“在哪里、用什么模型创建”；Manager 解决“谁拥有、如何继续、何时恢复、怎样安全停稳”。</text>
</svg>
