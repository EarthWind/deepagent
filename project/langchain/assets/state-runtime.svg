<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">LangChain Agent 状态与持久化边界</title>
  <desc id="desc">区分输入消息、可变状态、运行上下文、线程检查点和跨线程存储</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#12233a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#68dda5"/></marker><style>.s{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.m{font-family:"JetBrains Mono",monospace}.t{fill:#f5f8fc}.sub{fill:#9db2ca}.box{fill:#12283f;stroke:#3a536e;stroke-width:2}.arr{stroke:#68dda5;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="850" rx="28" fill="url(#bg)"/>
  <text class="s t" x="70" y="68" font-size="33" font-weight="800">“记忆”不是一个变量：五种数据有五种寿命</text>
  <text class="s sub" x="70" y="104" font-size="17">把 context、state、checkpoint、store 和 config 混在一起，是 Agent 线上事故的常见起点</text>

  <g transform="translate(70 155)">
    <g transform="translate(0 55)"><rect class="box" width="205" height="130" rx="20"/><text class="s" x="102" y="40" text-anchor="middle" fill="#79b7ff" font-size="17" font-weight="700">Input</text><text class="m t" x="102" y="72" text-anchor="middle" font-size="14">messages</text><text class="s sub" x="102" y="101" text-anchor="middle" font-size="13">本轮新增输入</text></g>
    <path class="arr" d="M205 120H292"/>
    <g transform="translate(292 0)"><rect width="476" height="240" rx="24" fill="#16342f" stroke="#68dda5" stroke-width="2.5"/><text class="s" x="238" y="45" text-anchor="middle" fill="#68dda5" font-size="17" font-weight="700">AgentState · mutable</text><text class="m t" x="35" y="87" font-size="15">messages: Annotated[list, add_messages]</text><text class="m t" x="35" y="124" font-size="15">jump_to: EphemeralValue</text><text class="m t" x="35" y="161" font-size="15">structured_response: output-only</text><text class="s sub" x="35" y="201" font-size="13">middleware 可扩展 schema；节点返回局部 update，由 reducer 合并</text></g>
    <path class="arr" d="M768 120H855"/>
    <g transform="translate(855 55)"><rect class="box" width="205" height="130" rx="20"/><text class="s" x="102" y="40" text-anchor="middle" fill="#79b7ff" font-size="17" font-weight="700">Output</text><text class="m t" x="102" y="72" text-anchor="middle" font-size="14">messages</text><text class="s sub" x="102" y="101" text-anchor="middle" font-size="13">+ structured_response</text></g>
    <g transform="translate(1092 22)"><rect width="238" height="196" rx="20" fill="#20263d" stroke="#765fa7" stroke-width="2"/><text class="s" x="119" y="42" text-anchor="middle" fill="#c6adff" font-size="17" font-weight="700">Runtime context</text><text class="s sub" x="25" y="80" font-size="13">调用期不可变依赖</text><text class="m t" x="25" y="111" font-size="13">tenant_id</text><text class="m t" x="25" y="139" font-size="13">user_id / authz</text><text class="m t" x="25" y="167" font-size="13">request-scoped clients</text></g>
    <path d="M1211 218V287H663" stroke="#c6adff" stroke-width="2" fill="none" marker-end="url(#a)"/><text class="s" x="990" y="276" fill="#a995d7" font-size="12">注入 model / middleware / ToolRuntime</text>

    <g transform="translate(0 345)"><rect width="394" height="204" rx="22" fill="#172d45" stroke="#79b7ff" stroke-width="2"/><text class="s" x="197" y="43" text-anchor="middle" fill="#79b7ff" font-size="19" font-weight="800">Checkpointer</text><text class="m t" x="32" y="84" font-size="14">scope = thread_id</text><text class="s sub" x="32" y="116" font-size="14">每个图 step 持久化状态快照</text><text class="s sub" x="32" y="145" font-size="14">支持对话续接、interrupt/resume</text><text class="s sub" x="32" y="174" font-size="14">生产：数据库后端 + 幂等副作用</text></g>
    <g transform="translate(454 345)"><rect width="394" height="204" rx="22" fill="#16342f" stroke="#68dda5" stroke-width="2"/><text class="s" x="197" y="43" text-anchor="middle" fill="#68dda5" font-size="19" font-weight="800">Store</text><text class="m t" x="32" y="84" font-size="14">scope = namespace + key</text><text class="s sub" x="32" y="116" font-size="14">跨 thread 的长期记忆与业务资料</text><text class="s sub" x="32" y="145" font-size="14">通过 runtime.store 访问</text><text class="s sub" x="32" y="174" font-size="14">必须纳入 tenant / user 隔离</text></g>
    <g transform="translate(908 345)"><rect width="422" height="204" rx="22" fill="#20263d" stroke="#765fa7" stroke-width="2"/><text class="s" x="211" y="43" text-anchor="middle" fill="#c6adff" font-size="19" font-weight="800">RunnableConfig</text><text class="m t" x="32" y="84" font-size="14">configurable.thread_id</text><text class="s sub" x="32" y="116" font-size="14">tags / metadata / callbacks</text><text class="s sub" x="32" y="145" font-size="14">递归上限、并发和 trace 控制</text><text class="s sub" x="32" y="174" font-size="14">是运行控制，不应承载业务真相</text></g>
    <path class="arr" d="M197 345V288H430"/><path class="arr" d="M651 345V288"/>
  </g>
  <text class="s" x="70" y="812" fill="#758ba5" font-size="14">经验法则：短期对话进 state/checkpoint；跨会话事实进 store；鉴权与依赖进 context；追踪和线程标识进 config。</text>
</svg>
