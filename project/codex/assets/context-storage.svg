<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">Codex 上下文与持久化</title>
  <desc id="desc">展示世界状态、模型历史、压缩窗口、rollout JSONL 和 SQLite 投影的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset="1" stop-color="#121a2d"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.h{font:700 19px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.t{font:500 14px Inter,"Noto Sans SC",sans-serif;fill:#cbd5e1}.tiny{font:500 12px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.mono{font:600 12px "JetBrains Mono",monospace;fill:#cbd5e1}
      .box{fill:#111d31;stroke:#334155;stroke-width:1.5}.cyan{fill:#0c2933;stroke:#22d3ee}.green{fill:#0e2a25;stroke:#34d399}.purple{fill:#261d3b;stroke:#a78bfa}.orange{fill:#352415;stroke:#fb923c}
      .arr{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1440" height="930" rx="28" fill="url(#bg)"/>
  <text x="64" y="64" class="title">上下文不是字符串：World State、History 与 Projection</text>
  <text x="64" y="94" class="sub">模型可见历史保持增量；压缩/回滚是显式重写边界；持久化保留可重建状态</text>

  <text x="64" y="144" class="tiny">DYNAMIC WORLD STATE</text>
  <g>
    <rect x="64" y="163" width="196" height="76" rx="13" class="box"/><text x="162" y="194" text-anchor="middle" class="h">AGENTS.md</text><text x="162" y="219" text-anchor="middle" class="tiny">root → cwd · bounded</text>
    <rect x="280" y="163" width="196" height="76" rx="13" class="box"/><text x="378" y="194" text-anchor="middle" class="h">Environment</text><text x="378" y="219" text-anchor="middle" class="tiny">cwd · OS · capability roots</text>
    <rect x="496" y="163" width="196" height="76" rx="13" class="box"/><text x="594" y="194" text-anchor="middle" class="h">Permissions</text><text x="594" y="219" text-anchor="middle" class="tiny">sandbox · network</text>
    <rect x="712" y="163" width="196" height="76" rx="13" class="box"/><text x="810" y="194" text-anchor="middle" class="h">Model</text><text x="810" y="219" text-anchor="middle" class="tiny">instructions · budget</text>
    <rect x="928" y="163" width="196" height="76" rx="13" class="box"/><text x="1026" y="194" text-anchor="middle" class="h">Plugins / Apps</text><text x="1026" y="219" text-anchor="middle" class="tiny">skills · recommendations</text>
    <rect x="1144" y="163" width="232" height="76" rx="13" class="box"/><text x="1260" y="194" text-anchor="middle" class="h">Collaboration mode</text><text x="1260" y="219" text-anchor="middle" class="tiny">agent role · usage hints</text>
  </g>
  <path d="M162 239V276H720M378 239V276H720M594 239V276H720M810 239V276H720M1026 239V276H720M1260 239V276H720" class="arr"/>

  <rect x="180" y="276" width="1080" height="112" rx="18" class="green"/>
  <text x="720" y="308" text-anchor="middle" class="h">WorldState snapshot</text>
  <text x="720" y="336" text-anchor="middle" class="t">第一次 / 新窗口：render_full()　　稳态 Step：merge_patch(previous) + render_diff()</text>
  <text x="720" y="364" text-anchor="middle" class="tiny">同一 snapshot 同时生成模型可见 fragment 与 rollout patch，避免“记录的状态”和“模型看到的状态”分叉</text>

  <path d="M720 388V433" class="arr"/>
  <rect x="90" y="433" width="1260" height="208" rx="20" class="cyan"/>
  <text x="720" y="466" text-anchor="middle" class="h">ContextManager：当前模型窗口</text>
  <g>
    <rect x="126" y="493" width="208" height="112" rx="12" class="box"/><text x="230" y="522" text-anchor="middle" class="t">Initial context</text><text x="145" y="548" class="tiny">developer policy</text><text x="145" y="570" class="tiny">world state full/diff</text><text x="145" y="592" class="tiny">contextual user</text>
    <rect x="356" y="493" width="208" height="112" rx="12" class="purple"/><text x="460" y="522" text-anchor="middle" class="t">User input</text><text x="375" y="551" class="tiny">text / image / media</text><text x="375" y="576" class="tiny">turn id + metadata</text>
    <rect x="586" y="493" width="208" height="112" rx="12" class="orange"/><text x="690" y="522" text-anchor="middle" class="t">Tool intent</text><text x="605" y="551" class="tiny">先 append canonical item</text><text x="605" y="576" class="tiny">再允许副作用</text>
    <rect x="816" y="493" width="208" height="112" rx="12" class="green"/><text x="920" y="522" text-anchor="middle" class="t">Tool result</text><text x="835" y="551" class="tiny">ordered output</text><text x="835" y="576" class="tiny">truncation policy</text>
    <rect x="1046" y="493" width="268" height="112" rx="12" class="box"/><text x="1180" y="522" text-anchor="middle" class="t">Assistant / reasoning</text><text x="1065" y="551" class="tiny">stream deltas → final item</text><text x="1065" y="576" class="tiny">usage / response metadata</text>
  </g>
  <path d="M334 549H356M564 549H586M794 549H816M1024 549H1046" class="arr"/>

  <path d="M405 641V690" class="arr"/>
  <rect x="90" y="690" width="630" height="142" rx="18" class="orange"/>
  <text x="405" y="722" text-anchor="middle" class="h">显式历史重写边界</text>
  <text x="120" y="752" class="t">compact：summary + 必要用户消息 + initial context</text>
  <text x="120" y="779" class="t">rollback / fork：使用可证明的 rollout 前缀</text>
  <text x="120" y="806" class="tiny">推进 history generation 与 context window id，重建 baseline</text>

  <path d="M1035 641V690" class="arr"/>
  <rect x="750" y="690" width="285" height="142" rx="18" class="purple"/>
  <text x="892" y="722" text-anchor="middle" class="h">Rollout JSONL</text>
  <text x="780" y="752" class="t">canonical append log</text><text x="780" y="779" class="t">history · world state · events</text><text x="780" y="806" class="tiny">resume / audit / migration</text>
  <path d="M1035 761H1070" class="arr"/>
  <rect x="1070" y="690" width="280" height="142" rx="18" class="green"/>
  <text x="1210" y="722" text-anchor="middle" class="h">SQLite projection</text>
  <text x="1100" y="752" class="t">metadata · list · search</text><text x="1100" y="779" class="t">pagination · projects</text><text x="1100" y="806" class="tiny">backfill from rollouts</text>

  <path d="M750 790C650 875 470 875 405 832" class="dash"/><text x="576" y="869" text-anchor="middle" class="tiny">resume reconstructs context</text>
  <rect x="90" y="862" width="1260" height="36" rx="10" fill="#0b2530"/>
  <text x="720" y="885" text-anchor="middle" class="tiny">不变量：JSONL 保存规范事实；SQLite 保存可重建的查询投影；普通 turn 不重写旧历史</text>
</svg>
