<text x="902" y="221" fill="#087f83" font-size="23" font-weight="700">Attempt #2 · 当前</text>
<text x="902" y="256" fill="#152c46" font-size="20" font-weight="400">模型 B → ses_new</text>
<text x="902" y="284" fill="#152c46" font-size="20" font-weight="400">pending → running → 终止</text>
<text x="902" y="312" fill="#152c46" font-size="20" font-weight="400">只有当前尝试投影回 Task</text>
<path d="M382,267 L457,267" stroke="#70849a" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
