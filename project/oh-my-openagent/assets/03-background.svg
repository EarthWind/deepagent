<text x="64" y="256" fill="#152c46" font-size="20" font-weight="400">父会话、任务描述、逻辑状态</text>
<text x="64" y="284" fill="#152c46" font-size="20" font-weight="400">currentAttemptID</text>
<text x="64" y="312" fill="#152c46" font-size="20" font-weight="400">聚合尝试历史</text>
<rect x="461" y="184" width="354" height="170" rx="14" fill="white" stroke="#d7e1ed"/>
<rect x="461" y="198" width="5" height="142" rx="2" fill="#a35f13"/>
<text x="481" y="221" fill="#a35f13" font-size="23" font-weight="700">Attempt #1</text>
<text x="481" y="256" fill="#152c46" font-size="20" font-weight="400">模型 A → ses_old</text>
<text x="481" y="284" fill="#152c46" font-size="20" font-weight="400">超时 / 错误 → 保留历史</text>
<text x="481" y="312" fill="#152c46" font-size="20" font-weight="400">迟到 completed 不覆盖新任务</text>
<rect x="882" y="184" width="354" height="170" rx="14" fill="white" stroke="#d7e1ed"/>
