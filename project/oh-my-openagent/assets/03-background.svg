<text x="666" y="491" fill="#152c46" font-size="20" font-weight="400">活动 / 会话存在性检测 → 终止与资源回收</text>
<text x="666" y="519" fill="#152c46" font-size="20" font-weight="400">结果通知 → 忙碌检查 / 去重 → 唤醒父会话</text>
<text x="666" y="547" fill="#152c46" font-size="20" font-weight="400">父任务读取结果并继续验证</text>
