<text x="64" y="456" fill="#7354b4" font-size="23" font-weight="700">接纳与队列</text>
<text x="64" y="491" fill="#152c46" font-size="20" font-weight="400">模型覆盖 → 独立 model key</text>
<text x="64" y="519" fill="#152c46" font-size="20" font-weight="400">否则可使用 provider key；释放时优先交接槽位</text>
<text x="64" y="547" fill="#152c46" font-size="20" font-weight="400">不是“全局 + Provider + 模型”三层共同限流</text>
<rect x="646" y="419" width="590" height="177" rx="14" fill="white" stroke="#d7e1ed"/>
