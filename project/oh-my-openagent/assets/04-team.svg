<text x="66" y="697" fill="#087f83" font-size="21" font-weight="700">不要扩大保证范围</text>
<text x="66" y="727" fill="#152c46" font-size="18" font-weight="400">任务认领原子性 ≠ 所有副作用幂等；逐收件人广播 ≠ 跨全部收件人的事务。</text>
