<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaude 总体架构</title>
  <desc id="desc">从终端入口、交互和无头模式，到 Agent 循环、工具运行时、上下文与会话，再到多提供商适配层的分层架构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11182d"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .h1{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.label{font:700 20px Inter,"Noto Sans SC",sans-serif;fill:#e2e8f0}.small{font:400 15px Inter,"Noto Sans SC",sans-serif;fill:#b8c4d8}.tiny{font:500 13px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.pill{font:600 13px Inter,"Noto Sans SC",sans-serif;fill:#07111f}.box{stroke:#334155;stroke-width:1.5;filter:url(#shadow)}.flow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="860" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="90" r="180" fill="#2563eb" opacity=".08"/><circle cx="120" cy="780" r="210" fill="#14b8a6" opacity=".06"/>
  <text x="70" y="70" class="h1">OpenClaude：一个内核，多个模型传输</text>
  <text x="70" y="102" class="sub">TypeScript / React + Ink / Commander / Bun 构建 / Node.js 运行</text>

  <rect x="70" y="145" width="1260" height="105" rx="18" fill="#0f2238" class="box"/>
  <text x="105" y="184" class="label">入口与交互面</text>
  <rect x="105" y="202" width="180" height="30" rx="15" fill="#5eead4"/><text x="195" y="222" text-anchor="middle" class="pill">bin/openclaude</text>
  <rect x="305" y="202" width="185" height="30" rx="15" fill="#7dd3fc"/><text x="397" y="222" text-anchor="middle" class="pill">Commander CLI</text>
  <rect x="510" y="202" width="180" height="30" rx="15" fill="#93c5fd"/><text x="600" y="222" text-anchor="middle" class="pill">React + Ink TUI</text>
  <rect x="710" y="202" width="170" height="30" rx="15" fill="#a5b4fc"/><text x="795" y="222" text-anchor="middle" class="pill">--print / SDK</text>
  <rect x="900" y="202" width="185" height="30" rx="15" fill="#c4b5fd"/><text x="992" y="222" text-anchor="middle" class="pill">Headless gRPC</text>
  <rect x="1105" y="202" width="190" height="30" rx="15" fill="#f0abfc"/><text x="1200" y="222" text-anchor="middle" class="pill">本地后台会话</text>

  <path d="M700 250V286" class="flow"/>
  <rect x="70" y="290" width="1260" height="172" rx="18" fill="#111f38" class="box"/>
  <text x="105" y="333" class="label">Agent 控制平面</text>
  <text x="105" y="365" class="small">query() 异步生成器状态机：组装上下文 → 路由模型 → 消费流 → 发现 tool_use → 执行 → 回填 tool_result → 下一轮</text>
  <rect x="105" y="389" width="235" height="45" rx="12" fill="#172c46" stroke="#38bdf8"/><text x="222" y="417" text-anchor="middle" class="small">恢复 / 重试 / 降级</text>
  <rect x="360" y="389" width="235" height="45" rx="12" fill="#172c46" stroke="#2dd4bf"/><text x="477" y="417" text-anchor="middle" class="small">压缩 / 上下文预算</text>
  <rect x="615" y="389" width="235" height="45" rx="12" fill="#172c46" stroke="#818cf8"/><text x="732" y="417" text-anchor="middle" class="small">Agent / 任务 / Fork</text>
  <rect x="870" y="389" width="205" height="45" rx="12" fill="#172c46" stroke="#c084fc"/><text x="972" y="417" text-anchor="middle" class="small">生命周期 Hooks</text>
  <rect x="1095" y="389" width="200" height="45" rx="12" fill="#172c46" stroke="#f472b6"/><text x="1195" y="417" text-anchor="middle" class="small">会话状态与 UI</text>

  <path d="M455 462V498" class="flow"/><path d="M945 462V498" class="flow"/>
  <rect x="70" y="502" width="610" height="182" rx="18" fill="#0e2730" class="box"/>
  <text x="105" y="545" class="label">工具运行时</text>
  <text x="105" y="578" class="small">Tool 接口 + 内建工具 + MCP 动态工具</text>
  <text x="105" y="608" class="small">Schema 校验 · PreToolUse · 权限决策 · 调用 · PostToolUse</text>
  <text x="105" y="638" class="small">只读工具可并发；副作用工具独占；结果按输入顺序提交</text>
  <rect x="105" y="650" width="145" height="23" rx="11" fill="#5eead4"/><text x="177" y="666" text-anchor="middle" class="pill">Bash / Files</text>
  <rect x="265" y="650" width="145" height="23" rx="11" fill="#7dd3fc"/><text x="337" y="666" text-anchor="middle" class="pill">Search / Web</text>
  <rect x="425" y="650" width="100" height="23" rx="11" fill="#a5b4fc"/><text x="475" y="666" text-anchor="middle" class="pill">Agent</text>
  <rect x="540" y="650" width="105" height="23" rx="11" fill="#c4b5fd"/><text x="592" y="666" text-anchor="middle" class="pill">MCP</text>

  <rect x="720" y="502" width="610" height="182" rx="18" fill="#171f3a" class="box"/>
  <text x="755" y="545" class="label">上下文与持久化</text>
  <text x="755" y="578" class="small">分段 System Prompt · 项目指令 · Git 快照 · 可选 Repo Map</text>
  <text x="755" y="608" class="small">Microcompact · Auto compact · Context collapse · Token 预算</text>
  <text x="755" y="638" class="small">追加式 JSONL · parentUuid 会话链 · 分支恢复 · 子 Agent sidechain</text>
  <rect x="755" y="650" width="150" height="23" rx="11" fill="#93c5fd"/><text x="830" y="666" text-anchor="middle" class="pill">Prompt Cache</text>
  <rect x="920" y="650" width="145" height="23" rx="11" fill="#a5b4fc"/><text x="992" y="666" text-anchor="middle" class="pill">Compaction</text>
  <rect x="1080" y="650" width="215" height="23" rx="11" fill="#f0abfc"/><text x="1187" y="666" text-anchor="middle" class="pill">Session JSONL</text>

  <path d="M700 684V720" class="flow"/>
  <rect x="70" y="724" width="1260" height="78" rx="18" fill="#172338" class="box"/>
  <text x="105" y="758" class="label">模型边界：内部统一为 Anthropic Messages / tool_use 语义</text>
  <text x="105" y="785" class="tiny">Native Anthropic · OpenAI-compatible / Codex / Gemini Shim · Bedrock · Vertex · Foundry · Ollama</text>
  <rect x="1100" y="746" width="195" height="32" rx="16" fill="url(#hero)"/><text x="1197" y="767" text-anchor="middle" class="pill">Descriptor-first</text>
</svg>
