<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DeerFlow 2.x 系统架构</title>
  <desc id="desc">从入口层、应用层、Agent Harness 到基础设施层的整体架构，以及各层之间的主要数据流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#102642"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".4"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.layer{font:700 16px Inter,"Noto Sans SC",sans-serif;fill:#5eead4;letter-spacing:1px}.h{font:700 20px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.t{font:400 15px Inter,"Noto Sans SC",sans-serif;fill:#cbd5e1}.small{font:400 13px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.box{fill:#132b46;stroke:#31506f;stroke-width:1.5}.core{fill:#173952;stroke:#5eead4;stroke-width:2}.infra{fill:#111f35;stroke:#334155;stroke-width:1.5}.flow{fill:none;stroke:#7dd3fc;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" class="title">DeerFlow 2.x：Super Agent Harness 全景</text>
  <text x="70" y="98" class="sub">App 负责交互与协议，Harness 负责长任务智能；状态、事件、文件分开持久化</text>

  <text x="70" y="154" class="layer">入口与交互层</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="250" height="112" rx="16" class="box"/>
    <text x="92" y="211" class="h">Web / Next.js</text><text x="92" y="239" class="t">React 19 · LangGraph SDK</text><text x="92" y="264" class="small">SSE 重连、乐观消息、Artifact UI</text>
    <rect x="348" y="175" width="250" height="112" rx="16" class="box"/>
    <text x="370" y="211" class="h">TUI / Python Client</text><text x="370" y="239" class="t">同一 Gateway API</text><text x="370" y="264" class="small">本地工作台与内嵌调用</text>
    <rect x="626" y="175" width="250" height="112" rx="16" class="box"/>
    <text x="648" y="211" class="h">IM Channels</text><text x="648" y="239" class="t">飞书 / Telegram / …</text><text x="648" y="264" class="small">Webhook、会话路由、去重</text>
    <rect x="904" y="175" width="426" height="112" rx="16" class="box"/>
    <text x="926" y="211" class="h">Nginx :2026 → Gateway :8001</text><text x="926" y="239" class="t">FastAPI + 嵌入式 LangGraph Runtime</text><text x="926" y="264" class="small">认证、线程、运行、配置、流式事件 API</text>
  </g>

  <path d="M195 287V326H1117V306" class="flow"/><path d="M473 287V326" class="flow"/><path d="M751 287V326" class="flow"/>
  <text x="70" y="366" class="layer">AGENT HARNESS（可发布 Python 包 deerflow.*）</text>
  <g filter="url(#shadow)">
    <rect x="70" y="389" width="1260" height="286" rx="22" class="core"/>
    <rect x="94" y="420" width="240" height="103" rx="14" class="box"/>
    <text x="114" y="452" class="h">Lead Agent</text><text x="114" y="480" class="t">create_agent()</text><text x="114" y="504" class="small">模型 + Prompt + State Schema</text>
    <rect x="358" y="420" width="285" height="103" rx="14" class="box"/>
    <text x="378" y="452" class="h">Middleware Pipeline</text><text x="378" y="480" class="t">上下文 · 权限 · 可靠性</text><text x="378" y="504" class="small">动态装配，顺序决定语义</text>
    <rect x="667" y="420" width="285" height="103" rx="14" class="box"/>
    <text x="687" y="452" class="h">Tools / MCP / ACP</text><text x="687" y="480" class="t">延迟 Schema · Tool Search</text><text x="687" y="504" class="small">授权前置 + 运行时再校验</text>
    <rect x="976" y="420" width="330" height="103" rx="14" class="box"/>
    <text x="996" y="452" class="h">Skills</text><text x="996" y="480" class="t">发现 → 激活 → 工具策略</text><text x="996" y="504" class="small">Deep Research 是 Skill，不是固定图</text>

    <rect x="94" y="548" width="290" height="96" rx="14" class="box"/>
    <text x="114" y="580" class="h">Sub-agents</text><text x="114" y="608" class="t">隔离消息上下文，共享工作区</text><text x="114" y="631" class="small">容量、超时、轮数、Token 四重边界</text>
    <rect x="408" y="548" width="275" height="96" rx="14" class="box"/>
    <text x="428" y="580" class="h">Context Engineering</text><text x="428" y="608" class="t">压缩摘要 + 耐久语义通道</text><text x="428" y="631" class="small">Skill 引用、委派账本、长期记忆</text>
    <rect x="707" y="548" width="275" height="96" rx="14" class="box"/>
    <text x="727" y="580" class="h">Sandbox / Artifacts</text><text x="727" y="608" class="t">虚拟文件系统 + 执行租约</text><text x="727" y="631" class="small">输出必须经 present_files 交付</text>
    <rect x="1006" y="548" width="300" height="96" rx="14" class="box"/>
    <text x="1026" y="580" class="h">Run Runtime</text><text x="1026" y="608" class="t">RunManager · Journal · Bridge</text><text x="1026" y="631" class="small">租约、恢复、取消、SSE 回放</text>
  </g>

  <path d="M700 675V720" class="flow"/>
  <text x="70" y="738" class="layer">基础设施与持久化</text>
  <g filter="url(#shadow)">
    <rect x="70" y="760" width="245" height="92" rx="15" class="infra"/><text x="91" y="794" class="h">Checkpoint DB</text><text x="91" y="822" class="small">SQLite / PostgreSQL · full / delta</text>
    <rect x="337" y="760" width="245" height="92" rx="15" class="infra"/><text x="358" y="794" class="h">Run Events</text><text x="358" y="822" class="small">memory / DB / JSONL Journal</text>
    <rect x="604" y="760" width="245" height="92" rx="15" class="infra"/><text x="625" y="794" class="h">Redis Streams</text><text x="625" y="822" class="small">跨 worker SSE 桥与重连</text>
    <rect x="871" y="760" width="245" height="92" rx="15" class="infra"/><text x="892" y="794" class="h">Thread Files</text><text x="892" y="822" class="small">workspace / uploads / outputs</text>
    <rect x="1138" y="760" width="192" height="92" rx="15" class="infra"/><text x="1159" y="794" class="h">Memory</text><text x="1159" y="822" class="small">DeerMem / 插件后端</text>
  </g>
</svg>
