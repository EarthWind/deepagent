<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="830" viewBox="0 0 1480 830" role="img" aria-labelledby="title desc">
  <title id="title">DeerFlow Skill 与 Tool 的三道门</title><desc id="desc">展示工具从注册、授权、技能激活、MCP Schema 提升到执行时复核的全过程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091525"/><stop offset="1" stop-color="#17273e"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e8f9"/></marker>
    <style>.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.sub{font:400 15px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.box{fill:#122c46;stroke:#3b5974;stroke-width:1.5}.gate{fill:#183c50;stroke:#5eead4;stroke-width:2}.h{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#f8fafc}.t{font:400 14px Inter,"Noto Sans SC",sans-serif;fill:#cbd5e1}.small{font:400 12px Inter,"Noto Sans SC",sans-serif;fill:#94a3b8}.flow{fill:none;stroke:#67e8f9;stroke-width:2;marker-end:url(#a)}.bad{fill:#3f1d2e;stroke:#fb7185;stroke-width:1.5}.ok{fill:#133b35;stroke:#34d399;stroke-width:1.5}.pill{fill:#0d2238;stroke:#334155}.pt{font:600 12px Inter,"Noto Sans SC",sans-serif;fill:#bae6fd}.formula{font:700 19px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f0fdfa}</style>
  </defs>
  <rect width="1480" height="830" rx="26" fill="url(#bg)"/>
  <text x="60" y="62" class="title">工具不是“注册了就能用”：Schema 可见性与执行权限分离</text>
  <text x="60" y="91" class="sub">DeerFlow 在装配期缩小攻击面，在每次模型调用前缩小上下文，在执行期阻止伪造或陈旧调用</text>

  <rect x="60" y="145" width="255" height="174" rx="18" class="box"/><text x="84" y="181" class="h">候选 Tool Registry</text><text x="84" y="211" class="t">Config tools</text><text x="84" y="237" class="t">Built-ins</text><text x="84" y="263" class="t">MCP / ACP</text><text x="84" y="294" class="small">重名优先级：配置 &gt; 内置 &gt; MCP &gt; ACP</text>
  <path d="M315 232H365" class="flow"/>
  <rect x="375" y="145" width="255" height="174" rx="18" class="gate"/><text x="399" y="181" class="h">门 1：授权与配置</text><text x="399" y="211" class="t">用户 / Agent allowlist</text><text x="399" y="237" class="t">模型能力与 Tool group</text><text x="399" y="263" class="t">AuthZ provider</text><text x="399" y="294" class="small">在暴露给模型之前先裁剪</text>
  <path d="M630 232H680" class="flow"/>
  <rect x="690" y="145" width="310" height="174" rx="18" class="gate"/><text x="714" y="181" class="h">门 2：当前调用的可见性</text><text x="714" y="211" class="t">Skill 已启用 ≠ 已激活</text><text x="714" y="237" class="t">allowed-tools 限制可见 Schema</text><text x="714" y="263" class="t">MCP 未提升时只显示工具名</text><text x="714" y="294" class="small">每次 ModelRequest 都重新求交集</text>
  <path d="M1000 232H1050" class="flow"/>
  <rect x="1060" y="145" width="360" height="174" rx="18" class="gate"/><text x="1084" y="181" class="h">门 3：执行时复核</text><text x="1084" y="211" class="t">授权、Skill policy、Sandbox policy</text><text x="1084" y="237" class="t">Read-before-write、路径与命令范围</text><text x="1084" y="263" class="t">Audit + Receipt + Error normalization</text><text x="1084" y="294" class="small">即使模型构造出隐藏 ToolCall，也拒绝执行</text>

  <rect x="60" y="355" width="1360" height="73" rx="14" class="pill"/><text x="740" y="400" text-anchor="middle" class="formula">可执行工具 = 注册集合 ∩ 授权集合 ∩ Agent 策略 ∩ Skill 激活策略 ∩ Sandbox 策略</text>

  <text x="60" y="483" class="h">Skill 路径</text>
  <rect x="60" y="507" width="250" height="126" rx="16" class="box"/><text x="82" y="540" class="h">发现</text><text x="82" y="568" class="t">只注入 name / description / path</text><text x="82" y="594" class="small">deferred 模式甚至只注入 name</text>
  <path d="M310 570H350" class="flow"/>
  <rect x="360" y="507" width="250" height="126" rx="16" class="box"/><text x="382" y="540" class="h">激活</text><text x="382" y="568" class="t">/skill-name 或 read_file(SKILL.md)</text><text x="382" y="594" class="small">完整说明仅在需要时进入上下文</text>
  <path d="M610 570H650" class="flow"/>
  <rect x="660" y="507" width="250" height="126" rx="16" class="ok"/><text x="682" y="540" class="h">策略生效</text><text x="682" y="568" class="t">allowed-tools 收紧能力</text><text x="682" y="594" class="small">Slash 激活优先，后续不可放宽</text>

  <text x="970" y="483" class="h">MCP Tool Search 路径</text>
  <rect x="970" y="507" width="210" height="126" rx="16" class="box"/><text x="992" y="540" class="h">延迟目录</text><text x="992" y="568" class="t">name + schema hash</text><text x="992" y="594" class="small">Prompt 不携带全部 Schema</text>
  <path d="M1180 570H1210" class="flow"/>
  <rect x="1220" y="507" width="200" height="126" rx="16" class="ok"/><text x="1242" y="540" class="h">按需提升</text><text x="1242" y="568" class="t">tool_search / routing</text><text x="1242" y="594" class="small">promoted 写入线程状态</text>

  <rect x="60" y="681" width="650" height="91" rx="16" class="bad"/><text x="84" y="716" class="h">Fail closed 条件</text><text x="84" y="744" class="t">Skill 引用无法解析、目录 hash 漂移、延迟目录缺失、凭据映射缺失 → 不扩大权限</text>
  <rect x="770" y="681" width="650" height="91" rx="16" class="ok"/><text x="794" y="716" class="h">Prompt-injection 边界</text><text x="794" y="744" class="t">技能秘密通过 request context 注入进程环境，不进入 Prompt、Tool 参数或 Trace</text>
</svg>
