<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode 的事件与持久化数据流</title><desc id="desc">Session 服务发布 EventV2，事件同步投影到 SQLite，同时通过 GlobalBus 和 SSE 到达客户端 reducer。旧 Message Part 模型与新 V2 表在迁移期并存。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c151c"/><stop offset="1" stop-color="#1c2b31"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6fd3c8"/></marker><style>.h1{font:700 34px ui-sans-serif,system-ui;fill:#f4ecdd}.h2{font:700 20px ui-sans-serif,system-ui;fill:#f4ecdd}.t{font:500 15px ui-sans-serif,system-ui;fill:#c5d4d2}.s{font:500 13px ui-sans-serif,system-ui;fill:#91a7a5}.box{fill:#18272f;stroke:#4c6870;stroke-width:1.5}.hot{fill:#12383a;stroke:#57c9be;stroke-width:2}.old{fill:#352d22;stroke:#c79b51;stroke-width:1.7}.edge{fill:none;stroke:#6fd3c8;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#c79b51;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <text x="72" y="68" class="h1">事件是 UI 流与数据库状态之间的单一事实通道</text><text x="72" y="99" class="s">主热路径仍使用 SessionV1 Message / Part；V2 admission 与 context epoch 基础设施已并存</text>
  <rect x="72" y="150" width="280" height="208" rx="20" class="box"/><text x="98" y="187" class="h2">Session 服务</text><text x="98" y="222" class="t">updateMessage</text><text x="98" y="250" class="t">updatePart / delta</text><text x="98" y="278" class="t">status / permission / question</text><text x="98" y="319" class="s">业务代码发布事件，而非到处直接写库</text>
  <path d="M352 254H480" class="edge"/>
  <rect x="482" y="176" width="300" height="156" rx="20" class="hot"/><text x="510" y="216" class="h2">EventV2Bridge</text><text x="510" y="250" class="t">附加 directory / workspace / project</text><text x="510" y="278" class="t">生成事件 ID，桥接 GlobalBus</text><text x="510" y="306" class="s">durable 事件可同步等待投影</text>
  <path d="M782 222H914" class="edge"/><path d="M632 332V438" class="edge"/>
  <rect x="916" y="142" width="448" height="232" rx="20" class="box"/><text x="944" y="182" class="h2">SQLite / Drizzle projector</text><text x="944" y="218" class="t">session</text><text x="1060" y="218" class="t">message (JSON)</text><text x="1216" y="218" class="t">part (JSON)</text><text x="944" y="252" class="t">todo</text><text x="1060" y="252" class="t">usage / cost 聚合</text><text x="944" y="298" class="s">upsert / delete / cascade 由事件投影统一完成</text><rect x="944" y="320" width="392" height="30" rx="8" class="old"/><text x="962" y="341" class="s">另有 JSON Storage：迁移遗留与 session_diff 等</text>
  <rect x="482" y="440" width="300" height="148" rx="20" class="hot"/><text x="510" y="480" class="h2">GlobalBus</text><text x="510" y="514" class="t">按 location 过滤</text><text x="510" y="542" class="t">connected + 10s heartbeat</text><text x="510" y="568" class="s">进程内统一广播</text>
  <path d="M782 514H914" class="edge"/>
  <rect x="916" y="430" width="448" height="172" rx="20" class="box"/><text x="944" y="470" class="h2">SSE → SDK reducer → UI</text><text x="944" y="505" class="t">message.updated · part.updated · part.delta</text><text x="944" y="535" class="t">session.status · permission.asked · question.asked</text><text x="944" y="570" class="s">TUI / Desktop / Web 以相同事件重建流式视图</text>
  <rect x="72" y="654" width="1292" height="104" rx="18" class="old"/><text x="98" y="691" class="h2">迁移提示</text><text x="98" y="721" class="t">代码中已出现 session_message、session_input（admission / promotion sequence）与 session_context_epoch 等新表和 V2 路由；</text><text x="98" y="746" class="s">但本文描述的主要 Prompt 热路径仍由 SessionPrompt + MessageV2（历史命名）驱动，并通过 EventV2 projector 写入旧 session/message/part 表。</text>
</svg>
