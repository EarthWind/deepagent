<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode 权限边界</title><desc id="desc">工具调用经工具可见性、插件钩子、权限规则和用户确认后在主机环境执行。权限是策略闸门而不是操作系统沙箱。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d151b"/><stop offset="1" stop-color="#222a2e"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#70d2c7"/></marker><style>.h1{font:700 34px ui-sans-serif,system-ui;fill:#f4ebdc}.h2{font:700 20px ui-sans-serif,system-ui;fill:#f4ebdc}.t{font:500 15px ui-sans-serif,system-ui;fill:#ccd6d4}.s{font:500 13px ui-sans-serif,system-ui;fill:#94a8a5}.box{fill:#19262d;stroke:#536971;stroke-width:1.5}.hot{fill:#123b3a;stroke:#57c9be;stroke-width:2}.ask{fill:#3a3020;stroke:#d6a44b;stroke-width:1.8}.deny{fill:#3a2323;stroke:#d66f6f;stroke-width:1.8}.edge{fill:none;stroke:#70d2c7;stroke-width:2.5;marker-end:url(#a)}.dash{fill:none;stroke:#d6a44b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/><text x="70" y="68" class="h1">Permission 是策略闸门，不是 OS Sandbox</text><text x="70" y="98" class="s">允许的 Bash、插件和本地 MCP 仍以 OpenCode 进程所属用户权限触达主机</text>
  <rect x="70" y="158" width="230" height="118" rx="18" class="box"/><text x="94" y="195" class="h2">模型提出 Tool Call</text><text x="94" y="226" class="t">tool name + JSON input</text><text x="94" y="252" class="s">schema 已经 Provider 归一化</text><path d="M300 217H368" class="edge"/>
  <rect x="370" y="158" width="240" height="118" rx="18" class="box"/><text x="394" y="195" class="h2">工具可见性</text><text x="394" y="226" class="t">agent / model / flags</text><text x="394" y="252" class="s">只有通配 deny 才直接隐藏</text><path d="M610 217H678" class="edge"/>
  <rect x="680" y="158" width="260" height="118" rx="18" class="box"/><text x="704" y="195" class="h2">Plugin before hook</text><text x="704" y="226" class="t">可修改参数</text><text x="704" y="252" class="s">执行顺序保持确定</text><path d="M940 217H1008" class="edge"/>
  <rect x="1010" y="142" width="360" height="150" rx="18" class="hot"/><text x="1034" y="180" class="h2">Permission.evaluate</text><text x="1034" y="213" class="t">permission + pattern → findLast</text><text x="1034" y="241" class="t">后出现规则覆盖先前规则</text><text x="1034" y="268" class="s">bash 与 external_directory 分开检查</text>
  <path d="M1190 292V366" class="edge"/>
  <rect x="934" y="368" width="250" height="118" rx="18" class="deny"/><text x="958" y="405" class="h2">deny</text><text x="958" y="436" class="t">立即抛拒绝错误</text><text x="958" y="462" class="s">工具不执行</text>
  <rect x="1220" y="368" width="150" height="118" rx="18" class="hot"/><text x="1244" y="405" class="h2">allow</text><text x="1244" y="436" class="t">直接执行</text><text x="1244" y="462" class="s">进入主机层</text>
  <rect x="620" y="368" width="278" height="118" rx="18" class="ask"/><text x="644" y="405" class="h2">ask → Event + Deferred</text><text x="644" y="436" class="t">once / always / reject</text><text x="644" y="462" class="s">always 追加到当前内存规则</text>
  <path d="M1010 262L898 382" class="dash"/><path d="M1140 292V368" class="edge"/><path d="M1270 292V368" class="edge"/><path d="M898 427H932" class="edge"/>
  <path d="M1370 427V566H1130" class="edge"/><path d="M1184 427H1200V566H1130" class="edge"/>
  <rect x="620" y="548" width="510" height="156" rx="20" class="box"/><text x="648" y="588" class="h2">主机执行层</text><text x="648" y="622" class="t">Bun.spawn(shell) · 文件读写 · formatter/LSP · 本地 MCP 子进程</text><text x="648" y="652" class="t">继承环境变量；默认 shell 超时 2 分钟；abort/timeout 尝试 kill</text><text x="648" y="680" class="s">Git snapshot 只能回滚受跟踪的文件变化，不能撤销网络、数据库或外部命令副作用</text>
  <rect x="70" y="548" width="500" height="156" rx="20" class="ask"/><text x="98" y="588" class="h2">工程风险清单</text><text x="98" y="622" class="t">• build 默认宽权限；不应直接信任陌生仓库</text><text x="98" y="650" class="t">• 动态 shell 路径难以完整静态识别</text><text x="98" y="678" class="t">• serve 对外绑定时应设置密码并由外层终止 TLS</text>
  <text x="70" y="764" class="s">更强隔离应在 OpenCode 外部提供：容器 / VM、最小权限账户、只读挂载、网络出口与密钥分区。</text>
</svg>
