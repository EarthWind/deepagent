<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode 总体架构</title>
  <desc id="desc">多个客户端通过统一 HTTP、SSE 和 WebSocket 协议连接本地服务器，服务器按目录管理实例，并连接模型、工具、MCP、SQLite 与 Git 快照。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1118"/><stop offset="1" stop-color="#17232b"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17383b"/><stop offset="1" stop-color="#10282d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#79e0d3"/></marker>
    <style>
      .h1{font:700 34px ui-sans-serif,system-ui;fill:#f3eadb}.h2{font:700 21px ui-sans-serif,system-ui;fill:#f3eadb}.t{font:500 16px ui-sans-serif,system-ui;fill:#c7d4d3}.s{font:500 14px ui-sans-serif,system-ui;fill:#92aaa8}.box{fill:#18242d;stroke:#49616a;stroke-width:1.5}.accent{fill:#102d30;stroke:#49bfb4;stroke-width:2}.edge{fill:none;stroke:#79e0d3;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#d6a84e;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" class="h1">OpenCode：本地服务化 Agent Runtime</text>
  <text x="72" y="102" class="s">同一运行时，多种薄客户端；目录是实例与事件路由的关键边界</text>

  <g filter="url(#shadow)">
    <rect x="62" y="150" width="260" height="610" rx="22" class="box"/>
    <text x="94" y="195" class="h2">客户端 / 接入面</text>
    <g><rect x="94" y="230" width="196" height="72" rx="14" class="accent"/><text x="118" y="260" class="h2">TUI</text><text x="118" y="283" class="s">主线程渲染，Worker 承载后端</text></g>
    <g><rect x="94" y="322" width="196" height="72" rx="14" class="box"/><text x="118" y="352" class="h2">Desktop / Web</text><text x="118" y="375" class="s">SolidJS + SDK reducer</text></g>
    <g><rect x="94" y="414" width="196" height="72" rx="14" class="box"/><text x="118" y="444" class="h2">CLI run / serve</text><text x="118" y="467" class="s">脚本与无头服务</text></g>
    <g><rect x="94" y="506" width="196" height="72" rx="14" class="box"/><text x="118" y="536" class="h2">SDK</text><text x="118" y="559" class="s">OpenAPI 生成的客户端</text></g>
    <g><rect x="94" y="598" width="196" height="72" rx="14" class="box"/><text x="118" y="628" class="h2">ACP</text><text x="118" y="651" class="s">编辑器 Agent 协议</text></g>
  </g>

  <path d="M322 340H420" class="edge"/>
  <path d="M420 585H322" class="edge"/>
  <text x="337" y="316" class="t">HTTP / RPC fetch</text>
  <text x="350" y="615" class="t">SSE / WebSocket</text>

  <g filter="url(#shadow)">
    <rect x="422" y="150" width="595" height="610" rx="24" fill="url(#core)" stroke="#62c9be" stroke-width="2"/>
    <text x="458" y="195" class="h2">Server.Default · Effect Layer Graph</text>
    <rect x="458" y="226" width="523" height="78" rx="14" class="box"/>
    <text x="482" y="257" class="h2">HTTP API / 路由层</text><text x="482" y="282" class="s">目录选择 · Basic Auth · CORS · SSE · PTY WebSocket</text>
    <rect x="458" y="330" width="523" height="112" rx="14" class="accent"/>
    <text x="482" y="365" class="h2">InstanceStore&lt;directory, Scoped Runtime&gt;</text>
    <text x="482" y="393" class="t">Project / Worktree / Config / Provider / Plugin / MCP</text>
    <text x="482" y="419" class="s">Deferred 去重并发启动；ScopedCache 管理释放</text>
    <rect x="458" y="468" width="250" height="118" rx="14" class="box"/>
    <text x="482" y="502" class="h2">Session Runtime</text><text x="482" y="531" class="t">Agent Loop</text><text x="482" y="557" class="t">Message / Part 状态机</text>
    <rect x="731" y="468" width="250" height="118" rx="14" class="box"/>
    <text x="755" y="502" class="h2">Execution Plane</text><text x="755" y="531" class="t">Tools · Permission</text><text x="755" y="557" class="t">MCP · LSP · Plugins</text>
    <rect x="458" y="612" width="523" height="104" rx="14" class="box"/>
    <text x="482" y="647" class="h2">EventV2 + GlobalBus</text>
    <text x="482" y="677" class="t">同步投影持久化 · 流式事件广播 · 按 location 过滤</text>
  </g>

  <path d="M1018 273H1108" class="edge"/>
  <path d="M1018 515H1108" class="edge"/>
  <path d="M1018 663H1108" class="edge"/>
  <g filter="url(#shadow)">
    <rect x="1110" y="150" width="268" height="610" rx="22" class="box"/>
    <text x="1142" y="195" class="h2">外部与持久化</text>
    <rect x="1142" y="230" width="204" height="86" rx="14" class="accent"/><text x="1166" y="263" class="h2">LLM Providers</text><text x="1166" y="290" class="s">AI SDK 默认 / Native 实验</text>
    <rect x="1142" y="344" width="204" height="86" rx="14" class="box"/><text x="1166" y="377" class="h2">本机进程</text><text x="1166" y="404" class="s">shell · formatter · LSP</text>
    <rect x="1142" y="458" width="204" height="86" rx="14" class="box"/><text x="1166" y="491" class="h2">MCP Servers</text><text x="1166" y="518" class="s">stdio · HTTP · SSE</text>
    <rect x="1142" y="572" width="204" height="86" rx="14" class="box"/><text x="1166" y="605" class="h2">SQLite</text><text x="1166" y="632" class="s">session · message · part</text>
    <rect x="1142" y="674" width="204" height="58" rx="14" class="box"/><text x="1166" y="710" class="h2">Git 快照仓库</text>
  </g>
  <path d="M1110 703H1018" class="dash"/>
  <text x="72" y="830" class="t">关键认识：默认 TUI 虽不必监听 TCP 端口，但仍通过 Worker RPC 模拟同一 fetch / event-stream 契约。</text>
  <text x="72" y="858" class="s">因此 UI 与 Agent 核心解耦，远程接入、桌面端与自动化 SDK 可以共享服务端语义。</text>
</svg>
