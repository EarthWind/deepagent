<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw 安全边界与工具授权</title>
  <desc id="desc">展示身份、会话隔离、工具策略、沙箱、elevated、审批与宿主隔离的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111d"/><stop offset="1" stop-color="#151c2d"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#67e8f9"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e5edf8}.h1{font-size:36px;font-weight:800}.sub{font-size:17px;fill:#94a3b8}.h2{font-size:23px;font-weight:800}.label{font-size:18px;font-weight:700}.s{font-size:15px;fill:#cbd5e1}.n{font-size:13px;fill:#a1aec0}.line{stroke:#67e8f9;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <text x="70" y="65" class="h1">安全不是一个开关，而是连续收窄的能力漏斗</text>
  <text x="70" y="100" class="sub">OpenClaw 的受支持模型是一位可信操作者 / 一个 Gateway；互不信任的租户需要拆 Gateway、凭据与 OS 边界。</text>

  <g>
    <rect x="70" y="145" width="245" height="106" rx="18" fill="#172554" stroke="#60a5fa"/><text x="192" y="178" text-anchor="middle" class="label">1. 谁能触发？</text><text x="192" y="207" text-anchor="middle" class="s">DM pairing / allowlist</text><text x="192" y="232" text-anchor="middle" class="n">group policy + mention gate</text>
    <path d="M315 198H360" class="line"/>
    <rect x="370" y="145" width="245" height="106" rx="18" fill="#12354a" stroke="#22d3ee"/><text x="492" y="178" text-anchor="middle" class="label">2. 去哪个上下文？</text><text x="492" y="207" text-anchor="middle" class="s">bindings + dmScope</text><text x="492" y="232" text-anchor="middle" class="n">SessionKey 只是路由，不是凭证</text>
    <path d="M615 198H660" class="line"/>
    <rect x="670" y="145" width="245" height="106" rx="18" fill="#2d285d" stroke="#a78bfa"/><text x="792" y="178" text-anchor="middle" class="label">3. 能看到哪些工具？</text><text x="792" y="207" text-anchor="middle" class="s">多层 tool policy 求交</text><text x="792" y="232" text-anchor="middle" class="n">deny 永远优先</text>
    <path d="M915 198H960" class="line"/>
    <rect x="970" y="145" width="245" height="106" rx="18" fill="#3d273c" stroke="#f472b6"/><text x="1092" y="178" text-anchor="middle" class="label">4. 在哪里运行？</text><text x="1092" y="207" text-anchor="middle" class="s">host / Docker sandbox</text><text x="1092" y="232" text-anchor="middle" class="n">workspace none / ro / rw</text>
    <path d="M1215 198H1260" class="line"/>
    <rect x="1270" y="145" width="260" height="106" rx="18" fill="#3a3016" stroke="#fbbf24"/><text x="1400" y="178" text-anchor="middle" class="label">5. 是否需要人确认？</text><text x="1400" y="207" text-anchor="middle" class="s">exec / plugin approvals</text><text x="1400" y="232" text-anchor="middle" class="n">first-answer-wins + 精确上下文</text>
  </g>

  <rect x="70" y="300" width="950" height="590" rx="24" fill="#101f32" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="346" class="h2">工具授权流水线（模型只看到最终结果）</text>
  <g>
    <rect x="110" y="380" width="870" height="52" rx="12" fill="#172554" stroke="#3b82f6"/><text x="140" y="412" class="label">候选能力</text><text x="330" y="412" class="s">coding + shell + OpenClaw + channel + plugin + MCP/LSP + Tool Search</text>
    <path d="M545 432V460" class="line"/>
    <rect x="110" y="470" width="870" height="52" rx="12" fill="#15354a" stroke="#22d3ee"/><text x="140" y="502" class="label">配置层</text><text x="330" y="502" class="s">profile → global → agent → provider/model → runtime allowlist</text>
    <path d="M545 522V550" class="line"/>
    <rect x="110" y="560" width="870" height="52" rx="12" fill="#302a62" stroke="#a78bfa"/><text x="140" y="592" class="label">会话层</text><text x="330" y="592" class="s">verified group → sender / owner → subagent inheritance → scheduled cap</text>
    <path d="M545 612V640" class="line"/>
    <rect x="110" y="650" width="870" height="52" rx="12" fill="#3b263d" stroke="#f472b6"/><text x="140" y="682" class="label">执行层</text><text x="330" y="682" class="s">sandbox policy → fs containment → delegation capability → client caps</text>
    <path d="M545 702V730" class="line"/>
    <rect x="110" y="740" width="870" height="52" rx="12" fill="#3a3016" stroke="#fbbf24"/><text x="140" y="772" class="label">调用边界</text><text x="330" y="772" class="s">before_tool_call hook → approval → abort → outcome / audit</text>
    <path d="M545 792V820" class="line"/>
    <rect x="250" y="830" width="590" height="38" rx="12" fill="#124234" stroke="#34d399"/><text x="545" y="855" text-anchor="middle" class="label">最终 executable tool surface</text>
  </g>

  <rect x="1060" y="300" width="470" height="590" rx="24" fill="#24192d" stroke="#f472b6" stroke-width="2"/>
  <text x="1100" y="346" class="h2">三件经常被混淆的事</text>
  <rect x="1100" y="385" width="390" height="120" rx="15" fill="#3b263d" stroke="#f472b6"/>
  <text x="1128" y="417" class="label">Sandbox</text><text x="1128" y="446" class="s">决定 exec / 文件工具在哪运行</text><text x="1128" y="473" class="n">bind mount 可穿透边界；off 时 workspace 不是隔离</text>
  <rect x="1100" y="530" width="390" height="120" rx="15" fill="#302a62" stroke="#a78bfa"/>
  <text x="1128" y="562" class="label">Tool policy</text><text x="1128" y="591" class="s">决定工具是否存在</text><text x="1128" y="618" class="n">禁 write/edit 不会让 exec 自动只读</text>
  <rect x="1100" y="675" width="390" height="120" rx="15" fill="#3a3016" stroke="#fbbf24"/>
  <text x="1128" y="707" class="label">Elevated</text><text x="1128" y="736" class="s">只切换 exec 的 host / sandbox 位置</text><text x="1128" y="763" class="n">不授予新工具，也不绕过 tool policy / approval</text>
  <text x="1295" y="838" text-anchor="middle" class="s">强隔离仍然来自</text><text x="1295" y="865" text-anchor="middle" class="label" fill="#fb7185">独立 Gateway + OS 用户 / 主机 / VM</text>

  <rect x="70" y="925" width="1460" height="70" rx="16" fill="#351f27" stroke="#fb7185"/>
  <text x="100" y="955" class="label">安全审计的正确优先级：</text><text x="360" y="955" class="s">先关开放入口 → 再缩小工具与网络爆炸半径 → 再检查 bind/auth、浏览器与磁盘权限 → 最后治理插件和模型。</text>
  <text x="100" y="979" class="n">模型可能被操纵是前提，不应把 prompt guardrail 当成权限系统；对共享 Gateway 的敌对多租户隔离也不是项目承诺。</text>
</svg>
