<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">TradingAgents 源码与架构深度解析</title>
  <desc id="desc">多智能体投研流水线封面：分析、辩论、交易建议、风险复核与最终决策。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131e"/><stop offset="0.5" stop-color="#0b2230"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.mono{font-family:"JetBrains Mono",monospace}.node{stroke-width:2}.muted{fill:#91a4b7}</style>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#5a7891"><path d="M0 650L245 520l170 64 210-210 180 108 250-284 215 133 330-226" fill="none" stroke-width="4"/><path d="M0 735H1600M0 620H1600M0 505H1600M0 390H1600" stroke-dasharray="8 18"/></g>
  <text x="92" y="126" fill="#5eead4" font-size="20" font-weight="800" letter-spacing="4">SOURCE-CODE RESEARCH · LANGGRAPH · MULTI-AGENT</text>
  <text x="92" y="226" fill="#f8fafc" font-size="68" font-weight="850">TradingAgents</text>
  <text x="92" y="302" fill="#dbeafe" font-size="43" font-weight="700">把“投研公司”编译成一张状态图</text>
  <text x="92" y="357" class="muted" font-size="22">从 Agent → ToolNode 循环、Bull/Bear 辩论，到五档组合评级与延迟反思</text>
  <rect x="92" y="405" width="750" height="2" fill="url(#line)"/>
