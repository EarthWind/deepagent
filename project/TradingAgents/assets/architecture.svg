<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">TradingAgents 当前源码架构</title>
  <desc id="desc">展示入口、共享状态、串行分析师工具循环、研究辩论、交易提案、风险辩论、组合决策和持久化边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#11192b"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#67e8f9"/></marker>
    <style>text{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#e5edf5}.h1{font-size:36px;font-weight:800}.sub{font-size:17px;fill:#93a8ba}.cap{font-size:14px;font-weight:800;letter-spacing:2px}.t{font-size:19px;font-weight:750}.s{font-size:15px}.m{font-size:14px;fill:#9db0c1}.box{stroke-width:2}.arr{stroke:#67e8f9;stroke-width:2.4;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="1120" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" class="h1">当前实现：一条有状态、可循环、可恢复的投研决策图</text>
  <text x="70" y="103" class="sub">蓝色箭头是主路径；虚线框是共享状态与持久化。分析师在当前源码中按选择顺序串行执行。</text>

  <g transform="translate(70 150)">
    <rect width="250" height="102" rx="18" fill="#10283a" stroke="#38bdf8" class="box"/>
    <text x="24" y="34" class="cap" fill="#7dd3fc">ENTRY</text><text x="24" y="66" class="t">CLI / Python API</text><text x="24" y="90" class="m">ticker · date · config</text>
  </g>
  <path d="M320 201h90" class="arr"/>
  <g transform="translate(410 136)">
    <rect width="730" height="130" rx="20" fill="#16233a" stroke="#818cf8" stroke-dasharray="8 7" class="box"/>
    <text x="28" y="34" class="cap" fill="#a5b4fc">AGENTSTATE · SHARED CONTRACT</text>
    <text x="28" y="68" class="s">messages · ticker identity · trade date · 4 reports · investment debate</text>
    <text x="28" y="96" class="s">investment plan · trader proposal · risk debate · final decision · past context</text>
    <text x="28" y="119" class="m">节点只返回字段增量；messages 继承 MessagesState 的消息 reducer</text>
  </g>
  <path d="M1140 201h90" class="arr"/>
  <g transform="translate(1230 150)">
    <rect width="300" height="102" rx="18" fill="#0d302b" stroke="#34d399" class="box"/>
    <text x="24" y="34" class="cap" fill="#6ee7b7">MODEL LAYER</text><text x="24" y="66" class="t">Quick / Deep LLM</text><text x="24" y="90" class="m">provider adapters + capabilities</text>
  </g>

  <g transform="translate(70 322)">
    <rect width="1460" height="250" rx="24" fill="#0c202c" stroke="#1f6472" class="box"/>
    <text x="28" y="38" class="cap" fill="#5eead4">I · ANALYST PIPELINE — SERIAL IN CODE</text>
    <g transform="translate(28 66)">
      <rect width="275" height="130" rx="17" fill="#12353b" stroke="#2dd4bf" class="box"/><text x="20" y="34" class="t">Market Analyst</text><text x="20" y="63" class="m">行情 · 指标 · verified snapshot</text><text x="20" y="92" class="s">Agent ⇄ ToolNode</text><text x="20" y="116" class="m">→ market_report</text>
      <path d="M275 65h44" class="arr"/>
      <rect x="319" width="275" height="130" rx="17" fill="#12353b" stroke="#2dd4bf" class="box"/><text x="339" y="34" class="t">Sentiment Analyst</text><text x="339" y="63" class="m">News · StockTwits · Reddit</text><text x="339" y="92" class="s">预取数据 + structured output</text><text x="339" y="116" class="m">→ sentiment_report</text>
      <path d="M594 65h44" class="arr"/>
      <rect x="638" width="275" height="130" rx="17" fill="#12353b" stroke="#2dd4bf" class="box"/><text x="658" y="34" class="t">News Analyst</text><text x="658" y="63" class="m">新闻 · FRED · Polymarket</text><text x="658" y="92" class="s">Agent ⇄ ToolNode</text><text x="658" y="116" class="m">→ news_report</text>
      <path d="M913 65h44" class="arr"/>
      <rect x="957" width="430" height="130" rx="17" fill="#12353b" stroke="#2dd4bf" class="box"/><text x="977" y="34" class="t">Fundamentals Analyst</text><text x="977" y="63" class="m">profile · balance sheet · cash flow · income</text><text x="977" y="92" class="s">Agent ⇄ ToolNode</text><text x="977" y="116" class="m">→ fundamentals_report · Msg Clear 后交棒</text>
    </g>
  </g>
  <path d="M800 572v50" class="arr"/>

  <g transform="translate(70 622)">
    <rect width="420" height="176" rx="22" fill="#29234b" stroke="#a78bfa" class="box"/>
    <text x="26" y="38" class="cap" fill="#c4b5fd">II · RESEARCH DEBATE</text><text x="26" y="77" class="t">Bull ⇄ Bear</text><text x="26" y="108" class="s">2 × debate_rounds 次发言</text><text x="26" y="137" class="m">Research Manager（Deep）裁决</text><text x="26" y="160" class="m">→ investment_plan</text>
  </g>
  <path d="M490 710h75" class="arr"/>
  <g transform="translate(565 622)">
    <rect width="300" height="176" rx="22" fill="#3b1f35" stroke="#f472b6" class="box"/>
    <text x="26" y="38" class="cap" fill="#f9a8d4">III · TRADER</text><text x="26" y="77" class="t">交易提案</text><text x="26" y="108" class="s">方向 + 入场 + 止损 + 仓位</text><text x="26" y="137" class="m">Quick + Pydantic schema</text><text x="26" y="160" class="m">→ trader_investment_plan</text>
  </g>
  <path d="M865 710h75" class="arr"/>
  <g transform="translate(940 622)">
    <rect width="590" height="176" rx="22" fill="#392d18" stroke="#fbbf24" class="box"/>
    <text x="26" y="38" class="cap" fill="#fde68a">IV + V · RISK AND PORTFOLIO</text><text x="26" y="77" class="t">Aggressive → Conservative → Neutral</text><text x="26" y="108" class="s">3 × risk_rounds 次发言，再交给 Portfolio Manager（Deep）</text><text x="26" y="137" class="m">五档评级 Buy / Overweight / Hold / Underweight / Sell</text><text x="26" y="160" class="m">→ final_trade_decision → deterministic signal parser</text>
  </g>

  <path d="M800 798v58" class="arr"/>
  <g transform="translate(70 856)">
    <rect width="710" height="180" rx="22" fill="#102637" stroke="#4f83a1" stroke-dasharray="9 7" class="box"/>
    <text x="26" y="38" class="cap" fill="#7dd3fc">PERSISTENCE A · DURABLE EXECUTION</text><text x="26" y="77" class="t">LangGraph SQLite checkpoints</text><text x="26" y="108" class="s">ticker + date + graph-shape signature → thread_id</text><text x="26" y="137" class="m">失败保留 · 传入 None 恢复 · 成功后删除</text><text x="26" y="160" class="m">本地容错，不等于业务记忆</text>
  </g>
  <g transform="translate(820 856)">
    <rect width="710" height="180" rx="22" fill="#102d29" stroke="#34d399" stroke-dasharray="9 7" class="box"/>
    <text x="26" y="38" class="cap" fill="#6ee7b7">PERSISTENCE B · LEARNING MEMORY</text><text x="26" y="77" class="t">Markdown decision log + deferred reflection</text><text x="26" y="108" class="s">本次决策 pending → 5 交易日收益/Alpha → LLM 反思</text><text x="26" y="137" class="m">同标的 5 条 + 跨标的 3 条 lesson 注入 PM</text><text x="26" y="160" class="m">point-in-time 过滤，避免回测读取未来经验</text>
  </g>
  <text x="70" y="1090" class="m">边界提醒：图的末端是评级/Markdown 报告；当前仓库没有真实订单路由、资金账本或组合撮合循环。</text>
</svg>
