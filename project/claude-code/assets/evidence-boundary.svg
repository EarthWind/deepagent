<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 调研证据边界</title>
  <desc id="desc">区分公开仓库、官方分发产物、官方文档与无法直接审计的核心运行时。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101522"/><stop offset="1" stop-color="#21182a"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d97757"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .title{font:700 35px Inter,"Noto Sans SC",sans-serif;fill:#fff7ed}.sub{font:400 16px Inter,"Noto Sans SC",sans-serif;fill:#a8a3b6}
      .h{font:700 20px Inter,"Noto Sans SC",sans-serif;fill:#faf7ff}.t{font:500 15px Inter,"Noto Sans SC",sans-serif;fill:#ddd6e6}.tiny{font:500 13px Inter,"Noto Sans SC",sans-serif;fill:#aaa1b6}
      .card{fill:#181c2a;stroke:#3b3f52;stroke-width:1.5}.open{fill:#17252b;stroke:#4fb8a8}.dist{fill:#2b201d;stroke:#d97757}.docs{fill:#211d32;stroke:#a78bfa}.closed{fill:#291b25;stroke:#ef6f8f;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="60" r="220" fill="#d97757" opacity=".06"/><circle cx="85" cy="730" r="240" fill="#a78bfa" opacity=".06"/>
  <text x="66" y="66" class="title">先回答最重要的问题：这个 GitHub 仓库不是核心源码仓库</text>
  <text x="66" y="98" class="sub">本文把“可直接验证的事实”“分发产物线索”和“工程推断”分开，避免把产品行为伪装成源码调用链。</text>

  <rect x="66" y="138" width="1308" height="8" rx="4" fill="url(#bar)" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="66" y="180" width="390" height="205" rx="20" class="open"/>
    <text x="92" y="220" class="h">① GitHub 固定快照</text>
    <text x="92" y="256" class="t">README · CHANGELOG · 示例配置</text>
    <text x="92" y="286" class="t">官方 Plugins · Hooks/Agents/Skills 实例</text>
    <text x="92" y="324" class="tiny">可审计：扩展协议、发布事实、安全修复</text>
    <text x="92" y="350" class="tiny">不可审计：主 Agent loop 与内部模块源码</text>

    <rect x="525" y="180" width="390" height="205" rx="20" class="dist"/>
    <text x="551" y="220" class="h">② 2.1.251 官方分发产物</text>
    <text x="551" y="256" class="t">平台 wrapper · 原生 ELF · 类型化工具契约</text>
    <text x="551" y="286" class="t">Bun 1.4.1 运行时线索 · CLI / stream 协议</text>
    <text x="551" y="324" class="tiny">可审计：打包拓扑、工具契约、二进制元数据</text>
    <text x="551" y="350" class="tiny">限制：原生 bundle 不是可维护的源码树</text>

    <rect x="984" y="180" width="390" height="205" rx="20" class="docs"/>
    <text x="1010" y="220" class="h">③ 官方行为与协议文档</text>
    <text x="1010" y="256" class="t">Agent loop · 权限 · Sandbox · Context</text>
    <text x="1010" y="286" class="t">Session JSONL · Hooks · MCP · Subagents</text>
    <text x="1010" y="324" class="tiny">可审计：外部语义、不变量、限制与事件结构</text>
    <text x="1010" y="350" class="tiny">限制：文档不等于内部函数级实现</text>
  </g>

  <path d="M261 385V446H720" stroke="#566074" stroke-width="2" fill="none"/><path d="M720 385V446" stroke="#566074" stroke-width="2"/><path d="M1179 385V446H720" stroke="#566074" stroke-width="2"/>
  <rect x="282" y="446" width="876" height="188" rx="24" class="closed" filter="url(#shadow)"/>
  <text x="720" y="490" text-anchor="middle" class="h">核心运行时：可观察，但未公开完整源码</text>
  <text x="720" y="526" text-anchor="middle" class="t">会话调度 · Prompt 组装 · 模型流消费 · Tool dispatch · 进程管理 · TUI 状态</text>
  <text x="720" y="560" text-anchor="middle" class="t">本文只在多份官方证据一致时复原其“架构语义”，不虚构类名、函数名和内部数据结构。</text>
  <rect x="431" y="586" width="578" height="27" rx="13.5" fill="#3a202d"/>
  <text x="720" y="605" text-anchor="middle" class="tiny" fill="#f5a3b6">推断必须显式标注 · 当前行为必须绑定版本 · 边界缺口必须保留</text>

  <text x="66" y="710" class="tiny">调研基线：anthropics/claude-code @ f1af9b1 · Claude Code 2.1.251 · 2026-09-01</text>
</svg>
