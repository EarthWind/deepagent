<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="866" viewBox="0 0 1280 866" role="img" aria-labelledby="title desc">
<title id="title">Federation：消息可信与任务可执行要分别授权</title><desc id="desc">以下是概念调用路径；会话 HMAC、节点签名和具体 transport 属于不同实现层。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#788e99" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="866" rx="18" fill="#f4f8f8"/>
<path d="M18 0 H1262 Q1280 0 1280 18 V8 H0 V18 Q0 0 18 0" fill="#087e83"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<text x="44" y="48" font-size="15" fill="#087e83" font-weight="700">RUFLO  /  SOURCE NOTES     07</text>
<text x="44" y="97" font-size="31" fill="#183443" font-weight="700">Federation：消息可信与任务可执行要分别授权</text>
<text x="44" y="133" font-size="18" fill="#566a76" font-weight="400">以下是概念调用路径；会话 HMAC、节点签名和具体 transport 属于不同实现层。</text>
<g data-card="出站控制" data-x="44" data-y="181" data-w="372" data-h="164">
<rect x="44" y="181" width="372" height="164" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="197" width="4" height="132" rx="2" fill="#087e83"/>
<text x="64" y="217" font-size="23" fill="#087e83" font-weight="700">出站控制</text>
<text x="64" y="252" font-size="20" fill="#183443" font-weight="400">节点 active / session 检查</text>
<text x="64" y="281" font-size="20" fill="#183443" font-weight="400">消息类型与信任策略</text>
<text x="64" y="310" font-size="20" fill="#183443" font-weight="400">预算、跳数、累计花费</text>
</g>
<g data-card="消息处理" data-x="454" data-y="181" data-w="372" data-h="164">
<rect x="454" y="181" width="372" height="164" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="454" y="197" width="4" height="132" rx="2" fill="#4269ae"/>
<text x="474" y="217" font-size="23" fill="#4269ae" font-weight="700">消息处理</text>
<text x="474" y="252" font-size="20" fill="#183443" font-weight="400">PII 转换或阻断</text>
<text x="474" y="281" font-size="20" fill="#183443" font-weight="400">构造 envelope / nonce</text>
<text x="474" y="310" font-size="20" fill="#183443" font-weight="400">调用签名与路由接口</text>
</g>
<g data-card="传输适配" data-x="864" data-y="181" data-w="372" data-h="164">
<rect x="864" y="181" width="372" height="164" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="864" y="197" width="4" height="132" rx="2" fill="#4269ae"/>
<text x="884" y="217" font-size="23" fill="#4269ae" font-weight="700">传输适配</text>
<text x="884" y="252" font-size="20" fill="#183443" font-weight="400">会话与目标节点</text>
<text x="884" y="281" font-size="20" fill="#183443" font-weight="400">发送结果与错误</text>
<text x="884" y="310" font-size="20" fill="#183443" font-weight="400">审计 sent / rejected</text>
</g>
<path d="M416,263 L454,263" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M826,263 L864,263" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050,345 L1050,402" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050,402 L230,402" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230,402 L230,442" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="入站 Dispatcher" data-x="44" data-y="446" data-w="575" data-h="168">
<rect x="44" y="446" width="575" height="168" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="462" width="4" height="136" rx="2" fill="#087e83"/>
<text x="64" y="482" font-size="23" fill="#087e83" font-weight="700">入站 Dispatcher</text>
<text x="64" y="517" font-size="20" fill="#183443" font-weight="400">检查来源节点、active 状态与签名</text>
<text x="64" y="546" font-size="20" fill="#183443" font-weight="400">根据配置执行授权并写入审计</text>
<text x="64" y="575" font-size="20" fill="#183443" font-weight="400">通过门禁后发出类型化事件</text>
</g>
<g data-card="业务集成方 / Worker" data-x="661" data-y="446" data-w="575" data-h="168">
<rect x="661" y="446" width="575" height="168" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="661" y="462" width="4" height="136" rx="2" fill="#4269ae"/>
<text x="681" y="482" font-size="23" fill="#4269ae" font-weight="700">业务集成方 / Worker</text>
<text x="681" y="517" font-size="20" fill="#183443" font-weight="400">接收事件后决定是否执行任务</text>
<text x="681" y="546" font-size="20" fill="#183443" font-weight="400">独立检查执行能力与资源预算</text>
<text x="681" y="575" font-size="20" fill="#183443" font-weight="400">返回结果，并补充质量证据</text>
</g>
<path d="M619,530 L661,530" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="44" y="658" width="1192" height="88" rx="12" fill="#e8f2f2" stroke="#c6dcdf"/>
<text x="65" y="690" font-size="22" fill="#a36321" font-weight="700">信任不是任务执行权限的替代物</text>
<text x="65" y="720" font-size="19" fill="#183443" font-weight="400">历史成功率、在线率、威胁与完整性共同评分；最高级升级包含人工批准要求。</text>
<text x="44" y="840" font-size="14" fill="#566a76" font-weight="400">原创源码示意 · 6f0ed7112873 · 2026-09-17  |  federation-coordinator · routing-service · inbound-dispatcher · trust-evaluator</text>
</g></svg>