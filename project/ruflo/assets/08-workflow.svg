<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
<title id="title">Workflow：已经接线的执行与尚未完成的语义</title><desc id="desc">此图仅描述 CLI workflow_execute 处理器，不代表所有独立编排模块。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#788e99" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="840" rx="18" fill="#f4f8f8"/>
<path d="M18 0 H1262 Q1280 0 1280 18 V8 H0 V18 Q0 0 18 0" fill="#087e83"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<text x="44" y="48" font-size="15" fill="#087e83" font-weight="700">RUFLO  /  SOURCE NOTES     08</text>
<text x="44" y="97" font-size="31" fill="#183443" font-weight="700">Workflow：已经接线的执行与尚未完成的语义</text>
<text x="44" y="133" font-size="18" fill="#566a76" font-weight="400">此图仅描述 CLI workflow_execute 处理器，不代表所有独立编排模块。</text>
<g data-card="已执行的类型" data-x="44" data-y="180" data-w="372" data-h="174">
<rect x="44" y="180" width="372" height="174" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="196" width="4" height="142" rx="2" fill="#087e83"/>
<text x="64" y="216" font-size="23" fill="#087e83" font-weight="700">已执行的类型</text>
<text x="64" y="251" font-size="20" fill="#183443" font-weight="400">task → executeAgentTask</text>
<text x="64" y="280" font-size="20" fill="#183443" font-weight="400">wait → 有界等待</text>
<text x="64" y="309" font-size="20" fill="#183443" font-weight="400">condition → 有限条件与跳转</text>
</g>
<g data-card="尚未执行的类型" data-x="454" data-y="180" data-w="372" data-h="174">
<rect x="454" y="180" width="372" height="174" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="454" y="196" width="4" height="142" rx="2" fill="#a36321"/>
<text x="474" y="216" font-size="23" fill="#a36321" font-weight="700">尚未执行的类型</text>
<text x="474" y="251" font-size="20" fill="#183443" font-weight="400">parallel → skipped</text>
<text x="474" y="280" font-size="20" fill="#183443" font-weight="400">loop → skipped</text>
<text x="474" y="309" font-size="20" fill="#183443" font-weight="400">整体仍可能返回 completed</text>
</g>
<g data-card="状态与变量" data-x="864" data-y="180" data-w="372" data-h="174">
<rect x="864" y="180" width="372" height="174" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="864" y="196" width="4" height="142" rx="2" fill="#4269ae"/>
<text x="884" y="216" font-size="23" fill="#4269ae" font-weight="700">状态与变量</text>
<text x="884" y="251" font-size="20" fill="#183443" font-weight="400">每步前后保存进度</text>
<text x="884" y="280" font-size="20" fill="#183443" font-weight="400">步骤间检查暂停 / 取消</text>
<text x="884" y="309" font-size="20" fill="#183443" font-weight="400">task 结果写入变量</text>
</g>
<g data-card="复现 ① 自动步骤 ID 的插值不匹配" data-x="44" data-y="404" data-w="1192" data-h="131">
<rect x="44" y="404" width="1192" height="131" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="420" width="4" height="99" rx="2" fill="#a36321"/>
<text x="64" y="440" font-size="23" fill="#a36321" font-weight="700">复现 ① 自动步骤 ID 的插值不匹配</text>
<text x="64" y="475" font-size="20" fill="#183443" font-weight="400">{{lastStepOutput}} → fixture-output-2</text>
<text x="64" y="504" font-size="20" fill="#183443" font-weight="400">{{step-1.output}} → 原样保留；正则匹配范围不含连字符</text>
</g>
<g data-card="复现 ② 无活动 runner 时，resume 只改变状态" data-x="44" data-y="573" data-w="1192" data-h="131">
<rect x="44" y="573" width="1192" height="131" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="589" width="4" height="99" rx="2" fill="#a36321"/>
<text x="64" y="609" font-size="23" fill="#a36321" font-weight="700">复现 ② 无活动 runner 时，resume 只改变状态</text>
<text x="64" y="644" font-size="20" fill="#183443" font-weight="400">paused → workflow_resume → running</text>
<text x="64" y="673" font-size="20" fill="#183443" font-weight="400">随后 workflow_execute → Workflow already running；没有自动重启 runner</text>
</g>
<text x="44" y="760" font-size="20" fill="#566a76" font-weight="400">研究用 fixture 实验；未修改上游实现，也未运行真实模型。</text>
