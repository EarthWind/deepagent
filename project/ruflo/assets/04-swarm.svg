<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Swarm 有三层：状态、调度、传输</title><desc id="desc">这三层可以组合，但 CLI 初始化一条协调记录并不自动等于启动分布式集群。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#788e99" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="820" rx="18" fill="#f4f8f8"/>
<path d="M18 0 H1262 Q1280 0 1280 18 V8 H0 V18 Q0 0 18 0" fill="#087e83"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<text x="44" y="48" font-size="15" fill="#087e83" font-weight="700">RUFLO  /  SOURCE NOTES     04</text>
<text x="44" y="97" font-size="31" fill="#183443" font-weight="700">Swarm 有三层：状态、调度、传输</text>
<text x="44" y="133" font-size="18" fill="#566a76" font-weight="400">这三层可以组合，但 CLI 初始化一条协调记录并不自动等于启动分布式集群。</text>
<g data-card="① CLI Swarm 状态工具" data-x="44" data-y="178" data-w="1192" data-h="125">
<rect x="44" y="178" width="1192" height="125" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="194" width="4" height="93" rx="2" fill="#087e83"/>
<text x="64" y="214" font-size="23" fill="#087e83" font-weight="700">① CLI Swarm 状态工具</text>
<text x="64" y="249" font-size="20" fill="#183443" font-weight="400">swarm_init → swarm-state.json；记录 topology / agents / tasks / config</text>
<text x="64" y="278" font-size="20" fill="#183443" font-weight="400">这一入口没有直接实例化 UnifiedSwarmCoordinator。</text>
</g>
<g data-card="② 独立 UnifiedSwarmCoordinator" data-x="44" data-y="338" data-w="1192" data-h="172">
<rect x="44" y="338" width="1192" height="172" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="354" width="4" height="140" rx="2" fill="#4269ae"/>
<text x="64" y="374" font-size="23" fill="#4269ae" font-weight="700">② 独立 UnifiedSwarmCoordinator</text>
<text x="64" y="409" font-size="20" fill="#183443" font-weight="400">AgentPool + TopologyManager + MessageBus + ConsensusEngine</text>
<text x="64" y="438" font-size="20" fill="#183443" font-weight="400">任务 → 能力 / 负载 / 健康评分 → task_assign → Worker → completion</text>
<text x="64" y="467" font-size="20" fill="#183443" font-weight="400">运行期包含队列、心跳、健康检查与任务状态更新。</text>
</g>
<g data-card="③ 默认 LocalTransport" data-x="44" data-y="548" data-w="575" data-h="145">
<rect x="44" y="548" width="575" height="145" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="564" width="4" height="113" rx="2" fill="#4269ae"/>
<text x="64" y="584" font-size="23" fill="#4269ae" font-weight="700">③ 默认 LocalTransport</text>
<text x="64" y="619" font-size="20" fill="#183443" font-weight="400">同一 Node 进程的 registry</text>
<text x="64" y="648" font-size="20" fill="#183443" font-weight="400">节点消息与可观测事件分离</text>
<text x="64" y="677" font-size="20" fill="#183443" font-weight="400">可注入测试与签名辅助机制</text>
</g>
<g data-card="③ 可选 FederationTransport" data-x="661" data-y="548" data-w="575" data-h="145">
<rect x="661" y="548" width="575" height="145" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="661" y="564" width="4" height="113" rx="2" fill="#a36321"/>
<text x="681" y="584" font-size="23" fill="#a36321" font-weight="700">③ 可选 FederationTransport</text>
<text x="681" y="619" font-size="20" fill="#183443" font-weight="400">跨进程 / 节点传输适配</text>
<text x="681" y="648" font-size="20" fill="#183443" font-weight="400">需要身份、网络和 Worker 接线</text>
<text x="681" y="677" font-size="20" fill="#183443" font-weight="400">不能从拓扑配置推断已启用</text>
</g>
<path d="M334,510 L334,548" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M949,510 L949,548" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="44" y="747" font-size="22" fill="#087e83" font-weight="700">共识一致性解决状态协调；模型答案正确性仍依赖外部验证。</text>
<text x="44" y="794" font-size="14" fill="#566a76" font-weight="400">原创源码示意 · 6f0ed7112873 · 2026-09-17  |  swarm-tools · unified-coordinator · consensus/transport</text>
</g></svg>