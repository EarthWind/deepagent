<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc">
<title id="title">Agent 注册记录与执行运行时是两件事</title><desc id="desc">agent_spawn 持久化身份；agent_execute 与宿主子 Agent 分别承担不同类型的执行。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#788e99" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="830" rx="18" fill="#f4f8f8"/>
<path d="M18 0 H1262 Q1280 0 1280 18 V8 H0 V18 Q0 0 18 0" fill="#087e83"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif">
<text x="44" y="48" font-size="15" fill="#087e83" font-weight="700">RUFLO  /  SOURCE NOTES     03</text>
<text x="44" y="97" font-size="31" fill="#183443" font-weight="700">Agent 注册记录与执行运行时是两件事</text>
<text x="44" y="133" font-size="18" fill="#566a76" font-weight="400">agent_spawn 持久化身份；agent_execute 与宿主子 Agent 分别承担不同类型的执行。</text>
<g data-card="agent_spawn" data-x="44" data-y="179" data-w="350" data-h="160">
<rect x="44" y="179" width="350" height="160" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="195" width="4" height="128" rx="2" fill="#087e83"/>
<text x="64" y="215" font-size="23" fill="#087e83" font-weight="700">agent_spawn</text>
<text x="64" y="250" font-size="20" fill="#183443" font-weight="400">校验参数、选择模型</text>
<text x="64" y="279" font-size="20" fill="#183443" font-weight="400">写 Agent JSON 记录</text>
<text x="64" y="308" font-size="20" fill="#183443" font-weight="400">返回 registered；记录 idle</text>
</g>
<g data-card="agent_execute" data-x="464" data-y="179" data-w="340" data-h="160">
<rect x="464" y="179" width="340" height="160" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="464" y="195" width="4" height="128" rx="2" fill="#4269ae"/>
<text x="484" y="215" font-size="23" fill="#4269ae" font-weight="700">agent_execute</text>
<text x="484" y="250" font-size="20" fill="#183443" font-weight="400">读取记录 → busy</text>
<text x="484" y="279" font-size="20" fill="#183443" font-weight="400">taskCount 增加</text>
<text x="484" y="308" font-size="20" fill="#183443" font-weight="400">调用 Provider</text>
</g>
<g data-card="文本 Provider" data-x="874" data-y="179" data-w="362" data-h="160">
<rect x="874" y="179" width="362" height="160" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="874" y="195" width="4" height="128" rx="2" fill="#a36321"/>
<text x="894" y="215" font-size="23" fill="#a36321" font-weight="700">文本 Provider</text>
<text x="894" y="250" font-size="20" fill="#183443" font-weight="400">system + user message</text>
<text x="894" y="279" font-size="20" fill="#183443" font-weight="400">本路径不发送 tools</text>
<text x="894" y="308" font-size="20" fill="#183443" font-weight="400">返回 text + usage</text>
</g>
<path d="M394,259 L464,259" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M804,259 L874,259" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1055,339 L1055,393" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1055,393 L636,393" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M636,393 L636,432" fill="none" stroke="#788e99" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="持久化执行结果" data-x="464" data-y="436" data-w="772" data-h="144">
<rect x="464" y="436" width="772" height="144" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="464" y="452" width="4" height="112" rx="2" fill="#087e83"/>
<text x="484" y="472" font-size="23" fill="#087e83" font-weight="700">持久化执行结果</text>
<text x="484" y="507" font-size="20" fill="#183443" font-weight="400">busy → idle；成功时保存 lastResult</text>
<text x="484" y="536" font-size="20" fill="#183443" font-weight="400">尽力记录路由反馈；API 成功不等于任务通过验收</text>
</g>
<g data-card="宿主子 Agent" data-x="44" data-y="436" data-w="350" data-h="144">
<rect x="44" y="436" width="350" height="144" rx="12" fill="white" stroke="#d3e0e4"/>
<rect x="44" y="452" width="4" height="112" rx="2" fill="#4269ae"/>
<text x="64" y="472" font-size="23" fill="#4269ae" font-weight="700">宿主子 Agent</text>
<text x="64" y="507" font-size="20" fill="#183443" font-weight="400">原生 Task / 外部 CLI</text>
<text x="64" y="536" font-size="20" fill="#183443" font-weight="400">工具调用与文件操作</text>
<text x="64" y="565" font-size="20" fill="#183443" font-weight="400">需要单独执行链</text>
</g>
<rect x="44" y="621" width="1192" height="88" rx="12" fill="#e8f2f2" stroke="#c6dcdf"/>
<text x="65" y="653" font-size="22" fill="#087e83" font-weight="700">本次实测</text>
<text x="65" y="683" font-size="19" fill="#183443" font-weight="400">注册产生 0 次模型请求；执行产生 1 次 fixture 请求；请求体无 tools。</text>
<text x="44" y="758" font-size="19" fill="#566a76" font-weight="400">实验不调用真实 LLM，不评估输出正确性或端到端编码完成率。</text>
