<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Recipe 与子 Agent 的组合</title><desc id="desc">配置复用、上下文分离与共享执行环境，需要分别理解。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#192b45} .small{font-size:18px;fill:#526278} .body{font-size:20px} .label{font-size:19px;font-weight:600} .heading{font-size:25px;font-weight:700}</style>
<rect width="1440" height="900" fill="#f8fafc"/>
<rect width="1440" height="10" fill="#087f75"/>
<text x="54" y="64" font-size="17" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">GOOSE / ENGINEERING NOTES</text>
<text x="54" y="111" font-size="34" fill="#192b45" style="fill:#192b45" font-weight="700" text-anchor="start">Recipe 与子 Agent 的组合</text>
<text x="54" y="148" font-size="19" fill="#526278" style="fill:#526278" font-weight="400" text-anchor="start">配置复用、上下文分离与共享执行环境，需要分别理解。</text>
<rect x="54" y="196" width="385" height="232" rx="15" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="76" y="232" font-size="23" fill="#2563eb" style="fill:#2563eb" font-weight="700" text-anchor="start">Recipe</text>
<text x="76" y="269" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">instructions / prompt</text>
<text x="76" y="298" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">parameters / settings</text>
<text x="76" y="327" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">extensions / response schema</text>
<text x="76" y="356" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">sub_recipes / retry</text>
<text x="76" y="385" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">可手动启动，也可定时启动</text>
<rect x="526" y="196" width="860" height="155" rx="15" fill="#e5f7f3" stroke="#087f75" stroke-width="1.4"/>
<text x="548" y="232" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">父 Agent / Summon</text>
<text x="548" y="269" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">load：载入 source 指令到当前上下文</text>
<text x="548" y="298" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">delegate：创建新 Agent + 新 session，可同步或 async 返回 task ID</text>
<text x="548" y="327" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">load(task_id)：等待结果；peek 看进度；cancel 请求停止</text>
<path d="M439,285 L526,285" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="526" y="425" width="398" height="215" rx="15" fill="#f2edff" stroke="#7552be" stroke-width="1.4"/>
<text x="548" y="461" font-size="23" fill="#7552be" style="fill:#7552be" font-weight="700" text-anchor="start">子会话 A</text>
<text x="548" y="498" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">独立 Conversation</text>
<text x="548" y="527" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">显式任务 + 参考上下文</text>
<text x="548" y="556" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">Provider / 扩展集合可选择</text>
<text x="548" y="585" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">默认 max turns = 25</text>
<text x="548" y="614" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">当前 mode = Auto</text>
<rect x="988" y="425" width="398" height="215" rx="15" fill="#f2edff" stroke="#7552be" stroke-width="1.4"/>
<text x="1010" y="461" font-size="23" fill="#7552be" style="fill:#7552be" font-weight="700" text-anchor="start">子会话 B</text>
<text x="1010" y="498" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">独立 Conversation</text>
<text x="1010" y="527" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">记录 parent_session_id</text>
<text x="1010" y="556" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">后台任务有数量 / TTL 限制</text>
<text x="1010" y="585" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">返回结果给父会话</text>
<text x="1010" y="614" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">不允许继续嵌套委派</text>
<path d="M725,351 L725,425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1187,351 L1187,425" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="54" y="485" width="385" height="155" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="76" y="521" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">共享的真实世界</text>
<text x="76" y="558" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">可能共享同一工作目录和文件</text>
<text x="76" y="587" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">cwd 边界不限制所有路径访问</text>
<text x="76" y="616" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">并行写任务需要明确文件归属</text>
<rect x="54" y="718" width="1332" height="103" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="76" y="754" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">Recipe 不是通用事务型工作流引擎</text>
<text x="76" y="791" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">模型仍决定如何执行；JSON schema 可检查输出形状，但外部动作的幂等、补偿与依赖仍需设计。</text>
<path d="M54,852 H1386" stroke="#d9e2ec"/>
<text x="54" y="878" font-size="15" fill="#64748b" style="fill:#64748b" font-weight="400" text-anchor="start">原创工程示意图 · 源码基线 1e83e89 · 2026-09-18 · 非性能测量</text>
</svg>
