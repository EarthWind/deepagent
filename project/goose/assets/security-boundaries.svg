<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">权限控制不能替代执行隔离</title><desc id="desc">授权、检查、调度与 OS 权限处于不同层级；间接调用也需要明确边界。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#192b45} .small{font-size:18px;fill:#526278} .body{font-size:20px} .label{font-size:19px;font-weight:600} .heading{font-size:25px;font-weight:700}</style>
<rect width="1440" height="940" fill="#f8fafc"/>
<rect width="1440" height="10" fill="#087f75"/>
<text x="54" y="64" font-size="17" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">GOOSE / ENGINEERING NOTES</text>
<text x="54" y="111" font-size="34" fill="#192b45" style="fill:#192b45" font-weight="700" text-anchor="start">权限控制不能替代执行隔离</text>
<text x="54" y="148" font-size="19" fill="#526278" style="fill:#526278" font-weight="400" text-anchor="start">授权、检查、调度与 OS 权限处于不同层级；间接调用也需要明确边界。</text>
<rect x="54" y="198" width="620" height="166" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="76" y="234" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">普通工具：应用层决策</text>
<text x="76" y="271" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">Mode → 用户规则 / 只读提示 / 模型判断</text>
<text x="76" y="300" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">Security / Egress / Adversary / Repetition</text>
<text x="76" y="329" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">检查器错误会记录并继续；注册不代表启用</text>
<rect x="756" y="198" width="630" height="166" rx="15" fill="#e5f7f3" stroke="#087f75" stroke-width="1.4"/>
<text x="778" y="234" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">最终执行：系统层权限</text>
<text x="778" y="271" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">执行进程 / OS 用户 / 文件系统 / 网络 / 凭据</text>
<text x="778" y="300" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">MCP 负责通信；沙箱策略由运行环境实现</text>
<text x="778" y="329" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">容器选项需逐类确认覆盖到哪些扩展</text>
<path d="M674,278 L756,278" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="54" y="422" width="404" height="232" rx="15" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="76" y="458" font-size="23" fill="#2563eb" style="fill:#2563eb" font-weight="700" text-anchor="start">Auto 模式</text>
<text x="76" y="495" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">PermissionInspector 直接 Allow</text>
<text x="76" y="524" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">不能解释成只放行低风险动作</text>
<text x="76" y="553" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">其他启用的检查仍有其分支</text>
<text x="76" y="582" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">运行环境决定副作用范围</text>
<rect x="518" y="422" width="404" height="232" rx="15" fill="#f2edff" stroke="#7552be" stroke-width="1.4"/>
<text x="540" y="458" font-size="23" fill="#7552be" style="fill:#7552be" font-weight="700" text-anchor="start">Code Mode</text>
<text x="540" y="495" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">外层 execute_typescript 被检查</text>
<text x="540" y="524" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">内部 callback 直接进 manager</text>
<text x="540" y="553" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">并非每个函数都重新审批</text>
<text x="540" y="582" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">能力限制应靠最终执行边界</text>
<rect x="982" y="422" width="404" height="232" rx="15" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="1004" y="458" font-size="23" fill="#2563eb" style="fill:#2563eb" font-weight="700" text-anchor="start">Summon 子 Agent</text>
<text x="1004" y="495" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">独立 session / context</text>
<text x="1004" y="524" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">当前显式设置 Auto</text>
<text x="1004" y="553" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">工作目录检查不是 OS 沙箱</text>
<text x="1004" y="582" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">父审批不等于逐个子调用审批</text>
<rect x="54" y="743" width="1332" height="103" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="76" y="779" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">生产系统需要补充的控制</text>
<text x="76" y="816" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">本文建议：最小权限工具、受限凭据、隔离执行环境、幂等键和审计；不把自然语言策略当成硬约束。</text>
<path d="M54,892 H1386" stroke="#d9e2ec"/>
<text x="54" y="918" font-size="15" fill="#64748b" style="fill:#64748b" font-weight="400" text-anchor="start">原创工程示意图 · 源码基线 1e83e89 · 2026-09-18 · 非性能测量</text>
</svg>
