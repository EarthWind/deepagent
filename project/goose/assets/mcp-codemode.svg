<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">普通工具调用与 Code Mode</title><desc id="desc">两条路径共享 ExtensionManager；内部调用经过哪些治理环节，需要分别追踪。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#192b45} .small{font-size:18px;fill:#526278} .body{font-size:20px} .label{font-size:19px;font-weight:600} .heading{font-size:25px;font-weight:700}</style>
<rect width="1440" height="900" fill="#f8fafc"/>
<rect width="1440" height="10" fill="#087f75"/>
<text x="54" y="64" font-size="17" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">GOOSE / ENGINEERING NOTES</text>
<text x="54" y="111" font-size="34" fill="#192b45" style="fill:#192b45" font-weight="700" text-anchor="start">普通工具调用与 Code Mode</text>
<text x="54" y="148" font-size="19" fill="#526278" style="fill:#526278" font-weight="400" text-anchor="start">两条路径共享 ExtensionManager；内部调用经过哪些治理环节，需要分别追踪。</text>
<text x="54" y="211" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">普通路径</text>
<rect x="54" y="235" width="290" height="135" rx="15" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="76" y="271" font-size="23" fill="#2563eb" style="fill:#2563eb" font-weight="700" text-anchor="start">LLM tool call</text>
<text x="76" y="308" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">工具名 + JSON 参数</text>
<text x="76" y="337" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">模型决定单个调用</text>
<rect x="411" y="235" width="290" height="135" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="433" y="271" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">Agent 检查</text>
<text x="433" y="308" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">Inspectors / 审批</text>
<text x="433" y="337" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">Pre-tool hooks</text>
<rect x="768" y="235" width="290" height="135" rx="15" fill="#e5f7f3" stroke="#087f75" stroke-width="1.4"/>
<text x="790" y="271" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">ExtensionManager</text>
<text x="790" y="308" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">解析 owner / 名称</text>
<text x="790" y="337" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">available_tools 检查</text>
<rect x="1125" y="235" width="261" height="135" rx="15" fill="#f2edff" stroke="#7552be" stroke-width="1.4"/>
<text x="1147" y="271" font-size="23" fill="#7552be" style="fill:#7552be" font-weight="700" text-anchor="start">工具实现</text>
<text x="1147" y="308" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">MCP client / server</text>
<text x="1147" y="337" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">platform client</text>
<path d="M344,300 L411,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M701,300 L768,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1058,300 L1125,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="54" y="421" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">Code Mode 路径</text>
<rect x="54" y="445" width="290" height="176" rx="15" fill="#eaf2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="76" y="481" font-size="23" fill="#2563eb" style="fill:#2563eb" font-weight="700" text-anchor="start">按需发现接口</text>
<text x="76" y="518" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">catalog 默认：</text>
<text x="76" y="547" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">list_functions</text>
<text x="76" y="576" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">get_function_details</text>
<text x="76" y="605" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">execute_typescript</text>
<rect x="411" y="445" width="290" height="176" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="433" y="481" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">外层执行请求</text>
<text x="433" y="518" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">经过 Agent 检查</text>
<text x="433" y="547" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">pctx / Deno 执行</text>
<text x="433" y="576" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">中间结果留在脚本</text>
<text x="433" y="605" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">返回所需汇总</text>
<rect x="768" y="445" width="290" height="176" rx="15" fill="#e5f7f3" stroke="#087f75" stroke-width="1.4"/>
<text x="790" y="481" font-size="23" fill="#087f75" style="fill:#087f75" font-weight="700" text-anchor="start">函数 callback</text>
<text x="790" y="518" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">回到 Tokio runtime</text>
<text x="790" y="547" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">直接进入工具 manager</text>
<text x="790" y="576" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">传递 session / cwd</text>
<text x="790" y="605" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">传递取消 token</text>
<rect x="1125" y="445" width="261" height="176" rx="15" fill="#f2edff" stroke="#7552be" stroke-width="1.4"/>
<text x="1147" y="481" font-size="23" fill="#7552be" style="fill:#7552be" font-weight="700" text-anchor="start">工具实现</text>
<text x="1147" y="518" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">复用已有工具</text>
<text x="1147" y="547" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">并非全新能力</text>
<text x="1147" y="576" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">实际权限由执行</text>
<text x="1147" y="605" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">进程与环境决定</text>
<path d="M344,526 L411,526" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M701,526 L768,526" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1058,526 L1125,526" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="54" y="713" width="1332" height="103" rx="15" fill="#fff4da" stroke="#a56808" stroke-width="1.4"/>
<text x="76" y="749" font-size="23" fill="#a56808" style="fill:#a56808" font-weight="700" text-anchor="start">审核粒度发生变化</text>
<text x="76" y="786" font-size="19" fill="#192b45" style="fill:#192b45" font-weight="400" text-anchor="start">外层代码获准，不代表每个 callback 都重新执行普通工具的 Inspector；这不是逐项审批等价性证明。</text>
<path d="M54,852 H1386" stroke="#d9e2ec"/>
<text x="54" y="878" font-size="15" fill="#64748b" style="fill:#64748b" font-weight="400" text-anchor="start">原创工程示意图 · 源码基线 1e83e89 · 2026-09-18 · 非性能测量</text>
</svg>
