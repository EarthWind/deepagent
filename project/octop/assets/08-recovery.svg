<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">哪些状态能恢复，哪些只是当前进程里的对象</title><desc id="desc">“有数据库”“有 checkpoint”“任务可靠投递”是三个不同的承诺。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#73849b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1440" height="950" fill="#f8fafc"/><rect width="1440" height="8" fill="#137b6d"/>
<text x="54" y="51" font-size="17" fill="#137b6d" font-weight="700">OCTOP / SOURCE NOTES / 08</text>
<text x="54" y="106" font-size="34" fill="#20324a" font-weight="700">哪些状态能恢复，哪些只是当前进程里的对象</text>
<text x="54" y="148" font-size="19" fill="#56677e" font-weight="400">“有数据库”“有 checkpoint”“任务可靠投递”是三个不同的承诺。</text>
<rect x="54" y="195" width="402" height="197" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="74" y="230" font-size="23" fill="#137b6d" font-weight="700">控制面 · 持久化</text>
<text x="74" y="266" font-size="19" fill="#20324a" font-weight="400">Agent / User / Provider / Cron</text>
<text x="74" y="295" font-size="19" fill="#20324a" font-weight="400">启动时重建管理器和计划</text>
<text x="74" y="324" font-size="19" fill="#20324a" font-weight="400">SQLite 或 PostgreSQL</text>
<text x="74" y="353" font-size="19" fill="#20324a" font-weight="400">不记录每个工具动作的事务</text>
<rect x="518" y="195" width="402" height="197" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="538" y="230" font-size="23" fill="#137b6d" font-weight="700">对话状态 · 持久化</text>
<text x="538" y="266" font-size="19" fill="#20324a" font-weight="400">Memory / LangGraph checkpoint</text>
<text x="538" y="295" font-size="19" fill="#20324a" font-weight="400">UI history / JSONL 等辅助记录</text>
<text x="538" y="324" font-size="19" fill="#20324a" font-weight="400">可以继续读取与推进对话</text>
<text x="538" y="353" font-size="19" fill="#20324a" font-weight="400">不能回滚已发生的外部副作用</text>
<rect x="982" y="195" width="404" height="197" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="1002" y="230" font-size="23" fill="#137b6d" font-weight="700">知识库 · 状态驱动恢复</text>
<text x="1002" y="266" font-size="19" fill="#20324a" font-weight="400">文档状态保存在控制面</text>
<text x="1002" y="295" font-size="19" fill="#20324a" font-weight="400">本地索引按文档原子替换</text>
<text x="1002" y="324" font-size="19" fill="#20324a" font-weight="400">启动扫描 pending / 中断任务</text>
<text x="1002" y="353" font-size="19" fill="#20324a" font-weight="400">重新安排解析与索引</text>
<rect x="54" y="454" width="402" height="197" rx="15" fill="#fff4df" stroke="#95631a" stroke-width="1.3"/>
<text x="74" y="489" font-size="23" fill="#95631a" font-weight="700">Gateway 队列 · 内存</text>
<text x="74" y="525" font-size="19" fill="#20324a" font-weight="400">每 channel 默认 4 workers</text>
<text x="74" y="554" font-size="19" fill="#20324a" font-weight="400">默认 queue_maxsize=1000</text>
<text x="74" y="583" font-size="19" fill="#20324a" font-weight="400">同 session 串行，跨会话并发</text>
<text x="74" y="612" font-size="19" fill="#20324a" font-weight="400">队列满可能丢弃；重启无重放</text>
<rect x="518" y="454" width="402" height="197" rx="15" fill="#fff4df" stroke="#95631a" stroke-width="1.3"/>
<text x="538" y="489" font-size="23" fill="#95631a" font-weight="700">Teams inbox · 内存</text>
<text x="538" y="525" font-size="19" fill="#20324a" font-weight="400">单 worker 串行处理</text>
<text x="538" y="554" font-size="19" fill="#20324a" font-weight="400">job_id 与状态存于字典</text>
<text x="538" y="583" font-size="19" fill="#20324a" font-weight="400">无持久确认 / 租约 / 重试表</text>
<text x="538" y="612" font-size="19" fill="#20324a" font-weight="400">完成清理，重启丢失未完成任务</text>
<rect x="982" y="454" width="404" height="197" rx="15" fill="#fff4df" stroke="#95631a" stroke-width="1.3"/>
<text x="1002" y="489" font-size="23" fill="#95631a" font-weight="700">WS 订阅 · 内存</text>
<text x="1002" y="525" font-size="19" fill="#20324a" font-weight="400">连接断开不取消运行中的 turn</text>
<text x="1002" y="554" font-size="19" fill="#20324a" font-weight="400">重连可订阅后续 chunks</text>
<text x="1002" y="583" font-size="19" fill="#20324a" font-weight="400">漏失帧不承诺逐条 replay</text>
<text x="1002" y="612" font-size="19" fill="#20324a" font-weight="400">已保存历史用于页面校正</text>
<rect x="54" y="723" width="1332" height="106" rx="15" fill="#fff4df" stroke="#95631a" stroke-width="1.3"/>
<text x="74" y="758" font-size="23" fill="#95631a" font-weight="700">可靠性改造的方向（作者建议）</text>
<text x="74" y="794" font-size="19" fill="#20324a" font-weight="400">若要承诺跨重启执行，应增加持久任务状态、幂等键、确认与重试；不要仅把 SQLite 换成 PostgreSQL。</text>
<path d="M54,901 H1386" stroke="#d6dfe9"/>
<text x="54" y="927" font-size="15" fill="#627389" font-weight="400">原创源码示意图 · Octop 757fd12 + 锁定依赖 · 2026-09-20 · 非官方截图 / 非性能实测</text>
</svg>
