<rect x="54" y="755" width="1332" height="106" rx="15" fill="#fff4df" stroke="#95631a" stroke-width="1.3"/>
<text x="74" y="790" font-size="23" fill="#95631a" font-weight="700">工程意义</text>
<text x="74" y="826" font-size="19" fill="#20324a" font-weight="400">工具过滤应先于工具搜索；显示给模型的能力列表与真正执行时的身份、权限检查都需要成立。</text>
