<text x="538" y="539" font-size="19" fill="#20324a" font-weight="400">CheckpointTs / Memory</text>
<text x="538" y="568" font-size="19" fill="#20324a" font-weight="400">TokenQuota / Reasoning</text>
<text x="538" y="597" font-size="19" fill="#20324a" font-weight="400">KnowledgeSearchHint</text>
