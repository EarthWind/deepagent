<text x="54" y="51" font-size="17" fill="#137b6d" font-weight="700">OCTOP / SOURCE NOTES / 03</text>
<text x="54" y="106" font-size="34" fill="#20324a" font-weight="700">Agent 的能力来自组装，而不是一个巨型 Prompt</text>
<text x="54" y="148" font-size="19" fill="#56677e" font-weight="400">简化的中间件分组；顺序以 HarnessAgent._build_middleware 与 deepagents 构图为准。</text>
<rect x="54" y="197" width="402" height="180" rx="15" fill="#eaf1ff" stroke="#275dcc" stroke-width="1.3"/>
<text x="74" y="232" font-size="23" fill="#275dcc" font-weight="700">① Octop 产品配置</text>
<text x="74" y="268" font-size="19" fill="#20324a" font-weight="400">AgentRow + Provider / 模型</text>
<text x="74" y="297" font-size="19" fill="#20324a" font-weight="400">全局安全策略 + Agent override</text>
<text x="74" y="326" font-size="19" fill="#20324a" font-weight="400">Connector / Plugin / Skills</text>
<text x="74" y="355" font-size="19" fill="#20324a" font-weight="400">Cron / Knowledge / 配额</text>
<rect x="518" y="197" width="402" height="180" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="538" y="232" font-size="23" fill="#137b6d" font-weight="700">② HarnessAgentConfig</text>
<text x="538" y="268" font-size="19" fill="#20324a" font-weight="400">backend + workspace</text>
<text x="538" y="297" font-size="19" fill="#20324a" font-weight="400">tools + middleware</text>
<text x="538" y="326" font-size="19" fill="#20324a" font-weight="400">memory + checkpointer</text>
<text x="538" y="355" font-size="19" fill="#20324a" font-weight="400">bootstrap / ACP / 运行限制</text>
<rect x="982" y="197" width="404" height="180" rx="15" fill="#f0ebfb" stroke="#7052aa" stroke-width="1.3"/>
<text x="1002" y="232" font-size="23" fill="#7052aa" font-weight="700">③ deepagents 图</text>
<text x="1002" y="268" font-size="19" fill="#20324a" font-weight="400">create_deep_agent</text>
<text x="1002" y="297" font-size="19" fill="#20324a" font-weight="400">模型 → 工具 → 模型</text>
<text x="1002" y="326" font-size="19" fill="#20324a" font-weight="400">文件 / 计划 / task 子 Agent</text>
