<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="title desc">
<title id="title">上下文、长期记忆与知识库：三种不同的数据路径</title><desc id="desc">Checkpoint 保存对话执行状态；长期记忆从经历中提炼；知识库从用户文档中检索。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#73849b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1440" height="990" fill="#f8fafc"/><rect width="1440" height="8" fill="#137b6d"/>
<text x="54" y="51" font-size="17" fill="#137b6d" font-weight="700">OCTOP / SOURCE NOTES / 04</text>
<text x="54" y="106" font-size="34" fill="#20324a" font-weight="700">上下文、长期记忆与知识库：三种不同的数据路径</text>
<text x="54" y="148" font-size="19" fill="#56677e" font-weight="400">Checkpoint 保存对话执行状态；长期记忆从经历中提炼；知识库从用户文档中检索。</text>
<rect x="54" y="195" width="402" height="218" rx="15" fill="#eaf1ff" stroke="#275dcc" stroke-width="1.3"/>
<text x="74" y="230" font-size="23" fill="#275dcc" font-weight="700">运行上下文 / Checkpoint</text>
<text x="74" y="266" font-size="19" fill="#20324a" font-weight="400">当前 thread 的消息与图状态</text>
<text x="74" y="295" font-size="19" fill="#20324a" font-weight="400">恢复对话、HITL 与后续调用</text>
<text x="74" y="324" font-size="19" fill="#20324a" font-weight="400">Memory 可兼任 checkpointer</text>
<text x="74" y="353" font-size="19" fill="#20324a" font-weight="400">无 Memory 时回退 SQLite saver</text>
<text x="74" y="382" font-size="19" fill="#20324a" font-weight="400">另有 UI 历史投影 / JSONL</text>
<rect x="518" y="195" width="402" height="218" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="538" y="230" font-size="23" fill="#137b6d" font-weight="700">长期记忆 / harness-memory</text>
<text x="538" y="266" font-size="19" fill="#20324a" font-weight="400">L0 原始事件 → L1 候选</text>
<text x="538" y="295" font-size="19" fill="#20324a" font-weight="400">L2 原子事实 → L3 实体页</text>
<text x="538" y="324" font-size="19" fill="#20324a" font-weight="400">另有 episode / 日记层</text>
<text x="538" y="353" font-size="19" fill="#20324a" font-weight="400">FTS 默认；可选向量来源</text>
<text x="538" y="382" font-size="19" fill="#20324a" font-weight="400">按 Agent namespace 分区</text>
<rect x="982" y="195" width="404" height="218" rx="15" fill="#f0ebfb" stroke="#7052aa" stroke-width="1.3"/>
<text x="1002" y="230" font-size="23" fill="#7052aa" font-weight="700">知识库 / Octop RAG</text>
<text x="1002" y="266" font-size="19" fill="#20324a" font-weight="400">用户上传的文档</text>
<text x="1002" y="295" font-size="19" fill="#20324a" font-weight="400">解析 → 分块 → embedding</text>
<text x="1002" y="324" font-size="19" fill="#20324a" font-weight="400">每 KB 一份 index.sqlite</text>
<text x="1002" y="353" font-size="19" fill="#20324a" font-weight="400">Agent 调用 search_knowledge</text>
<text x="1002" y="382" font-size="19" fill="#20324a" font-weight="400">权限过滤、片段与引用</text>
<rect x="54" y="481" width="402" height="186" rx="15" fill="#eaf1ff" stroke="#275dcc" stroke-width="1.3"/>
<text x="74" y="516" font-size="23" fill="#275dcc" font-weight="700">压缩：控制窗口大小</text>
<text x="74" y="552" font-size="19" fill="#20324a" font-weight="400">识别模型 max_input_tokens</text>
<text x="74" y="581" font-size="19" fill="#20324a" font-weight="400">通常 85% 触发，保留 10%</text>
<text x="74" y="610" font-size="19" fill="#20324a" font-weight="400">无 profile 使用另一组阈值</text>
<text x="74" y="639" font-size="19" fill="#20324a" font-weight="400">摘要 + 近期消息 + 历史卸载</text>
<rect x="518" y="481" width="402" height="186" rx="15" fill="#e6f6f1" stroke="#137b6d" stroke-width="1.3"/>
<text x="538" y="516" font-size="23" fill="#137b6d" font-weight="700">召回：冻结本轮证据</text>
<text x="538" y="552" font-size="19" fill="#20324a" font-weight="400">新用户消息触发 recall</text>
<text x="538" y="581" font-size="19" fill="#20324a" font-weight="400">快照写入消息元数据</text>
<text x="538" y="610" font-size="19" fill="#20324a" font-weight="400">API 消息副本重放快照</text>
<text x="538" y="639" font-size="19" fill="#20324a" font-weight="400">工具续轮复用；后台 capture</text>
<rect x="982" y="481" width="404" height="186" rx="15" fill="#f0ebfb" stroke="#7052aa" stroke-width="1.3"/>
<text x="1002" y="516" font-size="23" fill="#7052aa" font-weight="700">检索：按需找文档证据</text>
<text x="1002" y="552" font-size="19" fill="#20324a" font-weight="400">本轮可见 KB 目录</text>
<text x="1002" y="581" font-size="19" fill="#20324a" font-weight="400">模型选择 query 与 k</text>
<text x="1002" y="610" font-size="19" fill="#20324a" font-weight="400">返回 Top-k + 字符预算</text>
<text x="1002" y="639" font-size="19" fill="#20324a" font-weight="400">检索失败不等于没有答案</text>
