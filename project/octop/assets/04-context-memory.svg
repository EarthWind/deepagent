<path d="M1184,667 L1184,775 L1142,775" fill="none" stroke="#73849b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="54" y="893" font-size="22" fill="#506279" font-weight="400">迁移不能只复制 SOUL.md：还要考虑控制面、Memory、知识库索引、附件与所选 backend。</text>
