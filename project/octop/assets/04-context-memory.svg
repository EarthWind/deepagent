<rect x="298" y="724" width="844" height="102" rx="15" fill="#edf1f6" stroke="#506279" stroke-width="1.3"/>
<text x="318" y="759" font-size="23" fill="#506279" font-weight="700">最终模型请求</text>
<text x="318" y="795" font-size="19" fill="#20324a" font-weight="400">稳定系统提示 + 压缩后的历史 + 固定召回快照 + 工具结果</text>
