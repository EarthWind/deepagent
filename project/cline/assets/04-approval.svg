<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-label="工具审批：默认策略与宿主策略分层">
<title>工具审批：默认策略与宿主策略分层</title><desc>该顺序来自 prepareToolExecution；本批工具先逐个完成准备，再进入实际执行分组。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557084"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#152d42}</style>
<rect width="1280" height="750" fill="#f3f7fa"/>
<rect width="10" height="750" fill="#087e88"/>
<text x="48" y="53" font-size="28" font-weight="700" text-anchor="start" style="fill:#152d42">工具审批：默认策略与宿主策略分层</text>
<text x="48" y="89" font-size="16" font-weight="400" text-anchor="start" style="fill:#557084">该顺序来自 prepareToolExecution；本批工具先逐个完成准备，再进入实际执行分组。</text>
<g data-card="true"><rect x="48" y="136" width="356" height="139" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="150" width="5" height="111" rx="2" fill="#4a61ba"/>
<text x="68" y="169" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">① 解析 / 前置 hook</text>
<text x="68" y="201" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">坏 JSON → skip</text>
<text x="68" y="228" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">beforeTool 可修改 input / policy</text>
<text x="68" y="255" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">Plan guard 可在审批之前阻断</text>
</g>
<g data-card="true"><rect x="462" y="136" width="356" height="139" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="462" y="150" width="5" height="111" rx="2" fill="#087e88"/>
<text x="482" y="169" font-size="21" font-weight="700" text-anchor="start" style="fill:#087e88">② 合并与检查 policy</text>
<text x="482" y="201" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">通配 * → 单工具 → hook override</text>
<text x="482" y="228" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">enabled=false → 拒绝执行</text>
<text x="482" y="255" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">autoApprove=false → 请求审批</text>
</g>
<g data-card="true"><rect x="876" y="136" width="356" height="139" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="876" y="150" width="5" height="111" rx="2" fill="#a56b16"/>
<text x="896" y="169" font-size="21" font-weight="700" text-anchor="start" style="fill:#a56b16">③ requestToolApproval</text>
<text x="896" y="201" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">宿主检查最新配置 / 展示 UI</text>
<text x="896" y="228" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">无 callback 或拒绝 → 错误结果</text>
<text x="896" y="255" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">批准 → 执行器</text>
</g>
<path d="M404 204 L462 204" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M818 204 L876 204" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="48" y="342" width="560" height="150" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="356" width="5" height="122" rx="2" fill="#af4d4b"/>
<text x="68" y="375" font-size="21" font-weight="700" text-anchor="start" style="fill:#af4d4b">底层 Agent 默认</text>
<text x="68" y="407" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">未列出工具：enabled / auto-approved</text>
<text x="68" y="434" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">没有自动具备文件访问边界</text>
<text x="68" y="461" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">自定义应用需明确配置权限策略</text>
</g>
<g data-card="true"><rect x="652" y="342" width="580" height="150" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="652" y="356" width="5" height="122" rx="2" fill="#087e88"/>
<text x="672" y="375" font-size="21" font-weight="700" text-anchor="start" style="fill:#087e88">VS Code 适配层</text>
<text x="672" y="407" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">UI 管理的工具设 autoApprove=false</text>
<text x="672" y="434" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">每次都经过 callback，再读取当前开关</text>
<text x="672" y="461" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">无需重新建会话，也能响应自动批准设置变化</text>
</g>
<path d="M1054 275 L1054 342" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="48" y="558" width="1184" height="100" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="572" width="5" height="72" rx="2" fill="#4a61ba"/>
<text x="68" y="591" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">执行权的最终边界</text>
<text x="68" y="623" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">工具策略决定是否调用；executor 决定访问什么；进程 / 容器 / 服务端权限决定实际可达范围。</text>
</g>
<text x="48" y="724" font-size="15" font-weight="400" text-anchor="start" style="fill:#557084">拒绝工具会形成 tool-result error 并反馈给模型，不自动等同于取消整个任务。</text>
</svg>
