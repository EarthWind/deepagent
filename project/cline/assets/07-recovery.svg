<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="恢复：会话状态与工作树快照分开管理">
<title>恢复：会话状态与工作树快照分开管理</title><desc>当前 SDK 检查点在新用户轮次首次模型请求前创建；不是每次工具结束后自动创建独立快照。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557084"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#152d42}</style>
<rect width="1280" height="760" fill="#f3f7fa"/>
<rect width="10" height="760" fill="#087e88"/>
<text x="48" y="53" font-size="28" font-weight="700" text-anchor="start" style="fill:#152d42">恢复：会话状态与工作树快照分开管理</text>
<text x="48" y="89" font-size="16" font-weight="400" text-anchor="start" style="fill:#557084">当前 SDK 检查点在新用户轮次首次模型请求前创建；不是每次工具结束后自动创建独立快照。</text>
<g data-card="true"><rect x="48" y="132" width="568" height="175" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="146" width="5" height="147" rx="2" fill="#4a61ba"/>
<text x="68" y="165" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">会话层</text>
<text x="68" y="197" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">SQLite：session / agent / parent / status</text>
<text x="68" y="224" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">消息与其他工件：通过路径关联</text>
<text x="68" y="251" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">初始化 SQLite 失败可回退文件服务</text>
<text x="68" y="278" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">消息回退与 workspace 回退可分别控制</text>
</g>
<g data-card="true"><rect x="664" y="132" width="568" height="175" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="664" y="146" width="5" height="147" rx="2" fill="#087e88"/>
<text x="684" y="165" font-size="21" font-weight="700" text-anchor="start" style="fill:#087e88">Git 检查点层</text>
<text x="684" y="197" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">stash 兼容 snapshot + 未忽略的 untracked</text>
<text x="684" y="224" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">refs/cline/checkpoints/{session}/{runCount}</text>
<text x="684" y="251" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">scratch index 位于 Cline 数据目录</text>
<text x="684" y="278" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">干净或退化情形可记录 HEAD</text>
</g>
<g data-card="true"><rect x="48" y="373" width="568" height="140" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="387" width="5" height="112" rx="2" fill="#a56b16"/>
<text x="68" y="406" font-size="21" font-weight="700" text-anchor="start" style="fill:#a56b16">对象内 restore</text>
<text x="68" y="438" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">恢复消息，重置 run 状态 / usage</text>
<text x="68" y="465" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">保留工具、hooks、model、listeners</text>
<text x="68" y="492" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">不恢复终端进程或远端系统</text>
</g>
<g data-card="true"><rect x="664" y="373" width="568" height="140" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="664" y="387" width="5" height="112" rx="2" fill="#af4d4b"/>
<text x="684" y="406" font-size="21" font-weight="700" text-anchor="start" style="fill:#af4d4b">工作树 restore</text>
<text x="684" y="438" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">先保护用户后来创建的提交</text>
<text x="684" y="465" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">核对 HEAD 与 checkpoint 基准</text>
<text x="684" y="492" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">按快照类型执行 Git 恢复操作</text>
</g>
<path d="M332 307 L332 373" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M948 307 L948 373" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="48" y="577" width="1184" height="92" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="591" width="5" height="64" rx="2" fill="#af4d4b"/>
<text x="68" y="610" font-size="21" font-weight="700" text-anchor="start" style="fill:#af4d4b">外部副作用不在 Git 快照中：HTTP 请求、数据库更新、远端部署、邮件与其他进程。</text>
</g>
<text x="48" y="734" font-size="15" font-weight="400" text-anchor="start" style="fill:#557084">本图按固定源码绘制；官方产品文档的 shadow Git / per-tool 描述与当前 SDK 路径存在版本差异。</text>
</svg>
