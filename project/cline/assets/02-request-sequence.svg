<text x="310.0" y="584.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">用户批准 / 拒绝</text>
<path d="M465 643 L785 643" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="625.0" y="633.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">解决审批 Promise</text>
<path d="M785 692 L1100 692" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="942.5" y="682.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">批准后执行 / 结果回到模型</text>
<text x="48" y="764" font-size="15" font-weight="400" text-anchor="start" style="fill:#557084">返回 UI：Agent 事件 → Core 事件 → message translator → partial-message / state 订阅。</text>
