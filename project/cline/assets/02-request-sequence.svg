<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-label="一次用户请求：审批是执行链上的等待点">
<title>一次用户请求：审批是执行链上的等待点</title><desc>示例展示一个需要审批的工具调用；循环可包含多次模型请求、多个工具与更多用户输入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557084"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#152d42}</style>
<rect width="1280" height="790" fill="#f3f7fa"/>
<rect width="10" height="790" fill="#087e88"/>
<text x="48" y="53" font-size="28" font-weight="700" text-anchor="start" style="fill:#152d42">一次用户请求：审批是执行链上的等待点</text>
<text x="48" y="89" font-size="16" font-weight="400" text-anchor="start" style="fill:#557084">示例展示一个需要审批的工具调用；循环可包含多次模型请求、多个工具与更多用户输入。</text>
