<text x="63" y="158" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">Webview</text>
</g>
<path d="M155 205 L155 701" stroke="#bdcddd" stroke-dasharray="5 6"/>
<g data-card="true"><rect x="353" y="125" width="224" height="68" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="353" y="139" width="5" height="40" rx="2" fill="#4a61ba"/>
<text x="373" y="158" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">SDK 适配器</text>
</g>
<path d="M465 205 L465 701" stroke="#bdcddd" stroke-dasharray="5 6"/>
<g data-card="true"><rect x="673" y="125" width="224" height="68" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="673" y="139" width="5" height="40" rx="2" fill="#4a61ba"/>
<text x="693" y="158" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">Core / Agent</text>
</g>
<path d="M785 205 L785 701" stroke="#bdcddd" stroke-dasharray="5 6"/>
<g data-card="true"><rect x="988" y="125" width="224" height="68" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="988" y="139" width="5" height="40" rx="2" fill="#4a61ba"/>
<text x="1008" y="158" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">模型 / 执行器</text>
</g>
<path d="M1100 205 L1100 701" stroke="#bdcddd" stroke-dasharray="5 6"/>
<path d="M155 228 L465 228" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310.0" y="218.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">用户请求 / RPC</text>
<path d="M465 289 L785 289" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625.0" y="279.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">start / send</text>
<path d="M785 350 L1100 350" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="942.5" y="340.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">请求模型事件流</text>
<path d="M1100 411 L785 411" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="942.5" y="401.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">完整工具参数</text>
<path d="M785 472 L465 472" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="625.0" y="462.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">requestToolApproval</text>
<path d="M465 533 L155 533" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310.0" y="523.0" font-size="15" font-weight="400" text-anchor="middle" style="fill:#557084">虚拟 Diff + ask 消息</text>
