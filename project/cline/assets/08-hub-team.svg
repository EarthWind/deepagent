<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Hub 与团队：在循环之外增加协调层">
<title>Hub 与团队：在循环之外增加协调层</title><desc>该图表示可选部署能力；当前 VS Code 使用 local，并显式关闭 spawn-agent 与 agent-teams。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#557084"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#152d42}</style>
<rect width="1280" height="760" fill="#f3f7fa"/>
<rect width="10" height="760" fill="#087e88"/>
<text x="48" y="53" font-size="28" font-weight="700" text-anchor="start" style="fill:#152d42">Hub 与团队：在循环之外增加协调层</text>
<text x="48" y="89" font-size="16" font-weight="400" text-anchor="start" style="fill:#557084">该图表示可选部署能力；当前 VS Code 使用 local，并显式关闭 spawn-agent 与 agent-teams。</text>
<g data-card="true"><rect x="48" y="132" width="330" height="147" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="146" width="5" height="119" rx="2" fill="#4a61ba"/>
<text x="68" y="165" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">客户端 / 触发源</text>
<text x="68" y="197" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">CLI / Desktop / 应用</text>
<text x="68" y="224" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">会话命令、用户输入、审批</text>
<text x="68" y="251" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">连接与 UI 可独立断开</text>
</g>
<g data-card="true"><rect x="458" y="132" width="364" height="147" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="458" y="146" width="5" height="119" rx="2" fill="#087e88"/>
<text x="478" y="165" font-size="21" font-weight="700" text-anchor="start" style="fill:#087e88">Hub 服务</text>
<text x="478" y="197" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">会话 / run / approval handlers</text>
<text x="478" y="224" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">执行会话不依赖单个面板</text>
<text x="478" y="251" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">客户端按 sequence 订阅事件</text>
</g>
<g data-card="true"><rect x="902" y="132" width="330" height="147" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="902" y="146" width="5" height="119" rx="2" fill="#a56b16"/>
<text x="922" y="165" font-size="21" font-weight="700" text-anchor="start" style="fill:#a56b16">事件日志</text>
<text x="922" y="197" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">广播前持久化</text>
<text x="922" y="224" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">全局递增 sequence</text>
<text x="922" y="251" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">sinceSequence → 分页重放</text>
</g>
<path d="M378 205 L458 205" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M822 205 L902 205" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 279 L640 350" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="458" y="350" width="774" height="153" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="458" y="364" width="5" height="125" rx="2" fill="#4a61ba"/>
<text x="478" y="383" font-size="21" font-weight="700" text-anchor="start" style="fill:#4a61ba">可选团队与委派</text>
<text x="478" y="415" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">Core 的 spawn_agent / delegated agent / multi-agent</text>
<text x="478" y="442" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">成员、任务、消息、运行队列与持久状态</text>
<text x="478" y="469" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">工具权限、审批、预算与工作目录竞争需要独立管理</text>
</g>
<g data-card="true"><rect x="48" y="350" width="330" height="153" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="364" width="5" height="125" rx="2" fill="#087e88"/>
<text x="68" y="383" font-size="21" font-weight="700" text-anchor="start" style="fill:#087e88">每个执行实例</text>
<text x="68" y="415" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">AgentRuntime</text>
<text x="68" y="442" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">Model + tools + hooks</text>
<text x="68" y="469" font-size="16" font-weight="400" text-anchor="start" style="fill:#152d42">各自的消息与运行状态</text>
</g>
<path d="M458 426 L378 426" fill="none" stroke="#557084" stroke-width="2" marker-end="url(#arrow)"/>
<g data-card="true"><rect x="48" y="569" width="1184" height="100" rx="12" fill="white" stroke="#d3dfe8" stroke-width="1.5"/><rect x="48" y="583" width="5" height="72" rx="2" fill="#af4d4b"/>
<text x="68" y="602" font-size="21" font-weight="700" text-anchor="start" style="fill:#af4d4b">UI 事件重放 ≠ 再次执行工具；框架支持团队 ≠ 每个客户端默认启用团队。</text>
</g>
<text x="48" y="734" font-size="15" font-weight="400" text-anchor="start" style="fill:#557084">Hub 日志有保留与分页语义；持久事件流不是对工具副作用的 exactly-once 保证。</text>
</svg>
