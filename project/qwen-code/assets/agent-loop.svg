<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Qwen Code Agent 主循环时序</title>
  <desc id="desc">用户请求经过宿主、会话编排、模型流和工具调度，再以 ToolResult 进入下一轮</desc>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#15142c"/></linearGradient>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#93a5c7"/></marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#63e5ff"/></marker>
    <filter id="shL"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1440" height="1000" rx="24" fill="url(#bgL)"/>
  <text x="70" y="66" fill="#f6f8ff" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="34" font-weight="800">Agent 主循环：模型提出动作，宿主执行动作</text>
  <text x="70" y="100" fill="#92a3c0" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="16">一次工具调用会跨越两个模型 turn；call id 与 function response 必须严格配对</text>
  <rect x="70" y="122" width="1300" height="4" rx="2" fill="#63e5ff"/>

  <g font-family="'Noto Sans SC', system-ui, sans-serif" filter="url(#shL)">
    <g><rect x="70" y="158" width="220" height="70" rx="14" fill="#11253c" stroke="#4bdaf5"/><text x="180" y="190" text-anchor="middle" fill="#f0fbff" font-size="19" font-weight="750">Host</text><text x="180" y="212" text-anchor="middle" fill="#90b8ca" font-size="13">TUI / Headless / ACP</text></g>
    <g><rect x="355" y="158" width="240" height="70" rx="14" fill="#1b2046" stroke="#8f84ff"/><text x="475" y="190" text-anchor="middle" fill="#f4f2ff" font-size="19" font-weight="750">LlmClient</text><text x="475" y="212" text-anchor="middle" fill="#aaa8ce" font-size="13">session orchestrator</text></g>
    <g><rect x="660" y="158" width="240" height="70" rx="14" fill="#271a42" stroke="#df79d0"/><text x="780" y="190" text-anchor="middle" fill="#fff2fb" font-size="19" font-weight="750">Turn + LlmChat</text><text x="780" y="212" text-anchor="middle" fill="#c5a4c0" font-size="13">one provider stream</text></g>
    <g><rect x="965" y="158" width="240" height="70" rx="14" fill="#173330" stroke="#55dfa1"/><text x="1085" y="190" text-anchor="middle" fill="#ecfff7" font-size="19" font-weight="750">Tool Scheduler</text><text x="1085" y="212" text-anchor="middle" fill="#98c7b7" font-size="13">authorize + execute</text></g>
  </g>

  <g stroke="#40506d" stroke-width="2" stroke-dasharray="6 8">
    <path d="M180 240v660"/><path d="M475 240v660"/><path d="M780 240v660"/><path d="M1085 240v660"/>
  </g>

  <g font-family="'Noto Sans SC', system-ui, sans-serif" font-size="15">
    <g stroke="#93a5c7" stroke-width="2" fill="none" marker-end="url(#arrL)">
      <path d="M180 276H465"/><path d="M475 348H770"/><path d="M780 680H485"/><path d="M475 743H1075"/><path d="M1085 822H485"/><path d="M475 886H190"/>
    </g>
    <g stroke="#63e5ff" stroke-width="2.5" fill="none" marker-end="url(#arrC)">
      <path d="M780 410H485"/><path d="M780 466H485"/><path d="M780 530H485"/><path d="M780 590H485"/>
    </g>
    <g fill="#dce5f7">
      <text x="325" y="267" text-anchor="middle">UserPrompt / ToolResult</text>
      <text x="625" y="339" text-anchor="middle">turn.run(model, request)</text>
      <text x="620" y="401" text-anchor="middle" fill="#8deeff">Thought / Content delta</text>
      <text x="620" y="457" text-anchor="middle" fill="#8deeff">Retry / ModelFallback</text>
      <text x="620" y="521" text-anchor="middle" fill="#8deeff">ToolCallRequest(callId, args)</text>
      <text x="620" y="581" text-anchor="middle" fill="#8deeff">Finished / Error / Compressed</text>
      <text x="630" y="670" text-anchor="middle">yield standardized events</text>
      <text x="780" y="734" text-anchor="middle">schedule(calls) · permissions · hooks</text>
      <text x="780" y="813" text-anchor="middle">ToolResult(callId, response)</text>
      <text x="325" y="877" text-anchor="middle">render / stream protocol</text>
    </g>

    <rect x="402" y="304" width="756" height="342" rx="18" fill="#152039" fill-opacity=".38" stroke="#526686" stroke-dasharray="5 6"/>
    <text x="1138" y="329" text-anchor="end" fill="#8195b5" font-size="13" font-weight="700">MODEL TURN</text>
    <rect x="402" y="706" width="756" height="148" rx="18" fill="#15302d" fill-opacity=".42" stroke="#4a8c77" stroke-dasharray="5 6"/>
    <text x="1138" y="730" text-anchor="end" fill="#79b9a2" font-size="13" font-weight="700">SIDE-EFFECT BOUNDARY</text>

    <g transform="translate(90 920)">
      <circle cx="10" cy="10" r="7" fill="#63e5ff"/><text x="28" y="15" fill="#9eb0cc">模型事件</text>
      <circle cx="170" cy="10" r="7" fill="#93a5c7"/><text x="188" y="15" fill="#9eb0cc">宿主控制流</text>
      <circle cx="350" cy="10" r="7" fill="#55dfa1"/><text x="368" y="15" fill="#9eb0cc">副作用发生区</text>
    </g>
  </g>
  <text x="1360" y="960" text-anchor="end" fill="#667690" font-family="Inter, system-ui, sans-serif" font-size="13">SOURCE: client.ts · turn.ts · llm-chat.ts · use-llm-stream.ts</text>
</svg>
