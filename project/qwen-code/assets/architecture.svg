<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen Code 总体架构</title>
  <desc id="desc">从产品宿主到核心运行时、模型协议、工具治理和持久状态的分层架构</desc>
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#12152c"/></linearGradient>
    <linearGradient id="flowA" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#62e5ff"/><stop offset=".5" stop-color="#9084ff"/><stop offset="1" stop-color="#ff79c6"/></linearGradient>
    <filter id="shadowA"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#8195bd"/></marker>
  </defs>
  <rect width="1440" height="900" rx="24" fill="url(#bgA)"/>
  <text x="70" y="70" fill="#f5f8ff" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="34" font-weight="800">Qwen Code 总体架构</text>
  <text x="70" y="104" fill="#91a1bd" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="16">多个产品面共享一个 Agent Core；模型提出动作，宿主拥有副作用</text>
  <rect x="70" y="125" width="1300" height="4" rx="2" fill="url(#flowA)"/>

  <g font-family="'Noto Sans SC', system-ui, sans-serif" filter="url(#shadowA)">
