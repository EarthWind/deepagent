    <text x="98" y="194" fill="#70e7fb" font-size="15" font-weight="700">产品与宿主层 · SURFACES</text>
    <g fill="#182b48" stroke="#3b6080">
      <rect x="98" y="214" width="190" height="48" rx="11"/><rect x="310" y="214" width="190" height="48" rx="11"/>
      <rect x="522" y="214" width="190" height="48" rx="11"/><rect x="734" y="214" width="190" height="48" rx="11"/>
      <rect x="946" y="214" width="190" height="48" rx="11"/><rect x="1158" y="214" width="184" height="48" rx="11"/>
