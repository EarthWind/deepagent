      <rect x="745" y="720" width="182" height="72" rx="12"/><rect x="949" y="720" width="182" height="72" rx="12"/><rect x="1153" y="720" width="189" height="72" rx="12"/>
    </g>
    <g fill="#e9fff7" text-anchor="middle">
      <text x="836" y="661" font-size="17" font-weight="730">Tool Registry</text><text x="836" y="682" fill="#9ec8bd" font-size="13">lazy · deferred</text>
      <text x="1040" y="661" font-size="17" font-weight="730">Permissions</text><text x="1040" y="682" fill="#9ec8bd" font-size="13">rules · auto mode</text>
      <text x="1247" y="661" font-size="17" font-weight="730">MCP / Extensions</text><text x="1247" y="682" fill="#9ec8bd" font-size="13">external capabilities</text>
      <text x="836" y="751" font-size="17" font-weight="730">Session Store</text><text x="836" y="772" fill="#9ec8bd" font-size="13">JSONL · snapshots</text>
      <text x="1040" y="751" font-size="17" font-weight="730">Context</text><text x="1040" y="772" fill="#9ec8bd" font-size="13">compact · memory</text>
      <text x="1247" y="751" font-size="17" font-weight="730">Teams / Workflow</text><text x="1247" y="772" fill="#9ec8bd" font-size="13">dispatch · journal</text>
    </g>
