      <text x="387" y="416" font-size="19" font-weight="750">Turn + LlmChat</text><text x="387" y="444" fill="#aaa8cc" font-size="14">single model stream</text><text x="387" y="470" fill="#aaa8cc" font-size="14">retry · fallback · repair</text>
