      <rect x="632" y="383" width="245" height="118" rx="14"/><rect x="899" y="383" width="205" height="118" rx="14"/>
      <rect x="1126" y="383" width="216" height="118" rx="14"/>
    </g>
    <g fill="#f3f1ff">
