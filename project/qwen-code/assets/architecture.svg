    <text x="382" y="657" fill="#fff0fa" text-anchor="middle" font-size="19" font-weight="750">ContentGenerator + Canonical Content / Part</text>
    <text x="382" y="678" fill="#c9a8c0" text-anchor="middle" font-size="13">converter · stream guard · logging · prompt cache</text>
