<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Qwen Code 多 Agent 与运行界面</title>
  <desc id="desc">主 Agent 通过 SubAgent、Teams 和 Workflow 调度独立 AgentCore，并由不同宿主界面访问</desc>
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#1a1330"/></linearGradient>
    <linearGradient id="headR" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ee5ff"/><stop offset=".5" stop-color="#9084ff"/><stop offset="1" stop-color="#ff78c7"/></linearGradient>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#8c9ebc"/></marker>
    <filter id="shR"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".27"/></filter>
  </defs>
  <rect width="1440" height="850" rx="24" fill="url(#bgR)"/>
  <text x="70" y="66" fill="#f7f8ff" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="34" font-weight="800">多 Agent：复用运行时，逐级增加协作状态</text>
  <text x="70" y="100" fill="#98a6c0" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="16">SubAgent 是独立循环；Teams 增加通信；Workflow 增加确定性编排与恢复</text>
  <rect x="70" y="122" width="1300" height="4" rx="2" fill="url(#headR)"/>

  <g font-family="'Noto Sans SC', system-ui, sans-serif" filter="url(#shR)">
    <rect x="420" y="163" width="600" height="110" rx="20" fill="#192047" stroke="#9186ff" stroke-width="2"/>
    <text x="720" y="202" text-anchor="middle" fill="#f5f3ff" font-size="23" font-weight="790">Main Agent · LlmClient</text>
    <text x="720" y="232" text-anchor="middle" fill="#aaa8cf" font-size="15">主会话上下文 · 权限模式 · Tool Registry · Session Store</text>
    <text x="720" y="255" text-anchor="middle" fill="#7f82a9" font-size="13">agent / create_sub_session / workflow / team tools</text>

    <rect x="70" y="370" width="370" height="250" rx="19" fill="#11273b" stroke="#54daf4"/>
    <text x="98" y="407" fill="#79e9fb" font-size="15" font-weight="800">SUBAGENT · 有边界的一次派工</text>
    <rect x="98" y="432" width="314" height="83" rx="12" fill="#17354b" stroke="#3f7186"/>
    <text x="255" y="464" text-anchor="middle" fill="#effcff" font-size="18" font-weight="750">AgentCore</text>
    <text x="255" y="489" text-anchor="middle" fill="#9bbcca" font-size="13">独立 model loop + scheduler</text>
    <text x="98" y="550" fill="#9eb4c1" font-size="14">• foreground / background</text>
    <text x="98" y="576" fill="#9eb4c1" font-size="14">• model / tools / fork_turns / profile</text>
    <text x="98" y="602" fill="#9eb4c1" font-size="14">• optional Git worktree</text>

    <rect x="535" y="370" width="370" height="250" rx="19" fill="#211d43" stroke="#8f83ff"/>
    <text x="563" y="407" fill="#b3aaff" font-size="15" font-weight="800">AGENT TEAMS · 持续协作</text>
    <g fill="#2b2957" stroke="#5e5aa4">
      <circle cx="630" cy="474" r="40"/><circle cx="720" cy="474" r="40"/><circle cx="810" cy="474" r="40"/>
    </g>
    <g fill="#f3f1ff" text-anchor="middle" font-size="14" font-weight="700">
      <text x="630" y="479">Agent A</text><text x="720" y="479">Agent B</text><text x="810" y="479">Agent C</text>
    </g>
    <text x="563" y="550" fill="#aaa8cd" font-size="14">• named members + lifecycle</text>
    <text x="563" y="576" fill="#aaa8cd" font-size="14">• mailbox / send_message</text>
    <text x="563" y="602" fill="#aaa8cd" font-size="14">• shared task board；各端仍独立鉴权</text>

    <rect x="1000" y="370" width="370" height="250" rx="19" fill="#2b1a39" stroke="#eb78c1"/>
    <text x="1028" y="407" fill="#ff9ed7" font-size="15" font-weight="800">WORKFLOW · 可恢复编排</text>
    <rect x="1028" y="432" width="314" height="83" rx="12" fill="#392448" stroke="#804a75"/>
    <text x="1185" y="462" text-anchor="middle" fill="#fff0fa" font-size="18" font-weight="750">JavaScript Workflow</text>
    <text x="1185" y="488" text-anchor="middle" fill="#c7a7bd" font-size="13">phase · agent() · concurrency</text>
    <text x="1028" y="550" fill="#c0a8b9" font-size="14">• token budget + nesting limit</text>
    <text x="1028" y="576" fill="#c0a8b9" font-size="14">• append-only journal + snapshot</text>
    <text x="1028" y="602" fill="#c0a8b9" font-size="14">• resume after interruption</text>
  </g>

  <g fill="none" stroke="#8c9ebc" stroke-width="2" marker-end="url(#arrR)">
    <path d="M620 273L285 360"/><path d="M720 273v87"/><path d="M820 273l335 87"/>
  </g>

  <g font-family="'Noto Sans SC', system-ui, sans-serif">
    <rect x="70" y="686" width="1300" height="90" rx="17" fill="#13252d" stroke="#4b9c7c"/>
    <text x="98" y="716" fill="#75e6b0" font-size="14" font-weight="800">共享运行界面 · HOST SURFACES</text>
    <g fill="#e9fff6" font-size="15" font-weight="700" text-anchor="middle">
      <text x="230" y="752">TUI</text><text x="425" y="752">Headless</text><text x="620" y="752">SDK stream-json</text>
      <text x="860" y="752">ACP / qwen serve</text><text x="1090" y="752">IDE / Web UI</text><text x="1280" y="752">Channels</text>
    </g>
  </g>
  <text x="1370" y="817" text-anchor="end" fill="#66758d" font-family="Inter, system-ui, sans-serif" font-size="13">SOURCE: agent.ts · agent-core.ts · workflow runtime · acp-bridge</text>
</svg>
