<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">拆解 Qwen Code</title>
  <desc id="desc">展示 Qwen Code 从用户界面、Agent 运行时、模型适配到工具与状态系统的封面图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0e1630"/>
      <stop offset="1" stop-color="#181039"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#63e6ff"/>
      <stop offset=".52" stop-color="#8c7dff"/>
      <stop offset="1" stop-color="#ff75c3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#86a5d9" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="26" fill="url(#grid)"/>
  <circle cx="1140" cy="90" r="180" fill="#7747ff" opacity=".12" filter="url(#glow)"/>
  <circle cx="90" cy="640" r="220" fill="#25d8e6" opacity=".08" filter="url(#glow)"/>

  <g transform="translate(80 82)">
