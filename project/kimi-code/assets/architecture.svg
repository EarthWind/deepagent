<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Code 总体架构</title>
  <desc id="desc">从客户端表面，经适配层、工作区运行时、会话与 Agent 核心，到外部系统和持久化的分层架构</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9fd"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16314d" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52718e"/></marker>
    <style>
      .h{font:700 27px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#102b46}.t{font:700 18px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#173a5b}.s{font:14px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#58708a}.tiny{font:13px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6c8094}.box{fill:white;stroke:#c8d7e6;stroke-width:1.5}.flow{fill:none;stroke:#52718e;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="920" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="h">Kimi Code：以 agent-core-v2 为中心的多表面 Agent Runtime</text>
  <text x="60" y="86" class="s">同一会话语义经 SDK / 协议层投影到终端、Web、IDE 与服务端；模型和工具均在核心之外适配。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="122" width="1280" height="126" rx="18" fill="#eaf6ff" stroke="#abd8f4"/>
    <text x="86" y="155" class="t">交互与协议表面</text>
    <g class="box">
      <rect x="86" y="172" width="190" height="52" rx="12"/><rect x="296" y="172" width="190" height="52" rx="12"/>
      <rect x="506" y="172" width="190" height="52" rx="12"/><rect x="716" y="172" width="190" height="52" rx="12"/>
      <rect x="926" y="172" width="190" height="52" rx="12"/><rect x="1136" y="172" width="178" height="52" rx="12"/>
    </g>
    <g class="t" text-anchor="middle"><text x="181" y="205">TUI</text><text x="391" y="205">kimi -p</text><text x="601" y="205">Web</text><text x="811" y="205">ACP</text><text x="1021" y="205">VS Code</text><text x="1225" y="205">Node SDK</text></g>
  </g>

  <path d="M700 248V284" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="286" width="1060" height="104" rx="18" fill="#fff" stroke="#c8d7e6"/>
    <text x="196" y="319" class="t">接入与兼容层</text>
    <rect x="196" y="337" width="300" height="34" rx="8" fill="#f3f7fb"/>
    <rect x="514" y="337" width="300" height="34" rx="8" fill="#f3f7fb"/>
    <rect x="832" y="337" width="372" height="34" rx="8" fill="#f3f7fb"/>
    <g class="s" text-anchor="middle"><text x="346" y="360">node-sdk · KimiHarnessV2</text><text x="664" y="360">kap-server · REST / WebSocket</text><text x="1018" y="360">klient · in-memory / IPC facade</text></g>
  </g>

  <path d="M700 390V430" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="60" y="432" width="1280" height="252" rx="20" fill="#102d49" stroke="#1f557c"/>
    <text x="86" y="469" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#dff5ff">agent-core-v2</text>
    <text x="1258" y="469" text-anchor="end" font-family="Inter,sans-serif" font-size="13" fill="#7cb7d4">App → Session → Agent</text>
    <g>
      <rect x="86" y="492" width="264" height="158" rx="16" fill="#153c5d" stroke="#3479a5"/>
      <text x="108" y="524" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#75ddff">App / Feature Plane</text>
      <text x="108" y="552" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Bootstrap · DI · Feature</text>
      <text x="108" y="578" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Provider / Model Catalog</text>
      <text x="108" y="604" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">WorkspaceInstance Manager</text>
      <text x="108" y="630" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Plugin · Config · Search Index</text>
    </g>
    <g>
      <rect x="370" y="492" width="264" height="158" rx="16" fill="#173957" stroke="#407499"/>
      <text x="392" y="524" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#8ed7ff">Workspace Program</text>
      <text x="392" y="552" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Runtime Registry + Generation</text>
      <text x="392" y="578" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">FS · Process · Watch · Terminal</text>
      <text x="392" y="604" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Trust · Git · Instructions · MCP</text>
      <text x="392" y="630" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#b7d1e4">Session Lifecycle</text>
    </g>
    <g>
      <rect x="654" y="492" width="310" height="158" rx="16" fill="#1a315d" stroke="#5c68b5"/>
      <text x="676" y="524" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#b9b7ff">Agent Execution</text>
      <text x="676" y="552" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#c8c9ea">Loop · StepRequest Queue</text>
      <text x="676" y="578" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#c8c9ea">LLM Requester · Context Projector</text>
      <text x="676" y="604" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#c8c9ea">Tool Executor · Permission Gate</text>
      <text x="676" y="630" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#c8c9ea">Compaction · Subagent</text>
    </g>
    <g>
      <rect x="984" y="492" width="330" height="158" rx="16" fill="#153e43" stroke="#2c8b8b"/>
      <text x="1006" y="524" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#81efe3">State / Wire Plane</text>
      <text x="1006" y="552" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#bae0dc">Replayable State · Immer Patches</text>
      <text x="1006" y="578" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#bae0dc">Event Dispatcher · Event Bus</text>
      <text x="1006" y="604" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#bae0dc">wire.jsonl · Blob Store</text>
      <text x="1006" y="630" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#bae0dc">Restore · Migration · Undo</text>
    </g>
  </g>

  <g class="flow"><path d="M430 684V745"/><path d="M810 684V745"/><path d="M1145 684V745"/></g>
  <g filter="url(#shadow)">
    <rect x="60" y="748" width="1280" height="114" rx="18" fill="#fff" stroke="#c8d7e6"/>
    <text x="86" y="781" class="t">外部边界</text>
    <rect x="86" y="799" width="270" height="40" rx="10" fill="#edf8ff"/><rect x="376" y="799" width="270" height="40" rx="10" fill="#f3f0ff"/>
    <rect x="666" y="799" width="270" height="40" rx="10" fill="#edf9f6"/><rect x="956" y="799" width="358" height="40" rx="10" fill="#f5f7fa"/>
    <g class="s" text-anchor="middle"><text x="221" y="824">LLM APIs / OAuth</text><text x="511" y="824">本地 OS / Remote Runtime</text><text x="801" y="824">MCP Servers / Plugins</text><text x="1135" y="824">~/.kimi-code / sessions / minidb</text></g>
  </g>
  <text x="60" y="894" class="tiny">关键边界：UI 不直接依赖内核；Workspace 不是 DI Scope；副作用由 Runtime 与 Tool Plane 承担。</text>
</svg>
