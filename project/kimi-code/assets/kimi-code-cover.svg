    <path d="M85 61h54M85 82h42M85 103h61" stroke="#dff7ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="162" cy="35" r="8" fill="#42d7ff" filter="url(#glow)"/>
    <text x="112" y="190" text-anchor="middle" fill="#b9c9df" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">AGENT LOOP V2</text>
  </g>
  <g transform="translate(690 374)" font-family="Inter,Arial,sans-serif">
    <rect width="178" height="104" rx="18" fill="#162344" stroke="#6658aa"/>
    <text x="89" y="37" text-anchor="middle" fill="#bfaeff" font-size="15" font-weight="700">TOOL PLANE</text>
    <text x="89" y="69" text-anchor="middle" fill="#d7e8f8" font-size="17">调度 · 权限</text>
    <text x="89" y="91" text-anchor="middle" fill="#8ca8bf" font-size="14">MCP · Skill</text>
  </g>
  <g transform="translate(936 374)" font-family="Inter,Arial,sans-serif">
    <rect width="178" height="104" rx="18" fill="#102d3d" stroke="#258b96"/>
    <text x="89" y="37" text-anchor="middle" fill="#66f0df" font-size="15" font-weight="700">STATE PLANE</text>
    <text x="89" y="69" text-anchor="middle" fill="#d7e8f8" font-size="17">Event · Wire</text>
    <text x="89" y="91" text-anchor="middle" fill="#8ca8bf" font-size="14">Replay · Undo</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 8" opacity="0.75">
    <path d="M325 426H410"/><path d="M634 426H690"/><path d="M868 426H936"/>
  </g>

  <text x="72" y="578" fill="#6f8aa3" font-family="Inter,Arial,sans-serif" font-size="15">Source snapshot · v0.40.1 · agent-core-v2</text>
  <text x="1128" y="578" text-anchor="end" fill="#6f8aa3" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15">大模型 Agent 工程视角</text>
