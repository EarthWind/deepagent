<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Code 源码实现解析</title>
  <desc id="desc">展示模型、Agent Loop、工具与持久化之间关系的深色技术封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="0.55" stop-color="#0b1d36"/>
      <stop offset="1" stop-color="#15113a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d7ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6ea8d6" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="95" r="170" fill="#704dff" opacity="0.12"/>
  <circle cx="900" cy="570" r="230" fill="#20c9ff" opacity="0.07"/>

  <g transform="translate(72 70)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#102d49" stroke="#42d7ff" stroke-opacity="0.45"/>
    <text x="75" y="23" text-anchor="middle" fill="#9beaff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">SOURCE STUDY</text>
    <text x="0" y="112" fill="#f2f7ff" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="800">Kimi Code</text>
    <text x="0" y="172" fill="url(#accent)" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700">生产级 Coding Agent 源码解析</text>
    <text x="2" y="222" fill="#9fb3ca" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23">从一次 Prompt，到可授权、可压缩、可恢复的执行系统</text>
  </g>

  <g transform="translate(104 374)" font-family="Inter,Arial,sans-serif">
    <rect width="220" height="104" rx="18" fill="#0d2943" stroke="#2d6d98"/>
    <text x="110" y="37" text-anchor="middle" fill="#65ddff" font-size="15" font-weight="700">MODEL ADAPTER</text>
    <text x="110" y="69" text-anchor="middle" fill="#d7e8f8" font-size="17">OpenAI · Anthropic</text>
    <text x="110" y="91" text-anchor="middle" fill="#8ca8bf" font-size="14">Google · Kimi Traits</text>
  </g>
  <g transform="translate(410 345)">
    <circle cx="112" cy="82" r="82" fill="#132750" stroke="#7f7cff" stroke-width="2"/>
