<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Code agent-core-v2 主循环时序</title>
  <desc id="desc">用户请求进入队列、构造步骤、请求模型、执行工具、写入事件并继续循环的完整时序</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f0f4fb"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#496987"/></marker>
    <style>.h{font:700 27px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#102b46}.actor{font:700 16px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#173a5b}.txt{font:14px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#36546e}.muted{font:13px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#71869b}.life{stroke:#aebdcb;stroke-width:1.5;stroke-dasharray:6 7}.msg{stroke:#496987;stroke-width:2;fill:none;marker-end:url(#arr)}.evt{stroke:#27a4a4;stroke-width:2;fill:none;marker-end:url(#arr)}.ret{stroke:#7a67ba;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1400" height="940" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="h">一次 Turn 的真实闭环：Queue → Step → LLM → Tool → Event → Next Step</text>
  <text x="60" y="86" class="muted">每个 Agent 同时只有一个 active turn；工具结果进入上下文后，ContinuationStepRequest 驱动下一步。</text>

  <g>
    <rect x="55" y="116" width="170" height="50" rx="12" fill="#e7f4ff" stroke="#9bcdf0"/><text x="140" y="147" text-anchor="middle" class="actor">Client / SDK</text>
    <rect x="283" y="116" width="185" height="50" rx="12" fill="#ecf4ff" stroke="#a8c5e5"/><text x="375" y="147" text-anchor="middle" class="actor">AgentLoopService</text>
    <rect x="526" y="116" width="184" height="50" rx="12" fill="#f1efff" stroke="#bdb5ed"/><text x="618" y="147" text-anchor="middle" class="actor">LLMRequester</text>
    <rect x="768" y="116" width="184" height="50" rx="12" fill="#f5f0ff" stroke="#c3b2ee"/><text x="860" y="147" text-anchor="middle" class="actor">Model Adapter</text>
    <rect x="1010" y="116" width="170" height="50" rx="12" fill="#edf9f6" stroke="#9fd9ce"/><text x="1095" y="147" text-anchor="middle" class="actor">Tool Executor</text>
    <rect x="1236" y="116" width="120" height="50" rx="12" fill="#eaf9f9" stroke="#9bd4d4"/><text x="1296" y="147" text-anchor="middle" class="actor">State/Wire</text>
    <g class="life"><line x1="140" y1="166" x2="140" y2="876"/><line x1="375" y1="166" x2="375" y2="876"/><line x1="618" y1="166" x2="618" y2="876"/><line x1="860" y1="166" x2="860" y2="876"/><line x1="1095" y1="166" x2="1095" y2="876"/><line x1="1296" y1="166" x2="1296" y2="876"/></g>
  </g>

  <path d="M140 204H375" class="msg"/><text x="250" y="195" text-anchor="middle" class="txt">submit(NewTurnRequest)</text>
  <rect x="304" y="220" width="142" height="64" rx="10" fill="#fff" stroke="#b8cadb"/>
  <text x="375" y="244" text-anchor="middle" class="txt">准入 + 排队</text><text x="375" y="266" text-anchor="middle" class="muted">active / pending turn</text>

  <path d="M375 306H1296" class="evt"/><text x="820" y="297" text-anchor="middle" class="txt">dispatch turn.begin / step.begin</text>
  <rect x="294" y="322" width="162" height="78" rx="10" fill="#fff" stroke="#b8cadb"/>
  <text x="375" y="347" text-anchor="middle" class="txt">beginLoopStep</text><text x="375" y="370" text-anchor="middle" class="muted">检查 max steps</text><text x="375" y="389" text-anchor="middle" class="muted">运行 before-step hooks</text>

  <path d="M375 427H618" class="msg"/><text x="497" y="418" text-anchor="middle" class="txt">start(step context)</text>
  <rect x="540" y="443" width="156" height="104" rx="10" fill="#fff" stroke="#c8bdec"/>
  <text x="618" y="467" text-anchor="middle" class="txt">冻结 Turn 配置</text><text x="618" y="490" text-anchor="middle" class="muted">profile / model</text><text x="618" y="511" text-anchor="middle" class="muted">system / tools</text><text x="618" y="532" text-anchor="middle" class="muted">project + repair context</text>
  <path d="M618 569H860" class="msg"/><text x="739" y="560" text-anchor="middle" class="txt">stream(model request)</text>
  <path d="M860 604H618" class="ret"/><text x="739" y="595" text-anchor="middle" class="txt">part · usage · finish · timing</text>
  <path d="M618 635H1296" class="evt"/><text x="953" y="626" text-anchor="middle" class="txt">append assistant content / token usage</text>

  <path d="M375 676H1095" class="msg"/><text x="735" y="667" text-anchor="middle" class="txt">execute(tool calls)</text>
  <rect x="1016" y="692" width="158" height="86" rx="10" fill="#fff" stroke="#98d7ca"/>
  <text x="1095" y="716" text-anchor="middle" class="txt">schema 校验</text><text x="1095" y="739" text-anchor="middle" class="muted">permission gate</text><text x="1095" y="760" text-anchor="middle" class="muted">conflict-aware parallel</text>
  <path d="M1095 801H1296" class="evt"/><text x="1195" y="792" text-anchor="middle" class="txt">tool result events</text>
  <path d="M1095 832H375" class="ret"/><text x="735" y="823" text-anchor="middle" class="txt">results → context memory</text>

  <rect x="277" y="850" width="196" height="54" rx="12" fill="#122f4a"/>
  <text x="375" y="873" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#dbf6ff">有工具结果：下一 Step</text>
  <text x="375" y="893" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9fc0d7">无工具调用：完成 Turn</text>
  <path d="M277 878C225 878 238 424 304 424" fill="none" stroke="#52718e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arr)"/>
  <text x="60" y="920" class="muted">异常分支：请求过大触发媒体降级/严格投影/Full Compaction；可恢复错误由 loop handler 修复后重试当前 driver。</text>
</svg>
