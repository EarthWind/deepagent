<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Code 上下文投影、压缩与事件持久化</title>
  <desc id="desc">展示完整事件历史、模型可见上下文、投影修复、压缩以及 JSONL 回放的关系</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef3fa"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4c6c88"/></marker>
    <style>.h{font:700 27px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#102b46}.t{font:700 17px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#173a5b}.s{font:14px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#526d85}.m{font:13px Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#74879a}.flow{stroke:#4c6c88;stroke-width:2;fill:none;marker-end:url(#arr)}.dash{stroke:#7d6cba;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1400" height="940" rx="24" fill="url(#bg)"/>
  <text x="58" y="58" class="h">历史不是 Prompt：先完整记录，再投影成“模型可消费”的上下文</text>
  <text x="58" y="86" class="m">Replayable State 保留业务事实；Context Projector 修复协议结构；Full Compaction 只重写模型上下文。</text>

  <g>
    <rect x="60" y="126" width="390" height="308" rx="18" fill="#102f4b" stroke="#235b82"/>
    <text x="88" y="162" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#dff4ff">A. Event / State Plane</text>
    <rect x="88" y="188" width="334" height="58" rx="12" fill="#153e5e"/><text x="255" y="223" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#c4e1f1">dispatch(durable domain event)</text>
    <path d="M255 246V278" stroke="#70b8d6" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="88" y="282" width="150" height="104" rx="12" fill="#18385b" stroke="#39779c"/>
    <text x="163" y="314" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#86deff">Replayable State</text>
    <text x="163" y="340" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#bcd6e7">Immer patches</text><text x="163" y="362" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#bcd6e7">checkpoint / undo</text>
    <rect x="272" y="282" width="150" height="104" rx="12" fill="#153e43" stroke="#2d8c8b"/>
    <text x="347" y="314" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#7cecdf">Wire Journal</text>
    <text x="347" y="340" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#bce0dc">wire.jsonl</text><text x="347" y="362" text-anchor="middle" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#bce0dc">blob dehydration</text>
    <path d="M238 334H272" stroke="#76a8ba" stroke-width="2" marker-end="url(#arr)"/>
    <text x="88" y="416" font-family="Inter,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8fb2c7">restore：迁移协议 → 修复损坏尾部 → rehydrate blob → 静默重放</text>
  </g>

  <path d="M450 280H510" class="flow"/>
  <g>
    <rect x="512" y="126" width="380" height="308" rx="18" fill="#fff" stroke="#c5d5e4"/>
    <text x="540" y="162" class="t">B. Agent Context Memory</text>
    <text x="540" y="191" class="s">内部 ContextMessage[] 是可回放状态</text>
    <g>
      <rect x="540" y="216" width="324" height="38" rx="9" fill="#e8f5ff"/><text x="558" y="241" class="s">user：修复登录回调</text>
      <rect x="540" y="264" width="324" height="38" rx="9" fill="#f1efff"/><text x="558" y="289" class="s">assistant：分析 + tool call</text>
      <rect x="540" y="312" width="324" height="38" rx="9" fill="#edf9f6"/><text x="558" y="337" class="s">tool：文件内容 / shell 输出</text>
      <rect x="540" y="360" width="324" height="38" rx="9" fill="#f1efff"/><text x="558" y="385" class="s">assistant：下一步调用……</text>
    </g>
    <text x="540" y="420" class="m">append · clear · undo · applyCompaction</text>
  </g>

  <path d="M892 280H952" class="flow"/>
  <g>
    <rect x="954" y="126" width="386" height="308" rx="18" fill="#f2f0ff" stroke="#bab3e9"/>
    <text x="982" y="162" class="t">C. Context Projector</text>
    <text x="982" y="193" class="s">把内部历史投影为 Provider wire messages</text>
    <g class="s"><text x="982" y="228">✓ tool call / result 严格配对</text><text x="982" y="258">✓ 结果移到对应调用之后</text><text x="982" y="288">✓ 为中断调用合成结果</text><text x="982" y="318">✓ 丢弃孤儿、重复和空内容</text><text x="982" y="348">✓ strict mode 合并连续 assistant</text><text x="982" y="378">✓ resolve media + normalize tool-call ID</text></g>
    <text x="982" y="412" class="m">修复动作进入日志与 telemetry，而非静默吞掉</text>
  </g>

  <path d="M1147 434V486" class="flow"/>
  <g>
    <rect x="60" y="490" width="1280" height="326" rx="20" fill="#fff" stroke="#c5d5e4"/>
    <text x="88" y="528" class="t">D. Full Compaction：同一模型生成“状态交接”，而不是简单截断 token</text>
    <rect x="88" y="552" width="280" height="212" rx="14" fill="#fff6e4" stroke="#e8c675"/>
    <text x="112" y="584" class="t">触发</text>
    <text x="112" y="615" class="s">后台阈值：triggerRatio 0.85</text><text x="112" y="641" class="s">阻塞阈值：blockRatio 0.85</text><text x="112" y="667" class="s">请求溢出：观测有效窗口</text><text x="112" y="693" class="s">预留：50k context tokens</text><text x="112" y="719" class="s">最多 3 次 overflow recovery</text>
    <path d="M368 658H416" class="flow"/>
    <rect x="418" y="552" width="286" height="212" rx="14" fill="#eef6ff" stroke="#a7cce8"/>
    <text x="442" y="584" class="t">压缩请求</text>
    <text x="442" y="615" class="s">移除动态工具上下文</text><text x="442" y="641" class="s">携带未完成 Todo</text><text x="442" y="667" class="s">用专用 instruction 调同一 LLM</text><text x="442" y="693" class="s">若仍溢出，继续缩小输入</text><text x="442" y="719" class="s">输出为结构化工作状态摘要</text>
    <path d="M704 658H752" class="flow"/>
    <rect x="754" y="552" width="558" height="212" rx="14" fill="#edf9f6" stroke="#9bd8cc"/>
    <text x="778" y="584" class="t">Compaction Handoff（新的模型上下文）</text>
    <rect x="778" y="606" width="126" height="112" rx="10" fill="#dff4ef"/><text x="841" y="640" text-anchor="middle" class="s">最早 user</text><text x="841" y="665" text-anchor="middle" class="m">保留原始目标</text><text x="841" y="690" text-anchor="middle" class="m">head ≤ 2k</text>
    <text x="925" y="666" text-anchor="middle" class="t">＋</text>
    <rect x="950" y="606" width="126" height="112" rx="10" fill="#e8f0ff"/><text x="1013" y="640" text-anchor="middle" class="s">近期 user</text><text x="1013" y="665" text-anchor="middle" class="m">保留新意图</text><text x="1013" y="690" text-anchor="middle" class="m">总额 ≤ 20k</text>
    <text x="1097" y="666" text-anchor="middle" class="t">＋</text>
    <rect x="1122" y="606" width="166" height="112" rx="10" fill="#eeeaff"/><text x="1205" y="640" text-anchor="middle" class="s">compaction summary</text><text x="1205" y="665" text-anchor="middle" class="m">已完成 / 当前状态</text><text x="1205" y="690" text-anchor="middle" class="m">文件 / 下一步 / Todo</text>
    <text x="778" y="746" class="m">中间 user 消息若被删，会插入 elision reminder；旧 tool/system 噪声不再搬运。</text>
  </g>
  <path d="M754 816C754 870 700 870 700 434" class="dash"/>
  <text x="60" y="872" class="m">模型可见上下文被压缩，但原始 durable events 仍在 Wire / session store 中，可用于恢复、审计和 UI transcript。</text>
  <text x="60" y="906" class="m">关键区别：Context Projection 解决“协议正确性”；Compaction 解决“预算”；Wire Replay 解决“跨进程恢复”。</text>
</svg>
