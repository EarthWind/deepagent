<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Reach capability-layer architecture</title>
  <desc id="desc">The agent reads a skill, asks Agent-Reach for installation and health state, then invokes selected upstream tools directly to reach fifteen internet platforms.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6ccfe3"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#efb45e"/></marker>
    <style>
      .txt{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f3f6f8}.muted{fill:#aab5bd}.h1{font-size:38px;font-weight:800}.h2{font-size:24px;font-weight:750}.body{font-size:18px}.small{font-size:15px}.box{fill:#151b20;stroke:#3b4952;stroke-width:2}.control{fill:#10282e;stroke:#55b8cb;stroke-width:2}.data{fill:#292116;stroke:#d59a4a;stroke-width:2}.line{fill:none;stroke:#6ccfe3;stroke-width:3;marker-end:url(#arrow)}.dataLine{fill:none;stroke:#efb45e;stroke-width:4;marker-end:url(#arrowAmber)}.dash{fill:none;stroke:#73818a;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#0d1114"/>
  <text class="txt h1" x="64" y="70">Agent-Reach：控制面负责“选、装、查、教”，数据面直连上游</text>
  <text class="txt muted body" x="64" y="108">源码基线 da5044d · 15 个 Channel · Python CLI / Skill / 可选 MCP 状态接口</text>

  <rect x="64" y="170" width="270" height="620" class="box"/>
  <text class="txt h2" x="94" y="216">Agent 表面</text>
  <text class="txt muted small" x="94" y="246">任何能执行命令的 Agent</text>
  <rect x="94" y="290" width="210" height="72" class="control"/><text class="txt body" x="119" y="333">Claude Code</text>
  <rect x="94" y="384" width="210" height="72" class="control"/><text class="txt body" x="119" y="427">OpenClaw</text>
  <rect x="94" y="478" width="210" height="72" class="control"/><text class="txt body" x="119" y="521">OpenCode / Cursor</text>
  <rect x="94" y="572" width="210" height="72" class="control"/><text class="txt body" x="119" y="615">其他 Shell Agent</text>
  <rect x="94" y="690" width="210" height="68" class="data"/><text class="txt body" x="119" y="731">用户自然语言意图</text>

  <rect x="410" y="150" width="470" height="660" class="control"/>
  <text class="txt h2" x="446" y="198">Agent-Reach 控制面</text>
  <text class="txt muted small" x="446" y="228">不统一代理业务请求；维护能力可达性</text>
  <rect x="446" y="270" width="188" height="104" class="box"/>
  <text class="txt body" x="472" y="307">SKILL.md</text><text class="txt muted small" x="472" y="334">意图 → 平台 → 命令</text><text class="txt muted small" x="472" y="356">失败重试链 / 只读规则</text>
  <rect x="656" y="270" width="188" height="104" class="box"/>
  <text class="txt body" x="682" y="307">CLI</text><text class="txt muted small" x="682" y="334">install / configure</text><text class="txt muted small" x="682" y="356">doctor / watch / skill</text>
  <rect x="446" y="408" width="398" height="118" class="box"/>
  <text class="txt body" x="472" y="445">Channel Registry</text>
  <text class="txt muted small" x="472" y="473">name · tier · ordered backends · can_handle()</text>
  <text class="txt muted small" x="472" y="498">check() → status / message / active_backend</text>
  <rect x="446" y="560" width="188" height="104" class="box"/>
  <text class="txt body" x="472" y="597">Config</text><text class="txt muted small" x="472" y="624">YAML + env fallback</text><text class="txt muted small" x="472" y="646">0600 / 原子写 / 防链接</text>
  <rect x="656" y="560" width="188" height="104" class="box"/>
  <text class="txt body" x="682" y="597">Probe / Doctor</text><text class="txt muted small" x="682" y="624">真实执行轻量探针</text><text class="txt muted small" x="682" y="646">逐 Channel 故障隔离</text>
  <rect x="446" y="698" width="398" height="78" class="box"/>
  <text class="txt body" x="472" y="733">可选 MCP：只暴露 get_status</text>
  <text class="txt muted small" x="472" y="758">业务读/搜仍由 Agent 直接调用上游</text>

  <rect x="956" y="150" width="580" height="660" class="box"/>
  <text class="txt h2" x="992" y="198">上游能力与 15 个 Channel</text>
  <text class="txt muted small" x="992" y="228">同一上游可服务多个平台；每个平台也可配置回退链</text>
  <rect x="992" y="270" width="238" height="110" class="data"/>
  <text class="txt body" x="1018" y="307">浏览器会话面</text><text class="txt muted small" x="1018" y="334">OpenCLI + Chrome Bridge</text><text class="txt muted small" x="1018" y="358">X / Reddit / Meta / XHS / B站</text>
  <rect x="1260" y="270" width="238" height="110" class="data"/>
  <text class="txt body" x="1286" y="307">专用 CLI 面</text><text class="txt muted small" x="1286" y="334">twitter · rdt · bili · gh</text><text class="txt muted small" x="1286" y="358">yt-dlp · feedparser</text>
  <rect x="992" y="414" width="238" height="110" class="data"/>
  <text class="txt body" x="1018" y="451">MCP 面</text><text class="txt muted small" x="1018" y="478">mcporter → Exa / LinkedIn</text><text class="txt muted small" x="1018" y="502">xiaohongshu-mcp</text>
  <rect x="1260" y="414" width="238" height="110" class="data"/>
  <text class="txt body" x="1286" y="451">HTTP / 内置面</text><text class="txt muted small" x="1286" y="478">Jina Reader · V2EX API</text><text class="txt muted small" x="1286" y="502">雪球 API · B站搜索 API</text>
  <rect x="992" y="558" width="506" height="118" class="data"/>
  <text class="txt body" x="1018" y="596">媒体转录面</text>
  <text class="txt muted small" x="1018" y="623">yt-dlp → ffprobe → ffmpeg → 10 分钟分片</text>
  <text class="txt muted small" x="1018" y="647">Groq Whisper / OpenAI Whisper（跨商回退需显式授权）</text>
  <rect x="992" y="710" width="506" height="66" class="box"/>
  <text class="txt small" x="1018" y="739">平台层：Web · YouTube · RSS · GitHub · X · B站 · Reddit · Facebook</text>
  <text class="txt small" x="1018" y="762">Instagram · 小红书 · LinkedIn · V2EX · 雪球 · 小宇宙 · Exa Search</text>

  <path class="line" d="M334 320 C370 320 374 320 410 320"/>
  <path class="line" d="M334 490 C370 490 374 490 410 490"/>
  <path class="dash" d="M880 450 C920 450 920 450 956 450"/>
  <path class="dataLine" d="M334 724 C565 880 1088 874 1190 810"/>
  <text class="txt" x="494" y="886" font-size="18" fill="#efb45e">数据面：Agent 按 Skill 直接调用上游 CLI / MCP / HTTP；Agent-Reach 不在热路径中转发内容</text>

  <rect x="64" y="916" width="1472" height="1" fill="#344049"/>
  <circle cx="88" cy="938" r="6" fill="#6ccfe3"/><text class="txt muted small" x="104" y="944">蓝色：控制与诊断</text>
  <circle cx="316" cy="938" r="6" fill="#efb45e"/><text class="txt muted small" x="332" y="944">琥珀色：实际内容访问</text>
  <text class="txt muted small" x="1250" y="944">Source: Agent-Reach @ da5044d</text>
</svg>
