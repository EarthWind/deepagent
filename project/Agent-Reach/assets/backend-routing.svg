<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Reach ordered backend routing</title>
  <desc id="desc">A channel builds an ordered list, moves a configured override to the front, probes candidates, selects the first OK result, otherwise returns the first warning or an error/off state.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65c7da"/></marker>
    <style>.t{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f2f6f8}.m{fill:#aab5bd}.h1{font-size:38px;font-weight:800}.h2{font-size:23px;font-weight:750}.b{font-size:18px}.s{font-size:15px}.box{fill:#151b20;stroke:#3d4b54;stroke-width:2}.cyan{fill:#10282e;stroke:#55b8cb;stroke-width:2}.amber{fill:#2b2217;stroke:#d79b4a;stroke-width:2}.green{fill:#14281f;stroke:#62bd88;stroke-width:2}.red{fill:#2a1818;stroke:#d26e6e;stroke-width:2}.line{fill:none;stroke:#65c7da;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#78858d;stroke-width:2;stroke-dasharray:7 7}</style>
  </defs>
  <rect width="1600" height="940" fill="#0d1114"/>
  <text class="t h1" x="64" y="70">多后端选择：列表顺序是策略，探针结果是证据</text>
  <text class="t m b" x="64" y="108">核心不变量：先收集候选结果，再优先第一个 ok；warn 不能挡住后面的可用后端</text>

  <rect x="70" y="175" width="260" height="98" class="cyan"/><text class="t h2" x="96" y="214">Channel 定义</text><text class="t m s" x="96" y="244">name · tier · backends[]</text>
  <path class="line" d="M330 224 H410"/>
  <rect x="410" y="175" width="300" height="98" class="box"/><text class="t h2" x="436" y="214">应用用户 override</text><text class="t m s" x="436" y="244">命中前缀 → 移到列表首位</text>
  <path class="line" d="M710 224 H790"/>
  <rect x="790" y="175" width="300" height="98" class="box"/><text class="t h2" x="816" y="214">逐候选轻量探测</text><text class="t m s" x="816" y="244">真实执行 / 配置检查 / 本地状态</text>
  <path class="line" d="M1090 224 H1170"/>
  <rect x="1170" y="175" width="360" height="98" class="cyan"/><text class="t h2" x="1196" y="214">findings[]</text><text class="t m s" x="1196" y="244">backend, status, message</text>

  <path class="line" d="M1350 273 V340"/>
  <rect x="1130" y="340" width="400" height="100" class="green"/><text class="t h2" x="1156" y="379">存在 ok？</text><text class="t b" x="1156" y="411">选最靠前者；写 active_backend</text>
  <path class="line" d="M1130 390 H1020"/>
  <rect x="690" y="340" width="330" height="100" class="amber"/><text class="t h2" x="716" y="379">否则存在 warn？</text><text class="t b" x="716" y="411">返回第一条；active = null</text>
  <path class="line" d="M690 390 H580"/>
  <rect x="70" y="340" width="510" height="100" class="red"/><text class="t h2" x="96" y="379">只剩错误 / 没有候选</text><text class="t b" x="96" y="411">聚合 error，或返回 off + 修复处方</text>

  <text class="t h2" x="70" y="525">两个真实例子</text>
  <rect x="70" y="565" width="700" height="260" class="box"/>
  <text class="t h2" x="100" y="606">Bilibili</text>
  <rect x="100" y="640" width="180" height="64" class="green"/><text class="t b" x="128" y="679">bili-cli</text>
  <text class="t m b" x="298" y="679">→</text>
  <rect x="330" y="640" width="180" height="64" class="amber"/><text class="t b" x="360" y="679">OpenCLI</text>
  <text class="t m b" x="528" y="679">→</text>
  <rect x="560" y="640" width="180" height="64" class="cyan"/><text class="t b" x="584" y="679">搜索 API</text>
  <text class="t m s" x="100" y="745">bili --version 真跑；OpenCLI 看 bridge；API 做远端 GET。</text>
  <text class="t m s" x="100" y="776">第一个 ok 获胜；已安装但未登录的 warn 不会短路后续候选。</text>

  <rect x="830" y="565" width="700" height="260" class="box"/>
  <text class="t h2" x="860" y="606">XiaoHongShu</text>
  <rect x="860" y="640" width="180" height="64" class="amber"/><text class="t b" x="890" y="679">OpenCLI</text>
  <text class="t m b" x="1058" y="679">→</text>
  <rect x="1090" y="640" width="190" height="64" class="cyan"/><text class="t b" x="1111" y="679">XHS MCP</text>
  <text class="t m b" x="1298" y="679">→</text>
  <rect x="1330" y="640" width="170" height="64" class="box"/><text class="t b" x="1352" y="679">xhs-cli</text>
  <text class="t m s" x="860" y="745">桌面浏览器优先，服务器可改走 MCP，旧 CLI 仅作为存量回退。</text>
  <text class="t m s" x="860" y="776">因 Doctor 避免读取 Cookie/执行平台命令，常见结果是 warn + null。</text>

  <rect x="70" y="860" width="1460" height="46" fill="#12181c" stroke="#344149"/>
  <text class="t s" x="92" y="889">工程含义：active_backend 是“已被保守探针证明可用”的观测值，不是候选安装清单，也不保证某个目标 URL 一定成功。</text>
</svg>
